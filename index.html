        fills.splitterBody.pushObject(o, R.util.mixColor(0x101820, 0xffffff, dim));
        o.rotation.set(0, diag, 0);
        fills.splitterPlane.pushObject(o, R.util.mixColor(0x000000, 0xdcc7ff, dim));
      } else if (p.type === 'reflector') {
        o.position.set(x, PIECE_Y + 0.17 * sc, z);
        o.rotation.set(0, 0, 0);
        o.scale.set(sc, sc, sc);
        fills.reflectorCup.pushObject(o, R.util.mixColor(0x101820, 0xffffff, dim));
        o.position.y = PIECE_Y + 0.35 * sc;
        o.rotation.set(-Math.PI / 2, 0, 0);
        fills.reflectorDisc.pushObject(o, R.util.mixColor(0x000000, 0xffe6a8, dim));
      } else if (p.type === 'lamp') {
        o.position.set(x, PIECE_Y + 0.20 * sc, z);
        o.rotation.set(0, 0, 0);
        o.scale.set(sc, sc, sc);
        fills.lampBody.pushObject(o, R.util.mixColor(0x101820, 0xffffff, dim));
        o.position.set(x + R.grid.DC[p.dir] * 0.26 * sc, PIECE_Y + 0.22 * sc, z + R.grid.DR[p.dir] * 0.26 * sc);
        fills.lampNotch.pushObject(o, R.util.mixColor(0x000000, 0xffe9b0, dim));
      }
      entry = it.next();
    }
    for (var gi = 0; gi < ghostPieces.length; gi++) {
      var gp = ghostPieces[gi];
      var gt = (realClock - gp.at) / 0.24;
      var gs = Math.max(0.01, 1 - gt) * 1.1;
      var gdiag = gp.orient === 0 ? Math.PI / 4 : -Math.PI / 4;
      var gx = R.grid.worldX(gp.c);
      var gz = R.grid.worldZ(gp.r);
      var gcol = R.util.mixColor(0x000000, 0xffffff, Math.max(0, 1 - gt));
      o.position.set(gx, PIECE_Y + 0.13 * gs, gz);
      o.rotation.set(0, gp.type === 'lamp' ? 0 : gdiag, 0);
      o.scale.set(gs, gs, gs);
      var target = gp.type === 'mirror' ? fills.mirrorBody
        : gp.type === 'splitter' ? fills.splitterBody
          : gp.type === 'reflector' ? fills.reflectorCup : fills.lampBody;
      target.pushObject(o, gcol);
    }

    Object.keys(fills).forEach(function (k) { fills[k].finish(); });
  }


  /* ---------- enemies ---------- */

  var MAX_ENEMIES = 72;
  var MAX_BARS = 72;
  var UP_VEC = null;
  var travelVec = null;
  var billboardX = 0;

  /* Geometry per enemy type. Types added later fall back to the mote shape. */
  var ENEMY_SHAPE = {};

  function buildEnemies() {
    UP_VEC = new THREE.Vector3(0, 1, 0);
    travelVec = new THREE.Vector3(0, 0, 1);
    billboardX = V.TILT_DEG * Math.PI / 180 - Math.PI / 2;

    function body(geo, color, emissive, count) {
      return makeInstanced(geo, new THREE.MeshLambertMaterial({
        color: color, emissive: emissive, emissiveIntensity: 0.6
      }), count || MAX_ENEMIES);
    }

    dyn.enemyMote = body(new THREE.SphereGeometry(1, 10, 8), C.enemy.mote, 0x3a0d5c);
    dyn.enemyRunner = body(new THREE.ConeGeometry(0.85, 2.1, 6), C.enemy.runner, 0x0c4a48);
    dyn.enemySwarm = body(new THREE.TetrahedronGeometry(1.35), C.enemy.swarmling, 0x4a0e33);
    dyn.enemyBulwark = body(new THREE.BoxGeometry(1.5, 1.45, 1.5), C.enemy.bulwark, 0x1d1838);
    dyn.enemyUmbra = body(new THREE.OctahedronGeometry(1.25, 0), C.enemy.umbra, 0x3d0f6b, 8);

    ENEMY_SHAPE.mote = 'enemyMote';
    ENEMY_SHAPE.runner = 'enemyRunner';
    ENEMY_SHAPE.swarmling = 'enemySwarm';
    ENEMY_SHAPE.bulwark = 'enemyBulwark';
    ENEMY_SHAPE.bruteking = 'enemyBulwark';
    ENEMY_SHAPE.umbra = 'enemyUmbra';

    /* Brutes wear a visible shell; it is what soaks up the light. */
    dyn.enemyShell = makeInstanced(
      new THREE.BoxGeometry(1.8, 1.72, 1.8),
      additiveMaterial(null, 0x9a86ff),
      MAX_ENEMIES,
      3
    );

    var quad = new THREE.PlaneGeometry(1, 1);
    dyn.enemyGlint = makeInstanced(quad, additiveMaterial(rd.tex.glow, 0xffffff), MAX_ENEMIES, 3);
    dyn.bossRing = makeInstanced(quad, additiveMaterial(rd.tex.ring, 0xffffff), 8, 4);
    /* White base materials so the per-instance colour is the only tint. */
    dyn.barBack = makeInstanced(quad, new THREE.MeshBasicMaterial({ color: 0xffffff }), MAX_BARS, 5);
    dyn.barFill = makeInstanced(quad, new THREE.MeshBasicMaterial({ color: 0xffffff }), MAX_BARS, 6);
    dyn.enemyObj = new THREE.Object3D();
    dyn.shieldObj = new THREE.Object3D();
  }

  Filler.prototype.pushBillboard = function (x, y, z, sx, sy, colorHex) {
    var mesh = this.mesh;
    if (this.n >= mesh.instanceMatrix.count) return;
    dummy.position.set(x, y, z);
    dummy.rotation.set(billboardX, 0, 0);
    dummy.scale.set(sx, sy, 1);
    dummy.updateMatrix();
    mesh.setMatrixAt(this.n, dummy.matrix);
    mesh.setColorAt(this.n, scratchColor.setHex(colorHex));
    this.n++;
  };

  function shapeKey(type) {
    return ENEMY_SHAPE[type] || 'enemyMote';
  }

  var SPIN = { mote: 0.8, runner: 0, swarmling: 2.4, bulwark: 0.25, bruteking: 0.3, umbra: 0.5 };

  function drawEnemies(state) {
    var fills = {};
    var k;
    for (k in ENEMY_SHAPE) {
      if (!fills[ENEMY_SHAPE[k]]) fills[ENEMY_SHAPE[k]] = new Filler(dyn[ENEMY_SHAPE[k]]);
    }
    var shell = new Filler(dyn.enemyShell);
    var glint = new Filler(dyn.enemyGlint);
    var ring = new Filler(dyn.bossRing);
    var back = new Filler(dyn.barBack);
    var fill = new Filler(dyn.barFill);
    var o = dyn.enemyObj;
    var shieldPose = dyn.shieldObj;
    var list = state.enemies;

    for (var i = 0; i < list.length; i++) {
      var e = list[i];
      if (e.t < -1) continue;
      var fade = R.util.clamp(e.t + 1, 0, 1);
      /* Enemies grow out of the portal instead of sliding in half-clipped. */
      var rad = e.radius * (0.25 + 0.75 * fade);
      var y = rad + 0.06;
      var hit = state.time - e.hitAt;
      var flash = hit >= 0 && hit < 0.09 ? 1 : 0;
      /*
       * A hit that the shield turned away and a hit that landed have to look
       * different. A deflection reads as a hard pale-blue flare on the face;
       * a landed hit keeps the white burn.
       */
      var deflected = e.shield > 0 && state.time - e.shieldedAt < 0.09;
      var tint = flash
        ? (deflected ? 0x9fd8ff : 0xffffff)
        : R.util.mixColor(0x000000, 0xffffff, 0.35 + 0.65 * fade);

      o.position.set(e.x, y, e.z);
      o.scale.set(rad, rad, rad);
      if (e.type === 'runner') {
        travelVec.set(e.dx, 0, e.dz);
        if (travelVec.lengthSq() < 1e-6) travelVec.set(0, 0, 1);
        travelVec.normalize();
        o.quaternion.setFromUnitVectors(UP_VEC, travelVec);
      } else {
        o.quaternion.set(0, 0, 0, 1);
        o.rotation.y = state.time * (SPIN[e.type] || 0) + e.id;
      }
      fills[shapeKey(e.type)].pushObject(o, tint);

      /*
       * The shell is the shield made visible. It sits on the face the body is
       * walking towards, brightens when light is turned away by it, and is
       * dropped entirely once a boss enters its exposed phase, so the change
       * is legible without reading a number.
       */
      if (e.shield > 0) {
        var shieldCol = deflected ? 0xbfe4ff : (flash ? 0xffffff : 0x8a72ff);
        var shieldMix = 0.09 + 0.07 * fade + (deflected ? 0.4 : 0);
        var face = R.grid.DC[e.face] !== undefined ? e.face : R.S;
        shieldPose.position.set(
          e.x + R.grid.DC[face] * rad * 0.62,
          y,
          e.z + R.grid.DR[face] * rad * 0.62
        );
        shieldPose.scale.set(rad, rad, rad);
        shieldPose.quaternion.set(0, 0, 0, 1);
        shell.pushObject(shieldPose, R.util.mixColor(0x000000, shieldCol, shieldMix));
      }

      if (e.boss) {
        ring.pushBillboard(e.x, y, e.z, rad * 4.4, rad * 4.4,
          R.util.mixColor(0x000000, e.type === 'umbra' ? 0xb14dff : 0xffc247, 0.55));
      }

      var glintCol = C.enemyGlint[e.type] || C.enemyGlint.mote;
      glint.pushBillboard(e.x, y, e.z, rad * 2.3, rad * 2.3,
        R.util.mixColor(0x000000, flash ? 0xffffff : glintCol, (flash ? 0.85 : 0.4) * fade));

      if ((e.hp < e.maxHp || e.boss) && e.t >= 0) {
        var w = Math.max(0.34, rad * 2.1);
        var by = y + rad + 0.22;
        var frac = R.util.clamp(e.hp / e.maxHp, 0, 1);
        back.pushBillboard(e.x, by, e.z, w + 0.07, 0.16, 0x141a2c);
        fill.pushBillboard(e.x - w * (1 - frac) / 2, by, e.z, w * frac, 0.09,
          frac > 0.5 ? 0x7ce0a8 : (frac > 0.25 ? 0xffc247 : 0xff5d6c));
      }
    }

    for (k in fills) fills[k].finish();
    shell.finish();
    glint.finish();
    ring.finish();
    back.finish();
    fill.finish();
  }


  /* ---------- particles, shake and run transitions ---------- */

  var MAX_PARTICLES = 400;
  var particles = [];
  var particleCount = 0;

  var feel = {
    shakeAmp: 0,
    shakeTime: 0,
    shakeTotal: 0,
    flare: 0,
    gutter: 1,
    pulseAt: -1,
    portalFlare: 0
  };
  rd.feel = feel;

  function shardTexture() {
    var s = 64;
    var cv = makeCanvas(s);
    var g = cv.getContext('2d');
    g.fillStyle = 'rgba(255,255,255,1)';
    g.beginPath();
    g.moveTo(32, 4);
    g.lineTo(52, 32);
    g.lineTo(32, 60);
    g.lineTo(12, 32);
    g.closePath();
    g.fill();
    return new THREE.CanvasTexture(cv);
  }

  function buildParticles() {
    for (var i = 0; i < MAX_PARTICLES; i++) {
      particles.push({
        active: false, x: 0, y: 0, z: 0, vx: 0, vy: 0, vz: 0,
        life: 0, ttl: 1, size: 0.1, color: 0xffffff, spin: 0, rot: 0, drag: 1
      });
    }
    dyn.particles = makeInstanced(
      new THREE.PlaneGeometry(1, 1),
      additiveMaterial(rd.tex.shard, 0xffffff),
      MAX_PARTICLES,
      8
    );
  }

  function spawnParticle() {
    if (particleCount >= MAX_PARTICLES) return null;
    for (var i = 0; i < MAX_PARTICLES; i++) {
      if (!particles[i].active) {
        particles[i].active = true;
        particleCount++;
        return particles[i];
      }
    }
    return null;
  }

  /* A burst of shards, used for deaths and celebrations. */
  rd.burst = function (x, z, color, count, opts) {
    var o = opts || {};
    var speed = o.speed || 2.2;
    var size = o.size || 0.16;
    var ttl = o.ttl || 0.55;
    for (var i = 0; i < count; i++) {
      var p = spawnParticle();
      if (!p) return;
      var a = (i / count) * Math.PI * 2 + Math.random() * 0.7;
      var sp = speed * (0.45 + Math.random() * 0.75);
      p.x = x;
      p.y = (o.y === undefined ? 0.3 : o.y);
      p.z = z;
      p.vx = Math.cos(a) * sp;
      p.vz = Math.sin(a) * sp;
      p.vy = (o.up || 1.6) * (0.3 + Math.random());
      p.life = 0;
      p.ttl = ttl * (0.7 + Math.random() * 0.6);
      p.size = size * (0.6 + Math.random() * 0.8);
      p.color = color;
      p.spin = (Math.random() - 0.5) * 12;
      p.rot = Math.random() * 6.28;
      p.drag = o.drag || 2.2;
    }
  };

  /* A couple of sparks where the light is biting into something. */
  rd.spark = function (x, z, color) {
    var p = spawnParticle();
    if (!p) return;
    p.x = x + (Math.random() - 0.5) * 0.3;
    p.y = 0.22 + Math.random() * 0.2;
    p.z = z + (Math.random() - 0.5) * 0.3;
    p.vx = (Math.random() - 0.5) * 1.4;
    p.vz = (Math.random() - 0.5) * 1.4;
    p.vy = 1.1 + Math.random();
    p.life = 0;
    p.ttl = 0.26;
    p.size = 0.075;
    p.color = color;
    p.spin = 8;
    p.rot = Math.random() * 6.28;
    p.drag = 3.5;
  };

  rd.clearParticles = function () {
    for (var i = 0; i < particles.length; i++) particles[i].active = false;
    particleCount = 0;
    feel.shakeAmp = 0;
    feel.shakeTime = 0;
    feel.flare = 0;
    feel.gutter = 1;
    feel.pulseAt = -1;
    feel.portalFlare = 0;
  };

  function stepParticles(dt) {
    for (var i = 0; i < particles.length; i++) {
      var p = particles[i];
      if (!p.active) continue;
      p.life += dt;
      if (p.life >= p.ttl) {
        p.active = false;
        particleCount--;
        continue;
      }
      var k = Math.max(0, 1 - p.drag * dt);
      p.vx *= k;
      p.vz *= k;
      p.vy -= 6.5 * dt;
      p.x += p.vx * dt;
      p.y += p.vy * dt;
      p.z += p.vz * dt;
      if (p.y < 0.05) {
        p.y = 0.05;
        p.vy = 0;
        p.vx *= 0.6;
        p.vz *= 0.6;
      }
      p.rot += p.spin * dt;
    }
  }

  function drawParticles() {
    var f = new Filler(dyn.particles);
    for (var i = 0; i < particles.length; i++) {
      var p = particles[i];
      if (!p.active) continue;
      var t = p.life / p.ttl;
      var fade = 1 - t * t;
      var s = p.size * (1 - 0.45 * t);
      f.pushBillboardRot(p.x, p.y, p.z, s, s, p.rot, R.util.mixColor(0x000000, p.color, fade));
    }
    f.finish();
  }

  Filler.prototype.pushBillboardRot = function (x, y, z, sx, sy, rotZ, colorHex) {
    var mesh = this.mesh;
    if (this.n >= mesh.instanceMatrix.count) return;
    dummy.position.set(x, y, z);
    dummy.rotation.set(billboardX, 0, rotZ);
    dummy.scale.set(sx, sy, 1);
    dummy.updateMatrix();
    mesh.setMatrixAt(this.n, dummy.matrix);
    mesh.setColorAt(this.n, scratchColor.setHex(colorHex));
    this.n++;
  };

  /* ---------- screen shake ---------- */

  rd.shake = function (amount, seconds) {
    /* Never shake the board out from under a finger that is placing a piece. */
    if (R.state && R.state.ui.drag) return;
    if (amount <= feel.shakeAmp && feel.shakeTime > 0) return;
    feel.shakeAmp = amount;
    feel.shakeTime = seconds;
    feel.shakeTotal = seconds;
  };

  var shakeSeed = 1;

  function applyShake(dtReal) {
    var boardEl = document.getElementById('board');
    if (!boardEl) return;
    if (feel.shakeTime <= 0) {
      if (boardEl.style.transform !== '') boardEl.style.transform = '';
      return;
    }
    feel.shakeTime -= dtReal;
    var k = Math.max(0, feel.shakeTime / feel.shakeTotal);
    var amp = feel.shakeAmp * k * k;
    shakeSeed = (shakeSeed * 1103515245 + 12345) & 0x7fffffff;
    var a = (shakeSeed / 0x7fffffff) * 6.283;
    boardEl.style.transform = 'translate(' + (Math.cos(a) * amp).toFixed(1) + 'px,' +
      (Math.sin(a) * amp).toFixed(1) + 'px)';
  }

  /* ---------- the pulse that runs along the beam after a core upgrade ---------- */

  var PULSE_SPEED = 26;

  function drawPulse(state, now) {
    if (feel.pulseAt < 0) return;
    var dist = (now - feel.pulseAt) * PULSE_SPEED;
    var segs = state.beam.segments;
    var f = new Filler(dyn.pulse);
    var found = false;
    for (var i = 0; i < state.beam.segCount; i++) {
      var s = segs[i];
      var len = Math.abs(s.x1 - s.x0) + Math.abs(s.z1 - s.z0);
      var d = dist - s.dist0;
      if (d < 0 || d > len) continue;
      found = true;
      var fx = len === 0 ? 0 : (s.x1 - s.x0) / len;
      var fz = len === 0 ? 0 : (s.z1 - s.z0) / len;
      f.push(s.x0 + fx * d, BEAM_Y + 0.02, s.z0 + fz * d, 0, 1.1, 1.1, 0x8a6a2a);
    }
    f.finish();
    if (!found && dist > 4) feel.pulseAt = -1;
  }


  /* ---------- reacting to simulation events ---------- */

  var realClock = 0;
  var flipTimes = {};
  var ghostPieces = [];

  rd.clock = function () {
    return realClock;
  };

  rd.particleCount = function () {
    return particleCount;
  };

  rd.ghostCount = function () {
    return ghostPieces.length;
  };

  rd.handleEvents = function (state) {
    for (var i = 0; i < state.events.length; i++) {
      var e = state.events[i];
      switch (e.type) {
        case 'kill':
          var col = C.enemyGlint[e.enemy] || 0xffffff;
          if (e.boss) {
            rd.burst(e.x, e.z, col, 18, { speed: 3.6, size: 0.24, ttl: 0.9, up: 2.6 });
            rd.burst(e.x, e.z, 0xffffff, 10, { speed: 2.2, size: 0.16, ttl: 0.7 });
            rd.shake(9, 0.32);
            rd.hitStop = 0.06;
          } else if (e.enemy === 'bulwark') {
            rd.burst(e.x, e.z, col, 10, { speed: 2.6, size: 0.19, ttl: 0.65 });
            rd.shake(4, 0.13);
          } else {
            rd.burst(e.x, e.z, col, e.enemy === 'swarmling' ? 4 : 7, { speed: 2.1, size: 0.13 });
          }
          break;
        case 'leak':
          rd.shake(e.leak >= 3 ? 7 : 4, 0.2);
          rd.burst(e.x, e.z, 0xff5d6c, 8, { speed: 1.7, size: 0.15, ttl: 0.5 });
          break;
        case 'upgrade':
          feel.pulseAt = realClock;
          break;
        case 'wavestart':
          feel.portalFlare = 1;
          break;
        case 'flip':
          flipTimes[e.id] = { at: realClock, dir: e.toOrient ? 1 : -1 };
          break;
        case 'sell':
        case 'undo':
          if (e.record) {
            ghostPieces.push({
              type: e.record.type, c: e.record.c, r: e.record.r,
              orient: e.record.orient, dir: e.record.dir, at: realClock
            });
          }
          break;
        case 'win':
          feel.flare = 1.3;
          for (var k = 0; k < 8; k++) {
            rd.burst(
              (Math.random() - 0.5) * 7,
              (Math.random() - 0.5) * 10,
              [0xffc247, 0x59e8ff, 0xffffff, 0x7ce0a8][k % 4],
              12, { speed: 3, size: 0.2, ttl: 1.4, up: 3 }
            );
          }
          break;
        case 'lose':
          rd.shake(10, 0.5);
          break;
        default:
          break;
      }
    }
  };

  function stepFeel(state, dt) {
    if (state.phase === 'lost') feel.gutter = Math.max(0, feel.gutter - dt * 1.1);
    else feel.gutter = Math.min(1, feel.gutter + dt * 4);
    feel.flare = Math.max(0, feel.flare - dt * 0.9);
    for (var i = ghostPieces.length - 1; i >= 0; i--) {
      if (realClock - ghostPieces[i].at > 0.24) ghostPieces.splice(i, 1);
    }
  }

  /* Sparks where the light is biting, roughly ten a second per enemy. */
  function sparkEnemies(state, dt) {
    if (dt <= 0) return;
    var chance = dt / 0.1;
    var list = state.enemies;
    for (var i = 0; i < list.length; i++) {
      var e = list[i];
      if (state.time - e.hitAt > 0.06 || e.t < 0) continue;
      if (Math.random() < chance) {
        rd.spark(e.x, e.z, C.enemyGlint[e.type] || 0xffffff);
      }
    }
  }

  /* ---------- selection and drag highlights ---------- */

  function frameTexture() {
    var s = 64;
    var cv = makeCanvas(s);
    var g = cv.getContext('2d');
    g.strokeStyle = 'rgba(255,255,255,1)';
    g.lineWidth = 5;
    g.lineJoin = 'round';
    g.strokeRect(5, 5, s - 10, s - 10);
    return new THREE.CanvasTexture(cv);
  }

  function buildHighlights() {
    var quad = new THREE.PlaneGeometry(1, 1);
    dyn.hoverTile = new THREE.Mesh(quad, additiveMaterial(rd.tex.frame, 0xffffff));
    dyn.hoverTile.rotation.x = -Math.PI / 2;
    dyn.hoverTile.scale.set(0.98, 0.98, 1);
    dyn.hoverTile.position.y = 0.06;
    dyn.hoverTile.renderOrder = 7;
    dyn.hoverTile.visible = false;
    scene.add(dyn.hoverTile);

    dyn.selectRing = new THREE.Mesh(quad, additiveMaterial(rd.tex.frame, C.accent || 0x59e8ff));
    dyn.selectRing.rotation.x = -Math.PI / 2;
    dyn.selectRing.scale.set(1.0, 1.0, 1);
    dyn.selectRing.position.y = 0.055;
    dyn.selectRing.renderOrder = 7;
    dyn.selectRing.visible = false;
    scene.add(dyn.selectRing);
  }

  function drawHighlights(state) {
    var d = state.ui.drag;
    if (d && d.dragging && d.cell) {
      dyn.hoverTile.visible = true;
      dyn.hoverTile.position.x = R.grid.worldX(d.cell.c);
      dyn.hoverTile.position.z = R.grid.worldZ(d.cell.r);
      dyn.hoverTile.material.color.setHex(d.valid ? C.valid : C.invalid);
    } else {
      dyn.hoverTile.visible = false;
    }

    var p = R.pieces.selected(state);
    if (p) {
      var pulseScale = 1.0 + 0.05 * Math.sin(state.time * 7);
      dyn.selectRing.visible = true;
      dyn.selectRing.position.x = R.grid.worldX(p.c);
      dyn.selectRing.position.z = R.grid.worldZ(p.r);
      dyn.selectRing.scale.set(pulseScale, pulseScale, 1);
      dyn.selectRing.material.color.setHex(state.ui.moveMode ? C.valid : 0x59e8ff);
    } else {
      dyn.selectRing.visible = false;
    }
  }

  rd.drawDynamic = function (state, dtReal) {
    var dt = dtReal || 0;
    realClock += dt;
    stepFeel(state, dt);
    advanceSweep(state, dt);
    sparkEnemies(state, dt);
    stepParticles(dt);
    drawLitTiles(state);
    drawBeams(state);
    drawSuggestion(state);
    drawPreview(state);
    drawPieces(state);
    drawEnemies(state);
    drawParticles();
    drawPulse(state, realClock);
    drawHighlights(state);
    applyShake(dt);
  };

  /* ---------- frame ---------- */

  rd.draw = function (state, dtReal) {
    if (!rd.ready) return;
    var t = state.time;

    if (rd.coreCrystal) {
      var lvl = state.coreLevel;
      var pulse = 0.85 + 0.15 * Math.sin(t * 2.4);
      rd.coreCrystal.rotation.y += dtReal * 0.6;
      rd.coreCrystal.material.emissiveIntensity = pulse * (0.7 + 0.16 * lvl);
      var s = 1 + 0.05 * lvl;
      rd.coreCrystal.scale.set(s, s, s);
      rd.coreHaze.material.opacity = 0.32 + 0.05 * lvl + 0.06 * Math.sin(t * 2.4);
    }
    if (rd.portalRings) {
      if (feel.portalFlare > 0) feel.portalFlare = Math.max(0, feel.portalFlare - dtReal * 1.6);
      for (var pr = 0; pr < rd.portalRings.length; pr++) {
        var pring = rd.portalRings[pr];
        /* A road that has not opened yet turns slowly and stays dim. */
        var open = pr < state.routesOpen;
        pring.rotation.z -= dtReal * (open ? 0.5 : 0.12);
        var ps = open ? 1 + feel.portalFlare * 0.8 : 0.7;
        pring.scale.set(ps, ps, 1);
        pring.material.opacity = open ? 1 : 0.28;
        pring.material.color.setHex(open
          ? R.util.mixColor(0x9b4dff, 0xffffff, feel.portalFlare)
          : 0x4a3070);
      }
    }

    rd.drawDynamic(state, dtReal);

    renderer.render(scene, camera);
  };

  /* Draw one frame without touching game state; used by performance probes. */
  rd.renderOnce = function () {
    if (rd.ready) renderer.render(scene, camera);
  };

  rd.info = function () {
    if (!renderer) return null;
    return {
      calls: renderer.info.render.calls,
      triangles: renderer.info.render.triangles,
      geometries: renderer.info.memory.geometries,
      textures: renderer.info.memory.textures,
      programs: renderer.info.programs ? renderer.info.programs.length : 0,
      objects: scene ? scene.children.length : 0
    };
  };
})(typeof window !== 'undefined' ? window : globalThis);
</script>

<script>
/*
   ==================================================================
   09_ui.js
   ==================================================================
*/
/*
 * The DOM layer: HUD numbers, the incoming strip, floating text over the board
 * and (from later phases) the palette, action bar and overlays. Everything here
 * reads state and reacts to the feedback events the simulation emits.
 */
(function (global) {
  'use strict';
  var R = global.R || (global.R = {});
  var B = R.BALANCE;

  var ui = {};
  R.ui = ui;

  var el = {};
  var cache = {};
  var floaters = [];
  var FLOATER_POOL = 28;

  function byId(id) {
    return document.getElementById(id);
  }

  function setText(node, value) {
    if (cache[node.__key] === value) return;
    cache[node.__key] = value;
    node.textContent = value;
  }

  function key(node, name) {
    node.__key = name;
    return node;
  }

  /* ---------- floating text ---------- */

  function makeFloater() {
    var node = document.createElement('div');
    node.className = 'floater';
    node.style.display = 'none';
    el.overlay.appendChild(node);
    return { node: node, life: 0, ttl: 0, x: 0, y: 0, vy: 0, active: false };
  }

  ui.floater = function (text, kind, x, y, opts) {
    var f = null;
    for (var i = 0; i < floaters.length; i++) {
      if (!floaters[i].active) { f = floaters[i]; break; }
    }
    if (!f) return null;
    f.active = true;
    f.life = 0;
    f.ttl = (opts && opts.ttl) || 0.9;
    f.x = x;
    f.y = y;
    f.vy = (opts && opts.vy) || -46;
    f.tx = opts && opts.tx !== undefined ? opts.tx : null;
    f.ty = opts && opts.ty !== undefined ? opts.ty : null;
    f.node.className = 'floater ' + (kind || 'info');
    f.node.textContent = text;
    f.node.style.display = 'block';
    f.node.style.left = x + 'px';
    f.node.style.top = y + 'px';
    f.node.style.opacity = '1';
    return f;
  };

  ui.floaterAtCell = function (text, kind, c, r, opts) {
    var p = R.render.projectCell(c, r, 0.4);
    if (!p) return null;
    return ui.floater(text, kind, p.x, p.y, opts);
  };

  ui.floaterAtWorld = function (text, kind, x, z, opts) {
    var p = R.render.project(x, 0.4, z);
    if (!p) return null;
    return ui.floater(text, kind, p.x, p.y, opts);
  };

  /* Board-overlay coordinates of the gold counter, for arcing rewards. */
  function goldTarget() {
    var board = document.getElementById('board').getBoundingClientRect();
    var g = el.statGold.getBoundingClientRect();
    return { tx: g.left + g.width / 2 - board.left, ty: g.top + g.height / 2 - board.top };
  }

  function stepFloaters(dt) {
    for (var i = 0; i < floaters.length; i++) {
      var f = floaters[i];
      if (!f.active) continue;
      f.life += dt;
      if (f.life >= f.ttl) {
        f.active = false;
        f.node.style.display = 'none';
        continue;
      }
      var t = f.life / f.ttl;
      if (f.tx !== null) {
        /* Arc towards the gold counter so the reward reads as banked. */
        var e = R.util.easeInCubic(t);
        f.node.style.left = (f.x + (f.tx - f.x) * e) + 'px';
        f.node.style.top = (f.y + (f.ty - f.y) * e - Math.sin(t * Math.PI) * 26) + 'px';
        f.node.style.opacity = String(t < 0.75 ? 1 : (1 - t) * 4);
      } else {
        f.node.style.top = (f.y + f.vy * t) + 'px';
        f.node.style.opacity = String(1 - t * t);
      }
    }
  }

  ui.clearFloaters = function () {
    for (var i = 0; i < floaters.length; i++) {
      floaters[i].active = false;
      floaters[i].node.style.display = 'none';
    }
  };

  /* ---------- one-shot CSS animations ---------- */

  function pulse(node, cls) {
    if (!node) return;
    node.classList.remove(cls);
    /* Reading offsetWidth restarts the animation. */
    void node.offsetWidth;
    node.classList.add(cls);
  }

  ui.bumpGold = function () { pulse(el.statGold, 'bump'); };
  ui.shakeGold = function () { pulse(el.statGold, 'shake'); };
  ui.shakeHp = function () { pulse(el.statHp, 'shake'); };
  ui.pulseLight = function () { pulse(el.statLight, 'bump'); };

  /* ---------- incoming strip ---------- */

  var stripNotice = '';
  var stripNoticeUntil = 0;
  var realTime = 0;

  function pips(comp) {
    var html = '';
    for (var i = 0; i < comp.length; i++) {
      var g = comp[i];
      var big = g.type === 'bruteking' || g.type === 'umbra';
      html += '<span class="pip ' + g.type + (big ? ' big' : '') + '"></span>';
      html += '<span class="' + (big ? 'warn' : '') + '">' + g.count + '</span> ';
    }
    return html;
  }

  ui.notice = function (text, seconds) {
    stripNotice = text;
    stripNoticeUntil = realTime + (seconds || 2.4);
    el.strip.classList.remove('flash');
    void el.strip.offsetWidth;
    el.strip.classList.add('flash');
  };

  function stripHtml(s) {
    if (stripNotice && realTime < stripNoticeUntil) return '<span class="warn">' + stripNotice + '</span>';
    if (s.phase === 'wave') {
      return '<span class="em">WAVE ' + s.wave + '</span> &middot; ' +
        R.enemies.remaining(s) + ' left';
    }
    var next = s.wave + 1;
    var mouth = R.enemies.newMouthNote(s, next);
    /* A new entrance outranks the threat description: it changes the board. */
    var note = mouth
      ? '<span class="warn">' + mouth.toUpperCase() + '</span>'
      : '<span class="em">' + R.enemies.threatNote(next) + '</span>';
    return 'NEXT ' + pips(R.enemies.composition(next)) + '&middot; ' + note;
  }

  /* ---------- HUD ---------- */

  ui.update = function (s) {
    setText(el.hpVal, String(Math.max(0, s.coreHp)));
    setText(el.goldVal, String(Math.floor(s.gold)));
    setText(el.waveLbl, s.endless ? 'ENDLESS' : 'WAVE');
    setText(el.waveVal, String(s.wave));
    setText(el.waveSub, s.endless ? '' : '/' + B.WAVES.length);
    /*
     * Coverage is how much of the road is lit. It is deliberately a secondary
     * reading: it says how far the network reaches, not how much damage it
     * does, and the two come apart whenever a formation shields itself. The
     * damage figure behind that distinction is development telemetry, not
     * something to put in front of the player.
     */
    var taken = s.upgrades.join(',');
    if (cache.upgrades !== taken) {
      cache.upgrades = taken;
      el.upgradeBar.innerHTML = '';
      for (var ui2 = 0; ui2 < s.upgrades.length; ui2++) {
        el.upgradeBar.appendChild(node('span', 'uptag', B.UPGRADES[s.upgrades[ui2]].name));
      }
      el.upgradeBar.hidden = s.upgrades.length === 0;
    }

    var cov = s.beam.litRoadCount;
    if (cov > lastCov) ui.pulseLight();
    lastCov = cov;
    setText(el.covVal, String(cov));
    setText(el.covSub, '/' + s.roadCells);

    var html = stripHtml(s);
    if (cache.strip !== html) {
      cache.strip = html;
      el.stripText.innerHTML = html;
    }
  };

  /* ---------- events ---------- */

  var goldFloaterAt = 0;
  var lastCov = 0;

  ui.handleEvents = function (s) {
    for (var i = 0; i < s.events.length; i++) {
      var e = s.events[i];
      switch (e.type) {
        case 'denied':
          if (e.reason === 'gold') {
            ui.shakeGold();
            ui.floaterAtCell('Need ' + e.cost, 'dmg', e.c, e.r);
          } else if (e.reason === 'locked') {
            ui.floaterAtCell('Locked', 'info', e.c, e.r);
          }
          break;
        case 'place':
          ui.bumpGold();
          if (!R.tutorialActive(s)) ui.hint(s, 'placed');
          break;
        case 'tutorialblocked':
          ui.floaterAtCell('Not yet', 'info', e.c, e.r, { ttl: 0.6 });
          break;
        case 'tutorialskip':
          ui.notice('TUTORIAL SKIPPED', 1.6);
          break;
        case 'sell':
          ui.bumpGold();
          ui.floaterAtCell('+' + e.refund, 'gold', e.c, e.r);
          break;
        case 'upgrade':
          ui.bumpGold();
          ui.notice('CORE LEVEL ' + e.level, 1.6);
          break;
        case 'kill':
          /* Stagger simultaneous kills so the numbers stay readable. */
          if (realTime - goldFloaterAt > 0.04) {
            goldFloaterAt = realTime;
            var target = goldTarget();
            target.ttl = 0.8;
            ui.floaterAtWorld('+' + e.gold, 'gold', e.x, e.z, target);
          }
          ui.bumpGold();
          break;
        case 'leak':
          ui.shakeHp();
          ui.flashVignette(0.35 + 0.1 * e.leak);
          ui.floaterAtWorld('-' + e.leak, 'dmg', e.x, e.z, { ttl: 1.1 });
          break;
        case 'waveclear':
          ui.notice('WAVE ' + e.wave + ' CLEARED  +' + e.bonus, 2.2);
          ui.banner('CLEARED', '+' + e.bonus + ' gold', 1.7);
          ui.bumpGold();
          if (e.wave === 1) ui.hint(s, 'along', 6);
          if (e.wave === 3) ui.hint(s, 'core', 6);
          break;
        case 'wavestart':
          ui.notice('WAVE ' + e.wave, 1.4);
          ui.banner(s.endless ? 'ENDLESS ' + e.wave : 'WAVE ' + e.wave, null, 1.5);
          break;
        case 'runstart':
          lastCov = 0;
          ui.hint(s, 'start', 7);
          break;
        case 'spawn':
          if (e.enemy === 'bulwark' || e.enemy === 'bruteking') ui.hint(s, 'bulwark', 6);
          if (e.enemy === 'swarmling') ui.hint(s, 'swarm', 6);
          break;
        case 'endless':
          ui.notice('ENDLESS MODE', 2.4);
          break;
        case 'unlock':
          ui.notice(String(TYPE_LABEL_PIECE[e.piece] || e.piece).toUpperCase() + ' UNLOCKED', 3);
          ui.flashPalette(e.piece);
          ui.hint(s, e.piece, 6);
          break;
        case 'undo':
          ui.bumpGold();
          ui.floaterAtCell('+' + e.refund, 'gold', e.c, e.r);
          break;
        default:
          break;
      }
    }
  };

  var TYPE_LABEL_PIECE = {
    mirror: 'Mirror', splitter: 'Splitter', reflector: 'Reflector', lamp: 'Lamp'
  };


  /* ---------- overlays ---------- */

  var overlayKind = null;

  function node(tag, cls, html) {
    var n = document.createElement(tag);
    if (cls) n.className = cls;
    if (html !== undefined) n.innerHTML = html;
    return n;
  }

  function button(cls, label, onClick) {
    var b = node('button', cls, label);
    b.type = 'button';
    b.addEventListener('click', function (ev) {
      ev.preventDefault();
      onClick();
    });
    return b;
  }

  function openOverlay(kind, build) {
    overlayKind = kind;
    el.overlayRoot.innerHTML = '';
    var wrap = node('div', 'overlay ov-' + kind);
    build(wrap);
    el.overlayRoot.appendChild(wrap);
    el.overlayRoot.classList.add('on');
    return wrap;
  }

  function closeOverlay() {
    overlayKind = null;
    el.overlayRoot.innerHTML = '';
    el.overlayRoot.classList.remove('on');
  }

  function bestLine() {
    return R.meta.best > 0 ? '<p class="tag">BEST ' + R.meta.best + '</p>' : '';
  }

  function buildTitle(wrap) {
    wrap.appendChild(node('h1', null, 'REFRACT'));
    wrap.appendChild(node('p', 'tag', 'Bend the light. Burn the shadows.'));
    var rows = node('div', 'rows');
    rows.appendChild(node('div', 'row', '<b>&#9670;</b> Your core fires one beam of light. Shadows walking the road burn in it.'));
    rows.appendChild(node('div', 'row', '<b>&#9655;</b> Tap a tile to place a mirror and bend the beam along the road.'));
    rows.appendChild(node('div', 'row', '<b>&#8635;</b> Tap a placed piece to flip, move or sell it. Survive twelve waves.'));
    wrap.appendChild(rows);
    if (R.meta.best > 0) wrap.appendChild(node('p', 'tag', 'BEST ' + R.meta.best));
    wrap.appendChild(button('bigbtn', 'PLAY', function () { R.startRun(); }));
    wrap.appendChild(node('p', 'note', 'Portrait &middot; single player &middot; works offline'));
  }

  function buildPause(wrap) {
    wrap.appendChild(node('h2', null, 'PAUSED'));
    wrap.appendChild(node('p', 'tag', 'Tap anywhere to resume'));
    wrap.addEventListener('click', function () { R.resume(); });
  }

  /*
   * The tip names whatever took the most core HP, which is what the player
   * actually needs to solve, rather than the most numerous leaker.
   */
  var DEFEAT_TIPS = {
    bulwark: 'A Bulwark carries its shield on the face it walks towards, so light meeting it head on mostly bounces off. Reach its flank or its back with a second line, or bring a return pass the other way.',
    bruteking: 'A Brute King shields its front and soaks up the rest, so everything walking behind it is in shadow. Light it from another direction.',
    umbra: 'Umbra absorbs almost everything. Upgrade the core and light the long segments so it is burning for as long as possible.',
    swarmling: 'Swarms drain a beam fast: each one takes a bite before the light reaches the next. Split the light, or add a Lamp as a second source.',
    runner: 'Runners cross a single lit cell in half a second. Light a whole road segment lengthwise so they stay in the light.',
    mote: 'Light along the road burns for the whole segment; light across it burns for one cell. Push COVERAGE up so they stay in the light for longer.'
  };

  function defeatTip(s) {
    var worst = null;
    var worstHp = -1;
    for (var type in s.leaksBy) {
      var hp = s.leaksBy[type] * (B.ENEMY[type] ? B.ENEMY[type].leak : 1);
      if (hp > worstHp) { worstHp = hp; worst = type; }
    }
    if (!worst || worstHp <= 0) return DEFEAT_TIPS.mote;
    return DEFEAT_TIPS[worst] || DEFEAT_TIPS.mote;
  }

  function statLine(label, value) {
    return node('p', 'statline', label + ' <b>' + value + '</b>');
  }

  /*
   * A run can end two ways, and the screen has to say which. Surviving the
   * boss is not a win, so a breach gets its own heading and its own reason
   * rather than being reported as a core that ran out of health.
   */
  function buildDefeat(wrap) {
    var s = R.state;
    var breach = s.bossBreached;
    var name = breach === 'umbra' ? 'UMBRA' : 'THE BOSS';
    var h = node('h2', null, breach ? name + ' REACHED THE CORE' : 'THE CORE FELL');
    h.style.color = '#ff5d6c';
    wrap.appendChild(h);
    if (breach) {
      wrap.appendChild(node('p', 'reason',
        'It had to be destroyed on the road. The core was still standing at ' +
        Math.max(0, s.coreHp) + ' of ' + B.CORE_HP + ' HP, and that is not enough.'));
    }
    wrap.appendChild(statLine('Reached wave', s.wave + ' of ' + B.WAVES.length));
    wrap.appendChild(statLine('Score', s.score));
    if (R.meta.best > 0) wrap.appendChild(node('p', 'tag', 'BEST ' + R.meta.best));
    wrap.appendChild(node('div', 'tip', breach ? BREACH_TIP : defeatTip(s)));
    wrap.appendChild(button('bigbtn', 'TRY AGAIN', function () { R.restartRun(); }));
  }

  var BREACH_TIP = 'Umbra advances behind its shield, then drops it about halfway down the road. ' +
    'Light that meets the shield head on is mostly turned away, so reach its flank or its back, ' +
    'or add a return pass. Once the shield is down, everything you have built counts.';

  function buildVictory(wrap) {
    var s = R.state;
    var h = node('h2', null, 'THE LIGHT HELD');
    h.style.color = '#ffc247';
    wrap.appendChild(h);
    wrap.appendChild(statLine('Waves cleared', s.wavesCleared));
    wrap.appendChild(statLine('Core HP left', s.coreHp + ' of ' + B.CORE_HP));
    wrap.appendChild(statLine('Coverage', s.beam.litRoadCount + ' of ' + s.roadCells + ' road cells'));
    wrap.appendChild(statLine('Score', s.score));
    if (R.meta.best > 0) wrap.appendChild(node('p', 'tag', 'BEST ' + R.meta.best));
    wrap.appendChild(button('bigbtn', 'PLAY AGAIN', function () { R.restartRun(); }));
    if (R.continueEndless) {
      wrap.appendChild(button('bigbtn ghost', 'CONTINUE &mdash; ENDLESS', function () { R.continueEndless(); }));
    }
  }

  /*
   * The choice of three offered after certain encounters. The run is stopped
   * while it is up, so the descriptions can be read without a clock running,
   * and each card says plainly what it changes.
   */
  function buildUpgradeChoice(wrap) {
    var s = R.state;
    var h = node('h2', null, 'CHOOSE AN UPGRADE');
    h.style.color = '#ffc247';
    wrap.appendChild(h);
    wrap.appendChild(node('p', 'upnote', 'It lasts for the rest of this run.'));

    var cards = node('div', 'upcards');
    var offer = s.upgradeOffer || [];
    for (var i = 0; i < offer.length; i++) {
      cards.appendChild(upgradeCard(offer[i]));
    }
    wrap.appendChild(cards);
  }

  function upgradeCard(key) {
    var def = B.UPGRADES[key];
    var card = node('button', 'upcard');
    card.type = 'button';
    card.setAttribute('data-upgrade', key);
    card.appendChild(node('span', 'upname', def.name));
    card.appendChild(node('span', 'upblurb', def.blurb));
    card.addEventListener('click', function () {
      R.audio.ensure();
      R.chooseUpgrade(R.state, key);
    });
    return card;
  }

  /* Rebuild only when the phase changes, so overlays do not flicker. */
  ui.syncOverlay = function (s) {
    var want = null;
    if (s.ui.helpOpen) want = 'help';
    else if (s.phase === 'title') want = 'title';
    else if (s.phase === 'paused') want = 'pause';
    else if (s.phase === 'lost') want = 'lost';
    else if (s.phase === 'won') want = 'won';
    else if (s.phase === 'choosing') want = 'choosing';

    if (want === overlayKind) return;
    if (!want) {
      closeOverlay();
      return;
    }
    if (want === 'help') openOverlay('help', buildHelp);
    else if (want === 'title') openOverlay('title', buildTitle);
    else if (want === 'pause') openOverlay('pause', buildPause);
    else if (want === 'lost') openOverlay('lost', buildDefeat);
    else if (want === 'won') openOverlay('won', buildVictory);
    else if (want === 'choosing') openOverlay('choosing', buildUpgradeChoice);
  };

  ui.overlayKind = function () {
    return overlayKind;
  };

  /* ---------- HUD buttons ---------- */

  function bindHudButtons() {
    el.btnPause.addEventListener('click', function () {
      var s = R.state;
      if (s.phase === 'paused') R.resume();
      else R.pause();
    });
    el.btnNext.addEventListener('click', function () {
      R.startWave(R.state);
    });
    el.btnCore.addEventListener('click', function () {
      R.pieces.upgradeCore(R.state);
    });
    el.btnMute.addEventListener('click', function () {
      R.audio.ensure();
      R.audio.toggleMute();
    });
    el.btnHelp.addEventListener('click', function () {
      if (R.state.ui.helpOpen) ui.closeHelp();
      else ui.openHelp();
    });
    el.btnSpeed.addEventListener('click', function () {
      var s = R.state;
      var opts = B.SPEED_OPTIONS;
      var i = opts.indexOf(s.speed);
      s.speed = opts[(i + 1) % opts.length];
    });
  }

  function syncHudButtons(s) {
    var speedLabel = s.speed + '×';
    if (cache.speed !== speedLabel) {
      cache.speed = speedLabel;
      el.btnSpeed.textContent = speedLabel;
      el.btnSpeed.classList.toggle('on', s.speed !== 1);
    }
    if (cache.muted !== R.meta.muted) {
      cache.muted = R.meta.muted;
      el.btnMute.classList.toggle('muted', R.meta.muted);
      el.btnMute.setAttribute('aria-label', R.meta.muted ? 'Sound off' : 'Sound on');
    }
    var paused = s.phase === 'paused';
    if (cache.paused !== paused) {
      cache.paused = paused;
      el.btnPause.classList.toggle('playing', paused);
    }
    var showNext = s.phase === 'building';
    if (cache.showNext !== showNext) {
      cache.showNext = showNext;
      el.btnNext.hidden = !showNext;
    }
  }


  /* ---------- palette ---------- */

  var PIECE_LABEL = {
    mirror: 'MIRROR', splitter: 'SPLITTER', reflector: 'REFLECTOR', lamp: 'LAMP'
  };

  var paletteButtons = {};

  function buildPalette() {
    el.palette.innerHTML = '';
    R.PIECE_TYPES.forEach(function (type) {
      var b = node('button', 'pbtn');
      b.type = 'button';
      b.dataset.type = type;
      b.appendChild(node('span', 'picon ' + type));
      b.appendChild(node('span', 'pname', PIECE_LABEL[type]));
      b.appendChild(node('span', 'pcost', '0<span class="c">&#9670;</span>'));
      b.appendChild(node('span', 'plock', ''));
      b.addEventListener('click', function () {
        var s = R.state;
        R.pieces.deselect(s);
        s.ui.selectedType = type;
        if (!s.unlocked[type]) {
          ui.notice(PIECE_LABEL[type] + ' UNLOCKS AT WAVE ' + B.UNLOCK_WAVE[type], 2);
        }
      });
      b.addEventListener('pointerdown', function (ev) {
        R.input.beginPaletteDrag(type, ev);
      });
      el.palette.appendChild(b);
      paletteButtons[type] = {
        root: b,
        cost: b.querySelector('.pcost'),
        lock: b.querySelector('.plock')
      };
    });
  }

  function syncPalette(s) {
    R.PIECE_TYPES.forEach(function (type) {
      var pb = paletteButtons[type];
      var unlocked = s.unlocked[type];
      var cost = R.pieces.cost(s, type);
      var stamp = type + '|' + unlocked + '|' + cost + '|' + (s.gold >= cost) + '|' + (s.ui.selectedType === type);
      if (cache['pal' + type] === stamp) return;
      cache['pal' + type] = stamp;
      pb.cost.innerHTML = cost + '<span class="c">&#9670;</span>';
      pb.root.classList.toggle('sel', s.ui.selectedType === type);
      pb.root.classList.toggle('poor', unlocked && s.gold < cost);
      pb.root.classList.toggle('locked', !unlocked);
      pb.lock.textContent = unlocked ? '' : 'WAVE ' + B.UNLOCK_WAVE[type];
      pb.lock.style.display = unlocked ? 'none' : 'flex';
    });
  }

  ui.flashPalette = function (type) {
    var pb = paletteButtons[type];
    if (pb) pulse(pb.root, 'unlockflash');
  };

  /* ---------- action row ---------- */

  function syncActionRow(s) {
    var cost = R.pieces.coreUpgradeCost(s);
    var coreStamp = s.coreLevel + '|' + cost + '|' + (cost !== null && s.gold >= cost);
    if (cache.core !== coreStamp) {
      cache.core = coreStamp;
      el.btnCore.querySelector('.a1').innerHTML = 'CORE &#9650; Lv' + s.coreLevel;
      el.btnCore.querySelector('.a2').innerHTML = cost === null
        ? 'MAX'
        : cost + '<span class="c">&#9670;</span>';
      el.btnCore.classList.toggle('dim', cost === null || s.gold < cost);
    }
    /*
     * The button says what it is for whenever a wave could be next, and is
     * merely dimmed while the walkthrough is still on an earlier step. It only
     * reads RUNNING once a wave actually is.
     */
    var planning = s.phase === 'building';
    var canStart = R.canStartWave(s);
    var nextStamp = s.phase + '|' + s.wave + '|' + canStart;
    if (cache.next !== nextStamp) {
      cache.next = nextStamp;
      el.btnNext.querySelector('.a1').textContent = planning ? 'START WAVE ' + (s.wave + 1) : 'WAVE ' + s.wave;
      el.btnNext.querySelector('.a2').innerHTML = planning ? '&#9654;' : 'RUNNING';
      el.btnNext.classList.toggle('dim', !canStart);
    }
  }

  /* ---------- action bar over a selected piece ---------- */

  var actionBar = null;

  function buildActionBar() {
    actionBar = node('div', null);
    actionBar.id = 'actionBar';
    actionBar.style.display = 'none';
    actionBar.appendChild(button('', 'FLIP', function () {
      var s = R.state;
      var p = R.pieces.selected(s);
      if (p) R.pieces.flip(s, p.c, p.r);
    }));
    actionBar.appendChild(button('', 'MOVE', function () {
      var s = R.state;
      if (R.pieces.selected(s)) s.ui.moveMode = !s.ui.moveMode;
    }));
    actionBar.appendChild(button('danger', 'SELL', function () {
      var s = R.state;
      var p = R.pieces.selected(s);
      if (p) R.pieces.sell(s, p.c, p.r);
    }));
    el.overlayHost.appendChild(actionBar);
  }

  function syncActionBar(s) {
    var p = R.pieces.selected(s);
    if (!p || s.ui.drag) {
      if (actionBar.style.display !== 'none') actionBar.style.display = 'none';
      cache.bar = null;
      return;
    }
    var flip = actionBar.children[0];
    var move = actionBar.children[1];
    var sell = actionBar.children[2];
    var stamp = p.id + '|' + p.c + '|' + p.r + '|' + s.ui.moveMode + '|' + R.pieces.refundFor(s, p) + '|' + R.render.boardW;
    if (cache.bar === stamp) return;
    cache.bar = stamp;

    flip.style.display = p.type === 'reflector' ? 'none' : '';
    move.textContent = s.ui.moveMode ? 'TAP TILE' : 'MOVE';
    move.classList.toggle('danger', false);
    sell.innerHTML = 'SELL ' + R.pieces.refundFor(s, p);

    var above = p.r > 1;
    var pos = R.render.projectCell(p.c, p.r, above ? 0.6 : 0);
    actionBar.style.display = 'flex';
    /* Keep the whole bar on screen, whichever edge the piece sits near. */
    var half = actionBar.offsetWidth / 2 + 4;
    actionBar.style.left = Math.round(R.util.clamp(pos.x, half, R.render.boardW - half)) + 'px';
    actionBar.style.top = Math.round(above ? pos.y - 54 : pos.y + 30) + 'px';
  }

  /* ---------- the walkthrough ---------- */

  var tutorBar = null;
  var tutorText = null;

  function buildTutorial() {
    tutorBar = node('div', 'tutor');
    tutorBar.id = 'tutorBar';
    tutorText = node('p', 'tutortext', '');
    tutorBar.appendChild(tutorText);
    tutorBar.appendChild(button('tutorskip', 'SKIP TUTORIAL', function () {
      R.audio.ensure();
      R.skipTutorial(R.state);
    }));
    tutorBar.style.display = 'none';
    el.overlayHost.appendChild(tutorBar);
  }

  function syncTutorial(s) {
    var step = R.tutorialStep(s);
    if (cache.tutor === step) return;
    cache.tutor = step;
    tutorBar.style.display = step ? 'flex' : 'none';
    if (step) tutorText.textContent = R.TUTORIAL_TEXT[step];
    /* The button is only the answer on the last step, so it only glows then. */
    el.btnNext.classList.toggle('callout', step === 'start');
  }

  /* ---------- undo chip ---------- */

  var undoChip = null;

  function buildUndoChip() {
    undoChip = button('', 'UNDO', function () {
      R.pieces.undo(R.state);
    });
    undoChip.id = 'undoChip';
    undoChip.style.display = 'none';
    el.overlayHost.appendChild(undoChip);
  }

  function syncUndoChip(s) {
    var live = R.pieces.undoLive(s);
    /*
     * Not during the walkthrough. It shares the foot of the board with the
     * walkthrough bar, and undoing the mirror the walkthrough just asked for
     * would leave the next step with nothing to point at.
     */
    var show = !!live && !s.ui.drag && !R.tutorialActive(s);
    if (cache.undo === show) return;
    cache.undo = show;
    undoChip.style.display = show ? 'block' : 'none';
  }

  /* ---------- drag ghost ---------- */

  var ghost = null;

  function buildGhost() {
    ghost = node('div', null);
    ghost.id = 'dragGhost';
    ghost.style.display = 'none';
    ghost.appendChild(node('span', 'picon'));
    document.getElementById('app').appendChild(ghost);
  }

  function syncGhost(s) {
    var d = s.ui.drag;
    if (!d || !d.dragging) {
      if (cache.ghost !== false) {
        cache.ghost = false;
        ghost.style.display = 'none';
      }
      return;
    }
    cache.ghost = true;
    var app = document.getElementById('app').getBoundingClientRect();
    ghost.style.display = 'block';
    ghost.style.left = Math.round(d.x - app.left) + 'px';
    ghost.style.top = Math.round(d.y - app.top - 70) + 'px';
    ghost.firstChild.className = 'picon ' + d.type;
    ghost.style.opacity = d.valid ? '1' : '0.45';
  }


  /* ---------- hint toasts ---------- */

  var hintNode = null;
  var hintUntil = 0;
  var hintKey = null;

  var HINTS = {
    start: 'Tap the marked tile to bend the beam along the road.',
    placed: 'Tap a placed piece to flip, move or sell it.',
    along: 'Light along the road burns for the whole segment. Across it, only one cell.',
    bulwark: 'A Bulwark shields the face it walks towards. Hit its flank or its back.',
    swarm: 'Swarms drain a beam fast. Split it, or add a second source.',
    splitter: 'SPLITTER unlocked: passes and bends at the same time, half the power each way.',
    reflector: 'REFLECTOR unlocked: sends the light back down the same chain at 60%.',
    lamp: 'LAMP unlocked: a second source, half the core power, aim it anywhere.',
    core: 'Gold also buys core power. A brighter beam burns everything faster.'
  };

  function buildHint() {
    hintNode = node('div', 'hint');
    hintNode.style.display = 'none';
    el.overlayHost.appendChild(hintNode);
  }

  /* Each hint fires at most once per run, and any new one replaces the old. */
  ui.hint = function (s, key, seconds) {
    /* The walkthrough is saying its own thing; two voices at once is noise. */
    if (R.tutorialActive(s)) return;
    if (!HINTS[key] || s.ui.hintsShown[key]) return;
    s.ui.hintsShown[key] = true;
    hintKey = key;
    hintUntil = realTime + (seconds || 4.5);
    hintNode.textContent = HINTS[key];
    hintNode.style.display = 'block';
  };

  ui.dismissHint = function () {
    hintUntil = 0;
  };

  function syncHint(s) {
    var show = hintKey !== null && realTime < hintUntil && !s.ui.drag && !R.pieces.selected(s);
    /*
     * The hint and the undo chip share the foot of the board, so the hint
     * steps up out of the way while the chip is on screen rather than either
     * of them being lost behind the other.
     */
    var raised = show && !!R.pieces.undoLive(s) && !R.tutorialActive(s);
    var stamp = show + '|' + raised;
    if (cache.hint === stamp) return;
    cache.hint = stamp;
    hintNode.style.display = show ? 'block' : 'none';
    hintNode.classList.toggle('raised', raised);
  }

  /* ---------- help ---------- */

  function buildHelp(wrap) {
    wrap.appendChild(node('h2', null, 'HOW TO PLAY'));
    var rows = node('div', 'rows');
    var lines = [
      ['MIRROR', 'Bends the beam a quarter turn. No power lost.'],
      ['SPLITTER', 'Passes straight <b>and</b> bends, at half power each.'],
      ['REFLECTOR', 'Sends the light back the way it came at 60%, so it meets the road from the other end.'],
      ['LAMP', 'A second source at half the core power, aimed wherever you turn it.'],
      ['CORE', 'Upgrading the core brightens the beam and every lamp with it.'],
      ['BURNING', 'Anything standing in the light takes damage every moment it stays there. Long lit segments burn for longer than a single crossing.'],
      ['ABSORPTION', 'Every body the light passes through takes a bite out of it, so the ones behind take less. Bulwarks take the biggest bite.'],
      ['SHIELDS', 'A Bulwark carries its shield on the face it walks towards. Light meeting that face is mostly turned away; light reaching its flank or its back lands in full.'],
      ['DIRECTION', 'Light meets the road from the end it arrives at. Aim it against the walk to meet the leader head on, or with the walk to reach the backs of the pack.'],
      ['PLANNING', 'Nothing starts until you tap START WAVE. While you are planning, moving, turning and selling pieces is free.'],
      ['UPGRADES', 'After some encounters you choose one of three upgrades. They last the rest of the run and are meant to change how you build, not just how hard you hit.'],
      ['LOOPS', 'Light never retraces the same tile in the same direction, so a closed ring of mirrors goes dark.']
    ];
    lines.forEach(function (l) {
      rows.appendChild(node('div', 'row', '<span class="k">' + l[0] + '</span> ' + l[1]));
    });
    wrap.appendChild(rows);
    wrap.appendChild(button('bigbtn', 'BACK', function () { ui.closeHelp(); }));
  }

  ui.openHelp = function () {
    var s = R.state;
    if (s.ui.helpOpen) return;
    s.ui.helpOpen = true;
    if (R.isSimulating(s)) R.pause();
  };

  ui.closeHelp = function () {
    var s = R.state;
    if (!s.ui.helpOpen) return;
    s.ui.helpOpen = false;
    if (s.phase === 'paused') R.resume();
  };


  /* ---------- damage vignette ---------- */

  var vignette = null;
  var vignetteLevel = 0;

  function buildVignette() {
    vignette = node('div', null);
    vignette.id = 'vignette';
    document.getElementById('app').appendChild(vignette);
  }

  ui.flashVignette = function (strength) {
    vignetteLevel = Math.min(1, vignetteLevel + strength);
  };

  function stepVignette(dt) {
    if (vignetteLevel <= 0) {
      if (cache.vig !== 0) {
        cache.vig = 0;
        vignette.style.opacity = '0';
      }
      return;
    }
    vignetteLevel = Math.max(0, vignetteLevel - dt * 1.8);
    var v = Math.round(vignetteLevel * 100) / 100;
    if (cache.vig !== v) {
      cache.vig = v;
      vignette.style.opacity = String(v);
    }
  }

  /* ---------- wave banners ---------- */

  var banners = [];

  function buildBanners() {
    for (var i = 0; i < 2; i++) {
      var b = node('div', 'banner' + (i ? ' sub' : ''));
      b.style.display = 'none';
      el.overlayHost.appendChild(b);
      banners.push({ node: b, life: 0, ttl: 0 });
    }
  }

  ui.banner = function (main, sub, seconds) {
    var ttl = seconds || 1.6;
    banners[0].node.textContent = main;
    banners[0].life = 0;
    banners[0].ttl = ttl;
    banners[0].node.style.display = 'block';
    banners[1].node.textContent = sub || '';
    banners[1].life = 0;
    banners[1].ttl = sub ? ttl : 0;
    banners[1].node.style.display = sub ? 'block' : 'none';
  };

  function stepBanners(dt) {
    for (var i = 0; i < banners.length; i++) {
      var b = banners[i];
      if (b.ttl <= 0) continue;
      b.life += dt;
      var t = b.life / b.ttl;
      if (t >= 1) {
        b.ttl = 0;
        b.node.style.display = 'none';
        continue;
      }
      /* Slide in, hold, then rise away. */
      var slide = t < 0.18 ? (1 - R.util.easeOutCubic(t / 0.18)) * 40 : 0;
      var out = t > 0.75 ? (t - 0.75) / 0.25 : 0;
      b.node.style.transform = 'translate(-50%, ' + Math.round(-50 + slide - out * 30) + '%)';
      b.node.style.opacity = String(t < 0.18 ? t / 0.18 : (1 - out));

  }

  ui.clearBanners = function () {
    for (var i = 0; i < banners.length; i++) {

  };

  /* ---------- lifecycle ---------- */

  ui.init = function () {
    el.overlay = byId('boardOverlay');
    el.statHp = byId('statHp');
    el.statGold = byId('statGold');
    el.statWave = byId('statWave');
    el.statLight = byId('statLight');
    el.hpVal = key(el.statHp.querySelector('.val'), 'hpVal');
    el.goldVal = key(el.statGold.querySelector('.val'), 'goldVal');
    el.waveLbl = key(el.statWave.querySelector('.lbl'), 'waveLbl');
    el.waveVal = key(el.statWave.querySelector('.val'), 'waveVal');
    el.waveSub = key(el.statWave.querySelector('.sub'), 'waveSub');
    el.covVal = key(el.statLight.querySelector('.val'), 'covVal');
    el.covSub = key(el.statLight.querySelector('.sub'), 'covSub');
    el.upgradeBar = byId('upgradeBar');
    el.strip = byId('strip');
    el.stripText = key(byId('stripText'), 'strip');
    el.overlayRoot = byId('overlayRoot');
    el.btnPause = byId('btnPause');
    el.btnSpeed = byId('btnSpeed');
    el.btnHelp = byId('btnHelp');
    el.btnMute = byId('btnMute');
    el.btnCore = byId('btnCore');
    el.btnNext = byId('btnNext');
    el.palette = byId('palette');
    el.overlayHost = el.overlay;
    bindHudButtons();
    buildPalette();
    buildActionBar();
    buildTutorial();
    buildUndoChip();
    buildGhost();
    buildHint();
    buildVignette();
    buildBanners();

    for (var i = 0; i < FLOATER_POOL; i++) floaters.push(makeFloater());
    ui.el = el;
  };

  ui.frame = function (s, dtReal) {
    realTime += dtReal;
    /* Events first, so an effect started this frame is drawn this frame. */
    ui.handleEvents(s);
    stepFloaters(dtReal);
    stepBanners(dtReal);
    stepVignette(dtReal);
    ui.update(s);
    syncHudButtons(s);
    syncPalette(s);
    syncActionRow(s);
    syncActionBar(s);
    syncTutorial(s);
    syncUndoChip(s);
    syncGhost(s);
    syncHint(s);
    ui.syncOverlay(s);
  };

  ui.reset = function () {
    ui.clearFloaters();
    cache = {};
    stripNotice = '';
    stripNoticeUntil = 0;
    lastCov = 0;
    vignetteLevel = 0;
    if (vignette) vignette.style.opacity = '0';
    ui.clearBanners();
    hintKey = null;
    hintUntil = 0;
    if (hintNode) hintNode.style.display = 'none';
    overlayKind = null;
    if (el.overlayRoot) closeOverlay();
  };
})(typeof window !== 'undefined' ? window : globalThis);
</script>

<script>
/*
   ==================================================================
   10_input.js
   ==================================================================
*/
/*
 * Input. Pointer Events only, one active pointer at a time. A press becomes a
 * tap (place, select, or a move target) or, once it travels far enough, a drag
 * that carries a piece to another tile.
 */
(function (global) {
  'use strict';
  var R = global.R || (global.R = {});

  var input = {};
  R.input = input;

  var DRAG_THRESHOLD = 10;

  var press = null;

  function cellAt(clientX, clientY) {
    return R.render.cellFromClient(clientX, clientY);
  }

  function boardAcceptsInput(s) {
    return s.phase === 'building' || s.phase === 'wave';
  }

  function dragTargetValid(s, drag, cell) {
    if (!cell || !drag) return false;
    if (drag.kind === 'piece') {
      if (cell.i === R.grid.idx(drag.fromC, drag.fromR)) return true;
      return R.grid.isBuildable(s, cell.c, cell.r);
    }
    return R.pieces.placementProblem(s, drag.type, cell.c, cell.r) === null;
  }

  function updateDrag(s, clientX, clientY) {
    var d = s.ui.drag;
    if (!d) return;
    d.x = clientX;
    d.y = clientY;
    d.cell = cellAt(clientX, clientY);
    d.valid = dragTargetValid(s, d, d.cell);
  }

  function startDrag(s) {
    press.dragging = true;
    s.ui.drag = {
      kind: press.kind,
      type: press.type,
      pieceId: press.pieceId,
      fromC: press.fromC,
      fromR: press.fromR,
      x: press.startX,
      y: press.startY,
      cell: null,
      valid: false,
      dragging: true
    };
    R.pieces.deselect(s);
  }

  function endDrag(s, commit) {
    var d = s.ui.drag;
    s.ui.drag = null;
    if (!d || !commit) return;
    if (!d.cell || !d.valid) return;
    if (d.kind === 'piece') {
      R.pieces.move(s, d.fromC, d.fromR, d.cell.c, d.cell.r);
    } else {
      R.pieces.place(s, d.type, d.cell.c, d.cell.r);
    }
  }

  /* ---------- taps ---------- */

  /*
   * While a walkthrough step is waiting for one particular tap, the rest of
   * the board is inert. Nothing else is blocked: the help button, pause, sound
   * and the palette all behave normally throughout.
   */
  function tutorialBlocks(s, cell) {
    var step = R.tutorialStep(s);
    if (!step) return false;
    var want = R.tutorialCell(s);
    if (step === 'place') return !want || cell.c !== want.c || cell.r !== want.r;
    if (step === 'rotate') return !want || cell.c !== want.c || cell.r !== want.r;
    /* The last step wants the START WAVE button, so the board is inert. */
    return true;
  }

  function handleTap(s, cell) {
    if (tutorialBlocks(s, cell)) {
      R.emit(s, 'tutorialblocked', { c: cell.c, r: cell.r });
      return;
    }
    var piece = R.pieces.at(s, cell.c, cell.r);
    var selected = R.pieces.selected(s);

    if (s.ui.moveMode && selected) {
      if (piece && piece.id === selected.id) {
        s.ui.moveMode = false;
        return;
      }
      R.pieces.move(s, selected.c, selected.r, cell.c, cell.r);
      return;
    }

    if (piece) {
      if (selected && selected.id === piece.id) R.pieces.deselect(s);
      else R.pieces.select(s, piece);
      return;
    }

    if (selected) {
      R.pieces.deselect(s);
      return;
    }

    R.pieces.place(s, s.ui.selectedType, cell.c, cell.r);
  }

  /* ---------- pointer handlers ---------- */

  function onBoardPointerDown(ev) {
    var s = R.state;
    if (!s || press) return;
    if (!boardAcceptsInput(s)) return;
    /* Widgets drawn over the board (action bar, undo chip) handle themselves. */
    if (ev.target && ev.target.id !== 'gl') return;
    var cell = cellAt(ev.clientX, ev.clientY);
    if (!cell) return;
    ev.preventDefault();

    var piece = R.pieces.at(s, cell.c, cell.r);
    press = {
      id: ev.pointerId,
      kind: piece ? 'piece' : 'tap',
      type: piece ? piece.type : s.ui.selectedType,
      pieceId: piece ? piece.id : null,
      fromC: cell.c,
      fromR: cell.r,
      startX: ev.clientX,
      startY: ev.clientY,
      cell: cell,
      dragging: false
    };
  }

  input.beginPaletteDrag = function (type, ev) {
    var s = R.state;
    if (!s || press) return;
    if (!boardAcceptsInput(s)) return;
    if (!s.unlocked[type]) return;
    press = {
      id: ev.pointerId,
      kind: 'palette',
      type: type,
      pieceId: null,
      fromC: -1,
      fromR: -1,
      startX: ev.clientX,
      startY: ev.clientY,
      cell: null,
      dragging: false
    };
  };

  function onPointerMove(ev) {
    var s = R.state;
    if (!s || !press || ev.pointerId !== press.id) return;
    var dx = ev.clientX - press.startX;
    var dy = ev.clientY - press.startY;
    if (!press.dragging) {
      if (dx * dx + dy * dy <= DRAG_THRESHOLD * DRAG_THRESHOLD) return;
      if (press.kind === 'tap') {
        /* A drag that started on an empty tile is not a gesture we use. */
        press = null;
        return;
      }
      startDrag(s);
    }
    updateDrag(s, ev.clientX, ev.clientY);
  }

  function onPointerUp(ev) {
    var s = R.state;
    if (!press || ev.pointerId !== press.id) return;
    var p = press;
    press = null;
    if (!s || !boardAcceptsInput(s)) {
      s.ui.drag = null;
      return;
    }

    if (p.dragging) {
      updateDrag(s, ev.clientX, ev.clientY);
      endDrag(s, true);
      return;
    }

    if (p.kind === 'palette') return;

    var cell = cellAt(ev.clientX, ev.clientY);
    if (!cell || cell.i !== R.grid.idx(p.fromC, p.fromR)) return;
    handleTap(s, cell);
  }

  function onPointerCancel(ev) {
    var s = R.state;
    if (!press || ev.pointerId !== press.id) return;
    press = null;
    if (s) endDrag(s, false);
  }

  /* ---------- keyboard (development convenience) ---------- */

  function onKeyDown(ev) {
    var s = R.state;
    if (!s || ev.metaKey || ev.ctrlKey || ev.altKey) return;
    var k = ev.key;
    if (k >= '1' && k <= '4') {
      s.ui.selectedType = R.PIECE_TYPES[Number(k) - 1];
    } else if (k === 'f' || k === 'F') {
      var p = R.pieces.selected(s);
      if (p) R.pieces.flip(s, p.c, p.r);
    } else if (k === ' ') {
      if (s.phase === 'building') R.callWaveEarly(s);
      ev.preventDefault();
    } else if (k === 'p' || k === 'P') {
      if (s.phase === 'paused') R.resume();
      else R.pause();
    }
  }

  input.init = function () {
    var board = document.getElementById('board');
    board.addEventListener('pointerdown', onBoardPointerDown);
    global.addEventListener('pointermove', onPointerMove, { passive: true });
    global.addEventListener('pointerup', onPointerUp);
    global.addEventListener('pointercancel', onPointerCancel);
    global.addEventListener('blur', function () { input.cancel(); });
    global.addEventListener('keydown', onKeyDown);

    /* Stop the browser turning taps into zoom, scroll or text selection. */
    document.addEventListener('gesturestart', function (ev) { ev.preventDefault(); });
    document.addEventListener('dblclick', function (ev) { ev.preventDefault(); });
    document.addEventListener('contextmenu', function (ev) { ev.preventDefault(); });
    document.addEventListener('touchmove', function (ev) {
      if (ev.cancelable) ev.preventDefault();
    }, { passive: false });
  };

  input.cancel = function () {
    press = null;
    if (R.state) R.state.ui.drag = null;
  };
})(typeof window !== 'undefined' ? window : globalThis);
</script>

<script>
/*
