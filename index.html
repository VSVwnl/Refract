<style>
/*
 * Portrait layout, HUD chrome and overlays. The board itself is WebGL; every
 * piece of text on screen is DOM so it stays crisp and readable.
 */

:root {
  --bg: #0b0f1e;
  --panel: #121a30;
  --panel-2: #182240;
  --line: #26325a;
  --ink: #e8eeff;
  --ink-dim: #93a2c8;
  --gold: #ffc247;
  --hp: #ff5d6c;
  --lit: #7ce0a8;
  --accent: #59e8ff;
  --hud-h: 56px;
  --strip-h: 32px;
  --action-h: 56px;
  --palette-h: 96px;
  --pad: 8px;
  --radius: 10px;
}

* { box-sizing: border-box; }

html, body {
  margin: 0;
  padding: 0;
  height: 100%;
  overflow: hidden;
  overscroll-behavior: none;
  background: var(--bg);
  color: var(--ink);
  font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  -webkit-user-select: none;
  user-select: none;
  -webkit-tap-highlight-color: transparent;
  -webkit-text-size-adjust: 100%;
}

body { position: fixed; inset: 0; }

#stage {
  position: absolute;
  inset: 0;
  display: flex;
  align-items: stretch;
  justify-content: center;
  background: #05070f;
}

#app {
  position: relative;
  width: 100%;
  height: 100%;
  display: flex;
  flex-direction: column;
  background: var(--bg);
  touch-action: none;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
  overflow: hidden;
}

#sideNote {
  position: absolute;
  left: 12px;
  bottom: 12px;
  font-size: 12px;
  letter-spacing: 0.08em;
  color: #45507a;
  display: none;
  z-index: 1;
}

body.wide #sideNote { display: block; }

/* ---------- HUD ---------- */

#hud {
  flex: 0 0 auto;
  height: var(--hud-h);
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 0 var(--pad);
  border-bottom: 1px solid var(--line);
  background: linear-gradient(180deg, #131c33 0%, #0d1426 100%);
}

#stats {
  flex: 1 1 auto;
  min-width: 0;
  display: grid;
  grid-template-columns: 1fr 1fr;
  grid-template-rows: 22px 22px;
  align-content: center;
  column-gap: 6px;
}

.stat {
  display: flex;
  align-items: baseline;
  gap: 3px;
  font-size: 15px;
  line-height: 22px;
  white-space: nowrap;
  overflow: hidden;
}

.stat .ico { font-size: 13px; }
.stat .ico.hp { color: var(--hp); }
.stat .ico.gold { color: var(--gold); }
.stat .lbl { font-size: 10px; letter-spacing: 0.1em; color: var(--ink-dim); }
.stat .val { font-weight: 700; font-variant-numeric: tabular-nums; }
.stat .sub { font-size: 11px; color: var(--ink-dim); }
#statLit .val { color: var(--lit); }
#statGold .val { color: var(--gold); }

.stat.bump .val { animation: bump 260ms ease-out; }
.stat.shake { animation: shake 260ms ease-out; }

@keyframes bump {
  0% { transform: scale(1); }
  40% { transform: scale(1.35); }
  100% { transform: scale(1); }
}

@keyframes shake {
  0%, 100% { transform: translateX(0); }
  25% { transform: translateX(-4px); }
  75% { transform: translateX(4px); }
}

#hudButtons {
  flex: 0 0 auto;
  display: flex;
  gap: 4px;
}

.iconbtn {
  width: 44px;
  height: 44px;
  border-radius: var(--radius);
  border: 1px solid var(--line);
  background: var(--panel-2);
  color: var(--ink);
  font: 600 15px/1 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 0;
  touch-action: none;
}

.iconbtn:active, .iconbtn.on { background: #2a3765; border-color: var(--accent); }

.glyph-pause {
  width: 14px;
  height: 14px;
  display: block;
  border-left: 4px solid currentColor;
  border-right: 4px solid currentColor;
}

.iconbtn.playing .glyph-pause {
  border: 0;
  width: 0;
  height: 0;
  border-left: 12px solid currentColor;
  border-top: 7px solid transparent;
  border-bottom: 7px solid transparent;
}

.glyph-sound { font-style: normal; position: relative; font-size: 18px; }

.iconbtn.muted { color: var(--ink-dim); }

.iconbtn.muted .glyph-sound::after {
  content: "";
  position: absolute;
  left: -5px;
  top: 50%;
  width: 20px;
  height: 2px;
  background: var(--hp);
  transform: rotate(-40deg);
}

/* ---------- incoming strip ---------- */

#strip {
  flex: 0 0 auto;
  height: var(--strip-h);
  display: flex;
  align-items: center;
  gap: 6px;
  padding: 0 var(--pad);
  font-size: 12px;
  letter-spacing: 0.06em;
  color: var(--ink-dim);
  border-bottom: 1px solid #1a2340;
  overflow: hidden;
  white-space: nowrap;
}

#strip .em { color: var(--ink); font-weight: 700; }
#strip .warn { color: var(--gold); font-weight: 700; }
#strip.flash { animation: stripflash 900ms ease-out; }

@keyframes stripflash {
  0% { background: #2b3a17; color: #d9ff9a; }
  100% { background: transparent; }
}

/* enemy pips drawn in the incoming strip */
.pip {
  display: inline-block;
  width: 12px;
  height: 12px;
  border-radius: 50%;
  vertical-align: -2px;
  margin-right: 2px;
  border: 1px solid rgba(255, 255, 255, 0.25);
}

.pip.big { width: 17px; height: 17px; vertical-align: -4px; }
.pip.mote { background: #6b2fa8; }
.pip.runner { background: #1f8a86; border-radius: 2px; }
.pip.swarmling { width: 8px; height: 8px; background: #b23a80; vertical-align: 0; }
.pip.brute { background: #4a4270; border-radius: 3px; }
.pip.bruteking { background: #7a5a20; border-radius: 3px; }
.pip.umbra { background: #5a2a9a; }

/* ---------- board ---------- */

#boardWrap {
  flex: 1 1 auto;
  min-height: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  position: relative;
}

#board { position: relative; }

#gl { display: block; width: 100%; height: 100%; }

#boardOverlay {
  position: absolute;
  inset: 0;
  pointer-events: none;
}

/* ---------- action row ---------- */

#actionRow {
  flex: 0 0 auto;
  height: var(--action-h);
  display: flex;
  gap: 8px;
  padding: 6px var(--pad);
  border-top: 1px solid var(--line);
}

.actbtn {
  flex: 1 1 0;
  min-width: 0;
  border-radius: var(--radius);
  border: 1px solid var(--line);
  background: var(--panel-2);
  color: var(--ink);
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 1px;
  padding: 0 6px;
  font-family: inherit;
  touch-action: none;
}

.actbtn .a1 { font-size: 13px; font-weight: 700; letter-spacing: 0.04em; }
.actbtn .a2 { font-size: 11px; color: var(--ink-dim); }
.actbtn.primary { background: #1d3350; border-color: #2f5f86; }
.actbtn.primary .a2 { color: var(--gold); }
.actbtn:active { filter: brightness(1.35); }
.actbtn.dim { opacity: 0.42; }
.actbtn[hidden] { display: none; }

/* ---------- palette ---------- */

#palette {
  flex: 0 0 auto;
  height: var(--palette-h);
  display: flex;
  gap: 6px;
  padding: 6px var(--pad) 8px;
  border-top: 1px solid var(--line);
  background: linear-gradient(180deg, #0d1426 0%, #101830 100%);
}

.pbtn {
  flex: 1 1 0;
  min-width: 0;
  position: relative;
  border-radius: var(--radius);
  border: 1px solid var(--line);
  background: var(--panel);
  color: var(--ink);
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 3px;
  padding: 4px 2px;
  font-family: inherit;
  touch-action: none;
  overflow: hidden;
}

.pbtn .pname { font-size: 10px; letter-spacing: 0.06em; color: var(--ink-dim); }
.pbtn .pcost { font-size: 12px; font-weight: 700; color: var(--gold); }
.pbtn .pcost .c { font-size: 9px; }
.pbtn.sel { border-color: var(--accent); background: #17284a; box-shadow: 0 0 0 1px var(--accent) inset; }
.pbtn.sel .pname { color: var(--ink); }
.pbtn.poor .pcost { color: var(--hp); }
.pbtn.locked { opacity: 0.55; }
.pbtn.locked .pcost { color: var(--ink-dim); }
.pbtn:active { filter: brightness(1.3); }
.pbtn.unlockflash { animation: unlockflash 900ms ease-out; }

@keyframes unlockflash {
  0% { background: #f5f0d0; border-color: #fff; }
  100% { background: var(--panel); }
}

/* palette icons, drawn with CSS so no image files are needed */
.picon { width: 30px; height: 30px; position: relative; flex: 0 0 auto; }

.picon.mirror::before {
  content: "";
  position: absolute;
  left: 2px;
  top: 13px;
  width: 26px;
  height: 5px;
  border-radius: 2px;
  background: linear-gradient(180deg, #eaf4ff, #7fa4cf);
  box-shadow: 0 0 6px #59e8ff;
  transform: rotate(-45deg);
}

.picon.splitter::before {
  content: "";
  position: absolute;
  inset: 4px;
  border: 2px solid #b388ff;
  border-radius: 3px;
  background: rgba(179, 136, 255, 0.18);
}

.picon.splitter::after {
  content: "";
  position: absolute;
  left: 3px;
  top: 13px;
  width: 24px;
  height: 3px;
  background: #dcc7ff;
  transform: rotate(-45deg);
}

.picon.reflector::before {
  content: "";
  position: absolute;
  left: 4px;
  top: 6px;
  width: 22px;
  height: 20px;
  border: 3px solid #ffc861;
  border-top-color: transparent;
  border-radius: 0 0 14px 14px;
}

.picon.lamp::before {
  content: "";
  position: absolute;
  left: 9px;
  top: 10px;
  width: 12px;
  height: 12px;
  border-radius: 50%;
  background: #ffb03a;
  box-shadow: 0 0 10px #ffb03a;
}

.picon.lamp::after {
  content: "";
  position: absolute;
  left: 13px;
  top: 1px;
  width: 4px;
  height: 7px;
  background: #ffd98a;
  border-radius: 2px;
}

.plock {
  position: absolute;
  inset: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 11px;
  font-weight: 700;
  letter-spacing: 0.08em;
  color: var(--ink-dim);
  background: rgba(8, 12, 24, 0.78);
}

/* ---------- board overlay widgets ---------- */

.floater {
  position: absolute;
  font-size: 15px;
  font-weight: 700;
  transform: translate(-50%, -50%);
  pointer-events: none;
  text-shadow: 0 1px 3px #000;
  white-space: nowrap;
}

.floater.gold { color: var(--gold); }
.floater.dmg { color: var(--hp); }
.floater.info { color: var(--ink); }

.banner {
  position: absolute;
  left: 50%;
  top: 34%;
  transform: translate(-50%, -50%);
  font-size: 26px;
  font-weight: 800;
  letter-spacing: 0.12em;
  text-shadow: 0 2px 12px #000;
  pointer-events: none;
  white-space: nowrap;
}

.banner.sub { font-size: 15px; letter-spacing: 0.08em; color: var(--gold); top: 42%; }

.hint {
  position: absolute;
  left: 50%;
  bottom: 8px;
  transform: translateX(-50%);
  max-width: 92%;
  padding: 8px 12px;
  border-radius: 8px;
  background: rgba(10, 16, 32, 0.92);
  border: 1px solid var(--line);
  font-size: 13px;
  line-height: 1.35;
  text-align: center;
  pointer-events: none;
}

#actionBar {
  position: absolute;
  display: flex;
  gap: 4px;
  transform: translate(-50%, 0);
  pointer-events: auto;
  z-index: 4;
}

#actionBar button {
  min-width: 52px;
  height: 40px;
  border-radius: 8px;
  border: 1px solid var(--accent);
  background: rgba(14, 22, 44, 0.96);
  color: var(--ink);
  font: 700 12px/1 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  letter-spacing: 0.06em;
  touch-action: none;
}

#actionBar button:active { background: #2a3765; }
#actionBar button.danger { border-color: var(--hp); color: #ffd7db; }

#undoChip {
  position: absolute;
  left: 50%;
  bottom: 8px;
  transform: translateX(-50%);
  height: 40px;
  padding: 0 16px;
  border-radius: 20px;
  border: 1px solid var(--accent);
  background: rgba(14, 22, 44, 0.96);
  color: var(--ink);
  font: 700 13px/38px system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  letter-spacing: 0.08em;
  pointer-events: auto;
  z-index: 4;
  touch-action: none;
}

#dragGhost {
  position: absolute;
  pointer-events: none;
  transform: translate(-50%, -50%);
  z-index: 5;
}

/* ---------- overlays ---------- */

#overlayRoot {
  position: absolute;
  inset: 0;
  display: none;
  z-index: 10;
}

#overlayRoot.on { display: block; }

.overlay {
  position: absolute;
  inset: 0;
  background: rgba(5, 8, 18, 0.93);
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 12px;
  padding: 20px 18px calc(20px + env(safe-area-inset-bottom, 0px));
  overflow-y: auto;
  text-align: center;
}

.overlay h1 {
  margin: 0;
  font-size: 44px;
  letter-spacing: 0.2em;
  font-weight: 800;
  color: #fff;
  text-shadow: 0 0 24px rgba(120, 200, 255, 0.75), 0 0 60px rgba(255, 190, 90, 0.35);
}

.overlay h2 {
  margin: 0;
  font-size: 27px;
  letter-spacing: 0.14em;
  font-weight: 800;
}

.overlay .tag { font-size: 14px; color: var(--ink-dim); letter-spacing: 0.06em; margin: 0; }
.overlay .note { font-size: 12px; color: #6c7ba6; letter-spacing: 0.04em; margin: 0; }

.overlay .rows {
  width: 100%;
  max-width: 330px;
  display: flex;
  flex-direction: column;
  gap: 7px;
  margin: 2px 0;
}

.overlay .row {
  display: flex;
  align-items: center;
  gap: 9px;
  font-size: 13px;
  line-height: 1.35;
  text-align: left;
  color: var(--ink);
  background: rgba(20, 28, 52, 0.7);
  border: 1px solid #202b4e;
  border-radius: 8px;
  padding: 8px 10px;
}

.overlay .row b { color: var(--accent); font-weight: 700; }
.overlay .row .k { color: var(--gold); font-weight: 700; }

.bigbtn {
  min-height: 64px;
  min-width: 210px;
  padding: 0 26px;
  border-radius: 14px;
  border: 1px solid #3f6f9e;
  background: linear-gradient(180deg, #2a5580, #1a3350);
  color: #fff;
  font: 800 20px/1 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  letter-spacing: 0.14em;
  touch-action: none;
}

.bigbtn:active { filter: brightness(1.3); }
.bigbtn.ghost { background: rgba(20, 28, 52, 0.7); border-color: var(--line); font-size: 15px; min-height: 52px; }

.statline { font-size: 14px; color: var(--ink); letter-spacing: 0.04em; }
.statline b { color: var(--gold); }

.tip {
  max-width: 330px;
  font-size: 13px;
  line-height: 1.45;
  color: #cfd9f5;
  background: rgba(30, 20, 20, 0.6);
  border: 1px solid #4a2b33;
  border-radius: 8px;
  padding: 10px 12px;
}

#fatal {
  position: absolute;
  inset: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 24px;
  text-align: center;
  font-size: 16px;
  line-height: 1.5;
  background: var(--bg);
  color: var(--ink);
  z-index: 50;
}

#fatal[hidden] { display: none; }

/* ---------- narrow phones ---------- */

@media (max-width: 374px) {
  .iconbtn { width: 40px; height: 40px; font-size: 14px; }
  .stat { font-size: 14px; }
  .overlay h1 { font-size: 38px; }
}

@media (max-height: 680px) {
  :root { --palette-h: 84px; --hud-h: 52px; --action-h: 50px; }
  .overlay h1 { font-size: 34px; }
  .bigbtn { min-height: 56px; }
}
</style>

/*
 * Configuration: every tunable number, the fixed map, colours and layout
 * constants. Systems read from here; they never hard-code values.
 */
(function (global) {
  'use strict';
  var R = global.R || (global.R = {});

  /* Direction codes. N is towards row 0 (up the screen). */
  R.N = 0;
  R.E = 1;
  R.S = 2;
  R.W = 3;
  R.DIR_NAMES = ['N', 'E', 'S', 'W'];

  /* Cell kinds stored in state.grid.kind. */
  R.EMPTY = 0;
  R.ROAD = 1;
  R.CORE = 2;
  R.SPAWN = 3;

  R.BALANCE = {
    COLS: 8,
    ROWS: 12,
    CORE_HP: 20,
    START_GOLD: 40,
    CORE_POWER: [10, 13, 17, 22, 28, 35],
    CORE_UPGRADE_COST: [60, 100, 150, 220, 300],
    LAMP_FACTOR: 0.5,
    SPLIT_FACTOR: 0.55,
    REFLECT_FACTOR: 0.6,
    MIN_POWER: 0.5,
    MAX_DEPTH: 48,
    MAX_SEGMENTS: 128,
    PIECE_COST: { mirror: 20, splitter: 45, reflector: 60, lamp: 90 },
    LAMP_COST_STEP: 20,
    SELL_RATE: 0.7,
    UNDO_WINDOW: 3.0,
    MOVE_REFORM: 0.75,
    COUNTDOWN: 8,
    FIRST_COUNTDOWN: 10,
    GROUP_GAP: 1.5,
    EARLY_CALL_RATE: 1.5,
    WAVE_CLEAR_BASE: 12,
    WAVE_CLEAR_PER_WAVE: 3,
    HP_MULT_PER_WAVE: 0.15,
    UNLOCK_WAVE: { splitter: 2, reflector: 4, lamp: 7 },
    SPEED_OPTIONS: [1, 2],
    ENEMY: {
      mote:      { hp: 30,  speed: 1.0,  absorb: 0.25, gold: 4,   leak: 1,  radius: 0.28 },
      runner:    { hp: 16,  speed: 1.9,  absorb: 0.10, gold: 5,   leak: 1,  radius: 0.22 },
      swarmling: { hp: 8,   speed: 1.3,  absorb: 0.15, gold: 1,   leak: 1,  radius: 0.14 },
      brute:     { hp: 120, speed: 0.55, absorb: 0.70, gold: 16,  leak: 3,  radius: 0.36 },
      bruteking: { hp: 400, speed: 0.45, absorb: 0.80, gold: 50,  leak: 6,  radius: 0.42, boss: true },
      umbra:     { hp: 900, speed: 0.40, absorb: 0.85, gold: 100, leak: 10, radius: 0.46, boss: true }
    },
    /* Each group is [type, count, gapSeconds]; groups run in order with GROUP_GAP between them. */
    WAVES: [
      [ ['mote', 4, 1.5] ],
      [ ['mote', 7, 1.2] ],
      [ ['runner', 4, 0.8], ['mote', 5, 1.2] ],
      [ ['mote', 10, 0.9], ['runner', 3, 0.7] ],
      [ ['brute', 2, 2.0], ['mote', 6, 1.0] ],

/*
   ==================================================================
   06_enemies.js
   ==================================================================
*/
/*
 * Enemies and waves. Enemies walk the fixed path, absorb light, die or reach
 * the core. Waves are read from the balance table and generated after wave 12.
 */
(function (global) {
  'use strict';
  var R = global.R || (global.R = {});
  var B = R.BALANCE;
  var CELLS = B.COLS * B.ROWS;

  var en = {};

  /* Reused enemy records, so a long run allocates nothing per wave. */
  var pool = [];

  function acquire() {
    return pool.length ? pool.pop() : {
      id: 0, type: '', hp: 0, maxHp: 0, t: 0, speed: 0, absorb: 0,
      gold: 0, leak: 0, radius: 0, boss: false,

    };

  en.releaseAll = function (s) {
    if (!s || !s.enemies) return;
    for (var i = 0; i < s.enemies.length; i++) pool.push(s.enemies[i]);
    s.enemies.length = 0;
  };

  /* ---------- wave data ---------- */

  en.hpMult = function (wave) {
    return 1 + B.HP_MULT_PER_WAVE * (wave - 1);
  };

  en.speedMult = function (wave) {
    if (wave <= 12) return 1;
    return Math.min(B.ENDLESS.SPEED_CAP, 1 + B.ENDLESS.SPEED_PER_WAVE * (wave - 12));
  };

  en.endlessGroups = function (wave) {
    var count = B.ENDLESS.BASE_COUNT + wave;
    var pattern = (wave - 13) % 4;
    var groups = [];
    if (pattern === 0) {
      groups.push(['mote', count, 0.6]);
      groups.push(['runner', Math.ceil(count / 3), 0.5]);
    } else if (pattern === 1) {
      groups.push(['runner', count, 0.45]);
      groups.push(['mote', Math.ceil(count / 3), 0.7]);
    } else if (pattern === 2) {
      groups.push(['swarmling', 8, 0.25]);
      groups.push(['swarmling', 8, 0.25]);
      groups.push(['swarmling', 8, 0.25]);
      groups.push(['mote', Math.ceil(count / 2), 0.6]);
    } else {
      groups.push(['brute', Math.max(2, Math.floor(count / 4)), 1.2]);
      groups.push(['mote', count, 0.6]);

      var count = groups[g][1];
      var gap = groups[g][2];

      var last = out[out.length - 1];

  en.spawn = function (s, type) {

    e.hp = e.maxHp;
    e.t = -1;
    e.speed = def.speed * en.speedMult(s.wave);
    e.absorb = def.absorb;
    e.gold = def.gold;
    e.leak = def.leak;
    e.radius = def.radius;

    for (var i = list.length - 1; i >= 0; i--) {
      var e = list[i];

        e.hp -= e.damage;
        e.damage = 0;
      }
      if (e.hp <= 0) {
        list.splice(i, 1);
        s.gold += e.gold;
        s.goldEarned += e.gold;

        pool.push(e);
        continue;
      }
      if (e.t >= end) {

        s.leaksBy[e.type] = (s.leaksBy[e.type] || 0) + 1;

    return s.enemies.length + (s.spawnQueue.length - s.spawnCursor);

  };

<script>
/*
   ==================================================================
   07_pieces.js
   ==================================================================
*/
/*
 * Pieces: buying, placing, flipping and the gold rules around them. All of it
 * is plain state manipulation; feedback is pushed onto state.events for the
 * renderer, the HUD and the audio system to pick up.
 */
(function (global) {
  'use strict';
  var R = global.R || (global.R = {});
  var B = R.BALANCE;

  R.pieces = {};

  R.pieces.cost = function (s, type) {
    if (type === 'lamp') return B.PIECE_COST.lamp + B.LAMP_COST_STEP * s.lampsBought;
    return B.PIECE_COST[type] || 0;
  };

  R.pieces.isUnlocked = function (s, type) {
    return !!s.unlocked[type];
  };

  /*
   * Why a placement would be refused, or null when it is allowed.
   * 'locked' | 'gold' | 'occupied' | 'terrain'
   */
  R.pieces.placementProblem = function (s, type, c, r) {
    if (!R.pieces.isUnlocked(s, type)) return 'locked';
    if (!R.grid.inBounds(c, r)) return 'terrain';
    var i = R.grid.idx(c, r);
    if (s.grid.kind[i] !== R.EMPTY) return 'terrain';
    if (s.pieces.has(i)) return 'occupied';
    if (s.gold < R.pieces.cost(s, type)) return 'gold';
    return null;
  };

  R.pieces.at = function (s, c, r) {
    if (!R.grid.inBounds(c, r)) return null;
    return s.pieces.get(R.grid.idx(c, r)) || null;
  };

  R.pieces.byId = function (s, id) {
    var it = s.pieces.values();
    var e = it.next();
    while (!e.done) {
      if (e.value.id === id) return e.value;
      e = it.next();
    }
    return null;
  };

   * Place a piece and pay for it. `orient` may be omitted, in which case the
   * orientation that puts the most light on the road is chosen.
   */
  R.pieces.place = function (s, type, c, r, orient) {
    var problem = R.pieces.placementProblem(s, type, c, r);
    if (problem) {
      R.emit(s, 'denied', { reason: problem, c: c, r: r, type: type, cost: R.pieces.cost(s, type) });
      return null;
    }

    var cost = R.pieces.cost(s, type);
    var chosen = orient;
    if (chosen === undefined || chosen === null) chosen = R.beam.bestOrientation(s, type, c, r);

    var piece = {
      id: s.nextPieceId++,
      type: type,
      c: c,
      r: r,
      i: R.grid.idx(c, r),
      orient: type === 'lamp' ? 0 : (chosen % 2),
      dir: type === 'lamp' ? (chosen % 4) : R.N,
      cost: cost,
      placedAt: s.time,
      inactiveUntil: -1

    s.pieces.set(piece.i, piece);
    if (type === 'lamp') s.lampsBought++;

  R.pieces.flip = function (s, c, r) {

      return false;

    var crystal = new THREE.Mesh(
      new THREE.OctahedronGeometry(0.3, 0),
      new THREE.MeshLambertMaterial({ color: C.core, emissive: C.coreRim, emissiveIntensity: 0.9 })
    );
    crystal.position.y = 0.52;
    core.add(crystal);
    var haze = new THREE.Mesh(
      new THREE.PlaneGeometry(1.9, 1.9),
      new THREE.MeshBasicMaterial({
        map: rd.tex.glow,
        color: C.coreRim,
        transparent: true,
        opacity: 0.5,
        depthWrite: false,
        blending: THREE.AdditiveBlending
      })
    );
    haze.rotation.x = -Math.PI / 2;
    haze.position.y = 0.02;
    core.add(haze);
    scene.add(core);
    rd.coreGroup = core;
    rd.coreCrystal = crystal;
    rd.coreHaze = haze;
  }

  /* ---------- init ---------- */

  rd.init = function (state) {
    THREE = global.THREE;
    if (!THREE) return false;

    var canvas = document.getElementById('gl');
    try {
      renderer = new THREE.WebGLRenderer({ canvas: canvas, antialias: true, alpha: false });
    } catch (err) {
      return false;
    }
    if (!renderer || !renderer.getContext()) return false;

    renderer.setPixelRatio(Math.min(global.devicePixelRatio || 1, 2));
    renderer.setClearColor(C.background, 1);

    scene = new THREE.Scene();
    dummy = new THREE.Object3D();
    raycaster = new THREE.Raycaster();
    pointerNdc = new THREE.Vector2();
    hitPoint = new THREE.Vector3();
    boardPlane = new THREE.Plane(new THREE.Vector3(0, 1, 0), 0);

    camera = new THREE.OrthographicCamera(-1, 1, 1, -1, 0.1, 200);
    var t = V.TILT_DEG * Math.PI / 180;
    camera.position.set(0, V.CAMERA_DISTANCE * Math.cos(t), V.CAMERA_DISTANCE * Math.sin(t));
    camera.lookAt(0, 0, 0);

    rd.tex.glow = glowTexture();
    rd.tex.beam = beamTexture();
    rd.tex.chevron = chevronTexture();
    rd.tex.ring = ringTexture();
    rd.tex.tileGlow = tileGlowTexture();

    buildLights();
    buildBoard(state);
    rd.buildDynamic();

    rd.scene = scene;
    rd.camera = camera;
    rd.renderer = renderer;
    rd.THREE = THREE;
    rd.ready = true;
    return true;
  };

  /* ---------- layout ---------- */

  rd.applyLayout = function () {
    var app = document.getElementById('app');
    var wrap = document.getElementById('boardWrap');
    var board = document.getElementById('board');
    var vw = global.innerWidth;
    var vh = global.innerHeight;

    var colW = Math.min(vw, Math.round(vh * R.LAYOUT.COLUMN_ASPECT));
    app.style.width = colW + 'px';
    document.body.classList.toggle('wide', vw > vh);

    var availW = wrap.clientWidth;
    var availH = wrap.clientHeight;
    var cellsW = B.COLS + 2 * V.MARGIN_X;
    var cellsH = B.ROWS + V.MARGIN_TOP + V.MARGIN_BOTTOM;
    var cell = Math.min(availW / cellsW, availH / cellsH);
    if (!(cell > 0)) cell = R.LAYOUT.MIN_CELL;

    var w = Math.max(64, Math.round(cellsW * cell));
    var h = Math.max(64, Math.round(cellsH * cell));
    board.style.width = w + 'px';
    board.style.height = h + 'px';

    rd.cell = cell;
    rd.boardW = w;
    rd.boardH = h;

    if (!rd.ready) return;

    camera.left = -(B.COLS / 2 + V.MARGIN_X);
    camera.right = B.COLS / 2 + V.MARGIN_X;
    camera.top = (B.ROWS / 2 + V.MARGIN_TOP) * cosTilt;
    camera.bottom = -(B.ROWS / 2 + V.MARGIN_BOTTOM) * cosTilt;
    camera.updateProjectionMatrix();
    renderer.setSize(w, h, false);
  };

  /* ---------- coordinate helpers ---------- */

  /* Board-overlay pixel position of a world point. */
  var projScratch = null;
  rd.project = function (x, y, z, out) {
    if (!rd.ready) return null;
    if (!projScratch) projScratch = new THREE.Vector3();
    projScratch.set(x, y, z).project(camera);
    var o = out || {};
    o.x = (projScratch.x * 0.5 + 0.5) * rd.boardW;
    o.y = (-projScratch.y * 0.5 + 0.5) * rd.boardH;
    return o;
  };

  rd.projectCell = function (c, r, y, out) {
    return rd.project(R.grid.worldX(c), y || 0, R.grid.worldZ(r), out);
  };

  /* Convert a client-space pointer position to a board cell, or null. */
  rd.cellFromClient = function (clientX, clientY) {
    if (!rd.ready) return null;
    var board = document.getElementById('board');
    var rect = board.getBoundingClientRect();
    if (rect.width <= 0 || rect.height <= 0) return null;
    pointerNdc.x = ((clientX - rect.left) / rect.width) * 2 - 1;
    pointerNdc.y = -((clientY - rect.top) / rect.height) * 2 + 1;
    raycaster.setFromCamera(pointerNdc, camera);
    if (!raycaster.ray.intersectPlane(boardPlane, hitPoint)) return null;
    var c = R.grid.colFromWorldX(hitPoint.x);
    var r = R.grid.rowFromWorldZ(hitPoint.z);
    if (!R.grid.inBounds(c, r)) return null;
    return { c: c, r: r, i: R.grid.idx(c, r) };
  };


  /* ---------- dynamic layer: lit tiles, beams and pieces ---------- */

  var CELLS = B.COLS * B.ROWS;
  var MAX_PIECES = 48;
  var LIT_Y = 0.035;
  var BEAM_Y = 0.16;
  var PIECE_Y = 0.0;

  var dyn = {};
  var scratchColor = null;
  var hiddenMatrix = null;

  /* Rotation that lays a plane flat and points its length along a direction. */
  function dirAngle(dir) {
    return -Math.atan2(R.grid.DC[dir], -R.grid.DR[dir]);
  }

  function additiveMaterial(map, color) {
    return new THREE.MeshBasicMaterial({
      map: map || null,
      color: color,
      transparent: true,
      depthWrite: false,
      blending: THREE.AdditiveBlending
    });
  }

  function makeInstanced(geo, mat, count, order) {
    var mesh = new THREE.InstancedMesh(geo, mat, count);
    mesh.frustumCulled = false;
    mesh.renderOrder = order || 0;
    mesh.count = count;
    for (var i = 0; i < count; i++) {
      mesh.setMatrixAt(i, hiddenMatrix);
      mesh.setColorAt(i, scratchColor.setHex(0xffffff));
    }
    mesh.instanceMatrix.needsUpdate = true;
    if (mesh.instanceColor) mesh.instanceColor.needsUpdate = true;
    scene.add(mesh);
    return mesh;
  }

  /* A writer that fills instances in order and hides the leftovers. */
  function Filler(mesh) {
    this.mesh = mesh;
    this.n = 0;
  }

  Filler.prototype.push = function (x, y, z, rotZ, sx, sy, colorHex) {
    var mesh = this.mesh;
    if (this.n >= mesh.instanceMatrix.count) return;
    dummy.position.set(x, y, z);
    dummy.rotation.set(-Math.PI / 2, 0, rotZ);
    dummy.scale.set(sx, sy, 1);
    dummy.updateMatrix();
    mesh.setMatrixAt(this.n, dummy.matrix);
    mesh.setColorAt(this.n, scratchColor.setHex(colorHex));
    this.n++;
  };

  Filler.prototype.pushObject = function (obj, colorHex) {
    var mesh = this.mesh;
    if (this.n >= mesh.instanceMatrix.count) return;
    obj.updateMatrix();
    mesh.setMatrixAt(this.n, obj.matrix);
    mesh.setColorAt(this.n, scratchColor.setHex(colorHex));
    this.n++;
  };

  Filler.prototype.finish = function () {
    var mesh = this.mesh;
    for (var i = this.n; i < mesh.instanceMatrix.count; i++) mesh.setMatrixAt(i, hiddenMatrix);
    mesh.instanceMatrix.needsUpdate = true;
    if (mesh.instanceColor) mesh.instanceColor.needsUpdate = true;
    this.n = 0;
  };

  rd.buildDynamic = function () {
    scratchColor = new THREE.Color();
    hiddenMatrix = new THREE.Matrix4().makeScale(0, 0, 0);

    var quad = new THREE.PlaneGeometry(1, 1);

    dyn.litGlow = makeInstanced(quad, additiveMaterial(rd.tex.tileGlow, 0xffffff), CELLS, 1);
    dyn.beamGlow = makeInstanced(quad, additiveMaterial(rd.tex.beam, 0xffffff), B.MAX_SEGMENTS, 2);
    dyn.beamCore = makeInstanced(quad, additiveMaterial(rd.tex.beam, 0xffffff), B.MAX_SEGMENTS, 3);
    dyn.bounce = makeInstanced(quad, additiveMaterial(rd.tex.glow, 0xffffff), 32, 4);

    /* Mirror: a thin bright slab standing on the tile at 45 degrees. */
    dyn.mirrorBody = makeInstanced(
      new THREE.BoxGeometry(0.92, 0.26, 0.09),
      new THREE.MeshLambertMaterial({ color: C.mirror, emissive: 0x24486b, emissiveIntensity: 0.6 }),
      MAX_PIECES
    );
    dyn.mirrorEdge = makeInstanced(
      new THREE.BoxGeometry(0.94, 0.05, 0.13),
      additiveMaterial(null, C.mirrorEdge),
      MAX_PIECES,
      2
    );

    /* Splitter: a translucent violet cube with a bright internal diagonal. */
    dyn.splitterBody = makeInstanced(
      new THREE.BoxGeometry(0.72, 0.42, 0.72),
      new THREE.MeshLambertMaterial({
        color: C.splitter, emissive: 0x3b1d6b, emissiveIntensity: 0.8,
        transparent: true, opacity: 0.62
      }),
      MAX_PIECES
    );
    dyn.splitterPlane = makeInstanced(
      new THREE.BoxGeometry(0.98, 0.30, 0.05),
      additiveMaterial(null, 0xdcc7ff),
      MAX_PIECES,
      2
    );

    /* Reflector: a golden cup that throws the light straight back. */
    dyn.reflectorCup = makeInstanced(
      new THREE.CylinderGeometry(0.38, 0.20, 0.34, 14, 1, true),
      new THREE.MeshLambertMaterial({
        color: C.reflector, emissive: 0x6b4a12, emissiveIntensity: 0.7, side: THREE.DoubleSide
      }),
      MAX_PIECES
    );
    dyn.reflectorDisc = makeInstanced(
      new THREE.CircleGeometry(0.19, 14),
      additiveMaterial(null, 0xffe6a8),
      MAX_PIECES,
      2
    );

    /* Lamp: a lantern with a notch showing which way it points. */
    dyn.lampBody = makeInstanced(
      new THREE.CylinderGeometry(0.22, 0.27, 0.40, 6),
      new THREE.MeshLambertMaterial({ color: C.lamp, emissive: 0xa85f10, emissiveIntensity: 1.0 }),
      MAX_PIECES
    );
    dyn.lampNotch = makeInstanced(
      new THREE.BoxGeometry(0.14, 0.14, 0.30),
      additiveMaterial(null, 0xffe9b0),
      MAX_PIECES,
      2
    );

    dyn.pieceObj = new THREE.Object3D();
    buildEnemies();
  };

  /*
   * Colour tracks the fraction of the source power that is left, so light
   * that has been through an enemy is visibly amber and then red. Width tracks
   * absolute power, so upgrading the core thickens every beam.
   */
  function beamColor(fraction) {
    if (fraction >= 0.86) return C.beamHot;
    if (fraction >= 0.45) return R.util.mixColor(C.beamMid, C.beamHot, (fraction - 0.45) / 0.41);
    return R.util.mixColor(C.beamLow, C.beamMid, R.util.clamp(fraction / 0.45, 0, 1));
  }

  function beamWidth(power) {
    return 0.09 + 0.27 * R.util.clamp(power / 35, 0, 1);
  }

  /*
   * Only road cells glow. That is the number the player is pushing (LIT n/25),
   * and it keeps light spilling over buildable tiles from washing the board out.
   */
  function drawLitTiles(state) {
    var f = new Filler(dyn.litGlow);
    var lit = state.beam.lit;
    var kinds = state.grid.kind;
    var srcPower = R.beam.corePower(state.coreLevel);
    for (var i = 0; i < CELLS; i++) {
      var p = lit[i];
      if (p <= 0) continue;
      if (kinds[i] !== R.ROAD && kinds[i] !== R.SPAWN) continue;
      var c = i % B.COLS;
      var r = (i - c) / B.COLS;
      var strength = R.util.clamp(p / srcPower, 0.06, 1);
      var hue = R.util.mixColor(C.beamLow, C.litGlow, R.util.clamp(strength * 1.5, 0, 1));
      var col = R.util.mixColor(0x000000, hue, 0.10 + 0.38 * strength);
      f.push(R.grid.worldX(c), LIT_Y, R.grid.worldZ(r), 0, 1.06, 1.06, col);
    }
    f.finish();
  }

  function drawBeams(state) {
    var glow = new Filler(dyn.beamGlow);
    var core = new Filler(dyn.beamCore);
    var bounce = new Filler(dyn.bounce);
    var segs = state.beam.segments;
    var n = state.beam.segCount;

    for (var i = 0; i < n; i++) {
      var s = segs[i];
      var len = Math.abs(s.x1 - s.x0) + Math.abs(s.z1 - s.z0);
      if (len <= 0.001) continue;
      var mx = (s.x0 + s.x1) / 2;
      var mz = (s.z0 + s.z1) / 2;
      var rot = dirAngle(s.dir);
      var power = s.powerStart;
      var frac = s.sourcePower > 0 ? R.util.clamp(power / s.sourcePower, 0, 1) : 0;
      var col = beamColor(frac);
      var w = beamWidth(power);
      glow.push(mx, BEAM_Y, mz, rot, w * 1.7, len + 0.04, R.util.mixColor(0x000000, col, 0.09 + 0.21 * frac));
      core.push(mx, BEAM_Y + 0.005, mz, rot, w * (0.34 + 0.2 * frac), len + 0.04,
        R.util.mixColor(0x000000, col, 0.34 + 0.56 * frac));
      if (s.bendAtStart) {
        bounce.push(s.x0, BEAM_Y + 0.01, s.z0, 0, 0.55, 0.55, R.util.mixColor(0x000000, col, 0.2 + 0.3 * frac));
      }
    }
    glow.finish();
    core.finish();
    bounce.finish();
  }

  var POP_TIME = 0.22;

  function pieceScale(state, p) {
    var age = state.time - p.placedAt;
    var s = 1;
    if (age >= 0 && age < POP_TIME) {
      var t = age / POP_TIME;
      s = 0.2 + 1.0 * R.util.easeOutBack(t);
    }
    if (p.inactiveUntil > state.time) s *= 0.72;
    return s;
  }

  function drawPieces(state) {
    var fills = {
      mirrorBody: new Filler(dyn.mirrorBody),
      mirrorEdge: new Filler(dyn.mirrorEdge),
      splitterBody: new Filler(dyn.splitterBody),
      splitterPlane: new Filler(dyn.splitterPlane),
      reflectorCup: new Filler(dyn.reflectorCup),
      reflectorDisc: new Filler(dyn.reflectorDisc),
      lampBody: new Filler(dyn.lampBody),
      lampNotch: new Filler(dyn.lampNotch)
    };
    var o = dyn.pieceObj;
    var it = state.pieces.values();
    var entry = it.next();
    while (!entry.done) {
      var p = entry.value;
      var x = R.grid.worldX(p.c);
      var z = R.grid.worldZ(p.r);
      var sc = pieceScale(state, p);
      var dim = p.inactiveUntil > state.time ? 0.45 : 1;
      var diag = p.orient === 0 ? Math.PI / 4 : -Math.PI / 4;

      if (p.type === 'mirror') {
        o.position.set(x, PIECE_Y + 0.13 * sc, z);
        o.rotation.set(0, diag, 0);
        o.scale.set(sc, sc, sc);
        fills.mirrorBody.pushObject(o, R.util.mixColor(0x101820, 0xffffff, dim));
        o.position.y = PIECE_Y + 0.26 * sc;
        fills.mirrorEdge.pushObject(o, R.util.mixColor(0x000000, C.mirrorEdge, dim));
      } else if (p.type === 'splitter') {
        o.position.set(x, PIECE_Y + 0.21 * sc, z);
        o.rotation.set(0, 0, 0);
        o.scale.set(sc, sc, sc);
        fills.splitterBody.pushObject(o, R.util.mixColor(0x101820, 0xffffff, dim));
        o.rotation.set(0, diag, 0);
        fills.splitterPlane.pushObject(o, R.util.mixColor(0x000000, 0xdcc7ff, dim));
      } else if (p.type === 'reflector') {
        o.position.set(x, PIECE_Y + 0.17 * sc, z);
        o.rotation.set(0, 0, 0);
        o.scale.set(sc, sc, sc);
        fills.reflectorCup.pushObject(o, R.util.mixColor(0x101820, 0xffffff, dim));
        o.position.y = PIECE_Y + 0.35 * sc;
        o.rotation.set(-Math.PI / 2, 0, 0);
        fills.reflectorDisc.pushObject(o, R.util.mixColor(0x000000, 0xffe6a8, dim));
      } else if (p.type === 'lamp') {
        o.position.set(x, PIECE_Y + 0.20 * sc, z);
        o.rotation.set(0, 0, 0);
        o.scale.set(sc, sc, sc);
        fills.lampBody.pushObject(o, R.util.mixColor(0x101820, 0xffffff, dim));
        o.position.set(x + R.grid.DC[p.dir] * 0.26 * sc, PIECE_Y + 0.22 * sc, z + R.grid.DR[p.dir] * 0.26 * sc);
        fills.lampNotch.pushObject(o, R.util.mixColor(0x000000, 0xffe9b0, dim));
      }
      entry = it.next();
    }
    Object.keys(fills).forEach(function (k) { fills[k].finish(); });
  }


  /* ---------- enemies ---------- */

  var MAX_ENEMIES = 72;
  var MAX_BARS = 72;
  var UP_VEC = null;
  var travelVec = null;
  var billboardX = 0;

  /* Geometry per enemy type. Types added later fall back to the mote shape. */
  var ENEMY_SHAPE = {};

  function buildEnemies() {
    UP_VEC = new THREE.Vector3(0, 1, 0);
    travelVec = new THREE.Vector3(0, 0, 1);
    billboardX = V.TILT_DEG * Math.PI / 180 - Math.PI / 2;

    var mote = new THREE.SphereGeometry(1, 10, 8);
    var runner = new THREE.ConeGeometry(0.85, 2.1, 6);

    dyn.enemyMote = makeInstanced(mote, new THREE.MeshLambertMaterial({
      color: C.enemy.mote, emissive: 0x3a0d5c, emissiveIntensity: 0.55
    }), MAX_ENEMIES);
    dyn.enemyRunner = makeInstanced(runner, new THREE.MeshLambertMaterial({
      color: C.enemy.runner, emissive: 0x0c4a48, emissiveIntensity: 0.6
    }), MAX_ENEMIES);

    ENEMY_SHAPE.mote = 'enemyMote';
    ENEMY_SHAPE.runner = 'enemyRunner';

    var quad = new THREE.PlaneGeometry(1, 1);
    dyn.enemyGlint = makeInstanced(quad, additiveMaterial(rd.tex.glow, 0xffffff), MAX_ENEMIES, 3);
    /* White base materials so the per-instance colour is the only tint. */
    dyn.barBack = makeInstanced(quad, new THREE.MeshBasicMaterial({ color: 0xffffff }), MAX_BARS, 5);
    dyn.barFill = makeInstanced(quad, new THREE.MeshBasicMaterial({ color: 0xffffff }), MAX_BARS, 6);
    dyn.enemyObj = new THREE.Object3D();
  }

  Filler.prototype.pushBillboard = function (x, y, z, sx, sy, colorHex) {
    var mesh = this.mesh;
    if (this.n >= mesh.instanceMatrix.count) return;
    dummy.position.set(x, y, z);
    dummy.rotation.set(billboardX, 0, 0);
    dummy.scale.set(sx, sy, 1);
    dummy.updateMatrix();
    mesh.setMatrixAt(this.n, dummy.matrix);
    mesh.setColorAt(this.n, scratchColor.setHex(colorHex));
    this.n++;
  };

  function shapeKey(type) {
    return ENEMY_SHAPE[type] || 'enemyMote';
  }

  function drawEnemies(state) {
    var fills = {};
    var k;
    for (k in ENEMY_SHAPE) {
      if (!fills[ENEMY_SHAPE[k]]) fills[ENEMY_SHAPE[k]] = new Filler(dyn[ENEMY_SHAPE[k]]);
    }
    var glint = new Filler(dyn.enemyGlint);
    var back = new Filler(dyn.barBack);
    var fill = new Filler(dyn.barFill);
    var o = dyn.enemyObj;
    var list = state.enemies;

    for (var i = 0; i < list.length; i++) {
      var e = list[i];
      if (e.t < -1) continue;
      var fade = R.util.clamp(e.t + 1, 0, 1);
      /* Enemies grow out of the portal instead of sliding in half-clipped. */
      var rad = e.radius * (0.25 + 0.75 * fade);
      var y = rad + 0.06;
      var hit = state.time - e.hitAt;
      var flash = hit >= 0 && hit < 0.09 ? 1 : 0;
      var body = C.enemy[e.type] || C.enemy.mote;
      var tint = flash ? R.util.mixColor(0xffffff, 0xffffff, 1) : R.util.mixColor(0x000000, 0xffffff, 0.35 + 0.65 * fade);

      o.position.set(e.x, y, e.z);
      o.scale.set(rad, rad, rad);
      if (e.type === 'runner') {
        travelVec.set(e.dx, 0, e.dz);
        if (travelVec.lengthSq() < 1e-6) travelVec.set(0, 0, 1);
        travelVec.normalize();
        o.quaternion.setFromUnitVectors(UP_VEC, travelVec);
      } else {
        o.quaternion.set(0, 0, 0, 1);
        o.rotation.y = state.time * 0.8 + e.id;
      }
      fills[shapeKey(e.type)].pushObject(o, tint);

      var glintCol = C.enemyGlint[e.type] || C.enemyGlint.mote;
      glint.pushBillboard(e.x, y, e.z, rad * 2.3, rad * 2.3,
        R.util.mixColor(0x000000, flash ? 0xffffff : glintCol, (flash ? 0.85 : 0.4) * fade));

      if (e.hp < e.maxHp && e.t >= 0) {
        var w = Math.max(0.5, rad * 2.1);
        var by = y + rad + 0.22;
        var frac = R.util.clamp(e.hp / e.maxHp, 0, 1);
        back.pushBillboard(e.x, by, e.z, w + 0.07, 0.16, 0x141a2c);
        fill.pushBillboard(e.x - w * (1 - frac) / 2, by, e.z, w * frac, 0.09,
          frac > 0.5 ? 0x7ce0a8 : (frac > 0.25 ? 0xffc247 : 0xff5d6c));
      }
    }

    for (k in fills) fills[k].finish();
    glint.finish();
    back.finish();
    fill.finish();
  }

  rd.drawDynamic = function (state) {
    drawLitTiles(state);
    drawBeams(state);
    drawPieces(state);
    drawEnemies(state);
  };

  /* ---------- frame ---------- */

  rd.draw = function (state, dtReal) {
    if (!rd.ready) return;
    var t = state.time;

    if (rd.coreCrystal) {
      var lvl = state.coreLevel;
      var pulse = 0.85 + 0.15 * Math.sin(t * 2.4);
      rd.coreCrystal.rotation.y += dtReal * 0.6;
      rd.coreCrystal.material.emissiveIntensity = pulse * (0.7 + 0.16 * lvl);
      var s = 1 + 0.05 * lvl;
      rd.coreCrystal.scale.set(s, s, s);
      rd.coreHaze.material.opacity = 0.32 + 0.05 * lvl + 0.06 * Math.sin(t * 2.4);
    }
    if (rd.portalRing) {
      rd.portalRing.rotation.z -= dtReal * 0.5;
    }

    rd.drawDynamic(state, dtReal);

    renderer.render(scene, camera);
  };

  rd.info = function () {
    if (!renderer) return null;
    return {
      calls: renderer.info.render.calls,
      triangles: renderer.info.render.triangles,
      geometries: renderer.info.memory.geometries,
      textures: renderer.info.memory.textures,
      programs: renderer.info.programs ? renderer.info.programs.length : 0,
      objects: scene ? scene.children.length : 0
    };
  };
})(typeof window !== 'undefined' ? window : globalThis);
</script>

<script>
/*
   ==================================================================
   09_ui.js
   ==================================================================
*/
/*
 * The DOM layer: HUD numbers, the incoming strip, floating text over the board
 * and (from later phases) the palette, action bar and overlays. Everything here
 * reads state and reacts to the feedback events the simulation emits.
 */
(function (global) {
  'use strict';
  var R = global.R || (global.R = {});
  var B = R.BALANCE;

  var ui = {};
  R.ui = ui;

  var el = {};
  var cache = {};
  var floaters = [];
  var FLOATER_POOL = 28;

  function byId(id) {
    return document.getElementById(id);
  }

  function setText(node, value) {
    if (cache[node.__key] === value) return;
    cache[node.__key] = value;
    node.textContent = value;
  }

  function key(node, name) {
    node.__key = name;
    return node;
  }

  /* ---------- floating text ---------- */

  function makeFloater() {
    var node = document.createElement('div');
    node.className = 'floater';
    node.style.display = 'none';
    el.overlay.appendChild(node);
    return { node: node, life: 0, ttl: 0, x: 0, y: 0, vy: 0, active: false };
  }

  ui.floater = function (text, kind, x, y, opts) {
    var f = null;
    for (var i = 0; i < floaters.length; i++) {
      if (!floaters[i].active) { f = floaters[i]; break; }
    }
    if (!f) return null;
    f.active = true;
    f.life = 0;
    f.ttl = (opts && opts.ttl) || 0.9;
    f.x = x;
    f.y = y;
    f.vy = (opts && opts.vy) || -46;
    f.node.className = 'floater ' + (kind || 'info');
    f.node.textContent = text;
    f.node.style.display = 'block';
    f.node.style.left = x + 'px';
    f.node.style.top = y + 'px';
    f.node.style.opacity = '1';
    return f;
  };

  ui.floaterAtCell = function (text, kind, c, r, opts) {
    var p = R.render.projectCell(c, r, 0.4);
    if (!p) return null;
    return ui.floater(text, kind, p.x, p.y, opts);
  };

  ui.floaterAtWorld = function (text, kind, x, z, opts) {
    var p = R.render.project(x, 0.4, z);
    if (!p) return null;
    return ui.floater(text, kind, p.x, p.y, opts);
  };

  function stepFloaters(dt) {
    for (var i = 0; i < floaters.length; i++) {
      var f = floaters[i];
      if (!f.active) continue;
      f.life += dt;
      if (f.life >= f.ttl) {
        f.active = false;
        f.node.style.display = 'none';
        continue;
      }
      var t = f.life / f.ttl;
      f.node.style.top = (f.y + f.vy * t) + 'px';
      f.node.style.opacity = String(1 - t * t);
    }
  }

  ui.clearFloaters = function () {
    for (var i = 0; i < floaters.length; i++) {
      floaters[i].active = false;
      floaters[i].node.style.display = 'none';
    }
  };

  /* ---------- one-shot CSS animations ---------- */

  function pulse(node, cls) {
    if (!node) return;
    node.classList.remove(cls);
    /* Reading offsetWidth restarts the animation. */
    void node.offsetWidth;
    node.classList.add(cls);
  }

  ui.bumpGold = function () { pulse(el.statGold, 'bump'); };
  ui.shakeGold = function () { pulse(el.statGold, 'shake'); };
  ui.shakeHp = function () { pulse(el.statHp, 'shake'); };
  ui.pulseLit = function () { pulse(el.statLit, 'bump'); };

  /* ---------- incoming strip ---------- */

  var stripNotice = '';
  var stripNoticeUntil = 0;
  var realTime = 0;

  function pips(comp) {
    var html = '';
    for (var i = 0; i < comp.length; i++) {
      var g = comp[i];
      var big = g.type === 'bruteking' || g.type === 'umbra';
      html += '<span class="pip ' + g.type + (big ? ' big' : '') + '"></span>';
      html += '<span class="' + (big ? 'warn' : '') + '">' + g.count + '</span> ';
    }
    return html;
  }

  ui.notice = function (text, seconds) {
    stripNotice = text;
    stripNoticeUntil = realTime + (seconds || 2.4);
    el.strip.classList.remove('flash');
    void el.strip.offsetWidth;
    el.strip.classList.add('flash');
  };

  function stripHtml(s) {
    if (stripNotice && realTime < stripNoticeUntil) return '<span class="warn">' + stripNotice + '</span>';
    if (s.phase === 'wave') {
      return '<span class="em">WAVE ' + s.wave + '</span> &middot; ' +
        R.enemies.remaining(s) + ' left';
    }
    var next = s.wave + 1;
    return 'NEXT ' + pips(R.enemies.composition(next)) +
      '&middot; in <span class="em">' + Math.max(0, Math.ceil(s.countdown)) + 's</span>';
  }

  /* ---------- HUD ---------- */

  ui.update = function (s) {
    setText(el.hpVal, String(Math.max(0, s.coreHp)));
    setText(el.goldVal, String(Math.floor(s.gold)));
    setText(el.waveVal, s.endless ? String(s.wave) : String(s.wave));
    setText(el.waveSub, s.endless ? ' ENDLESS' : '/12');
    setText(el.litVal, String(s.beam.litRoadCount));
    setText(el.litSub, '/' + s.roadCells);

    var html = stripHtml(s);
    if (cache.strip !== html) {
      cache.strip = html;
      el.stripText.innerHTML = html;
    }
  };

  /* ---------- events ---------- */

  var goldFloaterAt = 0;

  ui.handleEvents = function (s) {
    for (var i = 0; i < s.events.length; i++) {
      var e = s.events[i];
      switch (e.type) {
        case 'denied':
          if (e.reason === 'gold') {
            ui.shakeGold();
            ui.floaterAtCell('Need ' + e.cost, 'dmg', e.c, e.r);
          } else if (e.reason === 'locked') {
            ui.floaterAtCell('Locked', 'info', e.c, e.r);
          }
          break;
        case 'place':
        case 'sell':
        case 'upgrade':
          ui.bumpGold();
          break;
        case 'kill':
          /* Stagger simultaneous kills so the numbers stay readable. */
          if (realTime - goldFloaterAt > 0.04) {
            goldFloaterAt = realTime;
            ui.floaterAtWorld('+' + e.gold, 'gold', e.x, e.z);
          }
          ui.bumpGold();
          break;
        case 'leak':
          ui.shakeHp();
          ui.floaterAtWorld('-' + e.leak, 'dmg', e.x, e.z, { ttl: 1.1 });
          break;
        case 'waveclear':
          ui.notice('WAVE ' + e.wave + ' CLEARED  +' + e.bonus, 2.2);
          ui.bumpGold();
          break;
        case 'wavestart':
          ui.notice('WAVE ' + e.wave, 1.4);
          break;
        case 'unlock':
          ui.notice(String(TYPE_LABEL_PIECE[e.type] || e.type).toUpperCase() + ' UNLOCKED', 3);
          break;
        default:
          break;
      }
    }
  };

  var TYPE_LABEL_PIECE = {
    mirror: 'Mirror', splitter: 'Splitter', reflector: 'Reflector', lamp: 'Lamp'
  };


  /* ---------- overlays ---------- */

  var overlayKind = null;

  function node(tag, cls, html) {
    var n = document.createElement(tag);
    if (cls) n.className = cls;
    if (html !== undefined) n.innerHTML = html;
    return n;
  }

  function button(cls, label, onClick) {
    var b = node('button', cls, label);
    b.type = 'button';
    b.addEventListener('click', function (ev) {
      ev.preventDefault();
      onClick();
    });
    return b;
  }

  function openOverlay(kind, build) {
    overlayKind = kind;
    el.overlayRoot.innerHTML = '';
    var wrap = node('div', 'overlay');
    build(wrap);
    el.overlayRoot.appendChild(wrap);
    el.overlayRoot.classList.add('on');
    return wrap;
  }

  function closeOverlay() {
    overlayKind = null;
    el.overlayRoot.innerHTML = '';
    el.overlayRoot.classList.remove('on');
  }

  function bestLine() {
    return R.meta.best > 0 ? '<p class="tag">BEST ' + R.meta.best + '</p>' : '';
  }

  function buildTitle(wrap) {
    wrap.appendChild(node('h1', null, 'REFRACT'));
    wrap.appendChild(node('p', 'tag', 'Bend the light. Burn the shadows.'));
    var rows = node('div', 'rows');
    rows.appendChild(node('div', 'row', '<b>&#9670;</b> Your core fires one beam of light. Shadows walking the road burn in it.'));
    rows.appendChild(node('div', 'row', '<b>&#9655;</b> Tap a tile to place a mirror and bend the beam along the road.'));
    rows.appendChild(node('div', 'row', '<b>&#8635;</b> Tap a placed piece to flip, move or sell it. Survive twelve waves.'));
    wrap.appendChild(rows);
    if (R.meta.best > 0) wrap.appendChild(node('p', 'tag', 'BEST ' + R.meta.best));
    wrap.appendChild(button('bigbtn', 'PLAY', function () { R.startRun(); }));
    wrap.appendChild(node('p', 'note', 'Portrait &middot; single player &middot; works offline'));
  }

  function buildPause(wrap) {
    wrap.appendChild(node('h2', null, 'PAUSED'));
    wrap.appendChild(node('p', 'tag', 'Tap anywhere to resume'));
    wrap.addEventListener('click', function () { R.resume(); });
  }

  /*
   * The tip names whatever took the most core HP, which is what the player
   * actually needs to solve, rather than the most numerous leaker.
   */
  var DEFEAT_TIPS = {
    brute: 'Brutes soak up most of the light, and everything walking behind one is shielded. Meet them head on, or split the beam so a second line reaches the rest.',
    bruteking: 'Brutes soak up most of the light, and everything walking behind one is shielded. Meet them head on, or split the beam so a second line reaches the rest.',
    umbra: 'Umbra absorbs almost everything. Upgrade the core and light the long segments so it is burning for as long as possible.',
    swarmling: 'Swarms drain a beam fast: each one takes a bite before the light reaches the next. Split the light, or add a Lamp as a second source.',
    runner: 'Runners cross a single lit cell in half a second. Light a whole road segment lengthwise so they stay in the light.',
    mote: 'Light along the road burns for the whole segment; light across it burns for one cell. Try to get LIT above 15.'
  };

  function defeatTip(s) {
    var worst = null;
    var worstHp = -1;
    for (var type in s.leaksBy) {
      var hp = s.leaksBy[type] * (B.ENEMY[type] ? B.ENEMY[type].leak : 1);
      if (hp > worstHp) { worstHp = hp; worst = type; }
    }
    if (!worst || worstHp <= 0) return DEFEAT_TIPS.mote;
    return DEFEAT_TIPS[worst] || DEFEAT_TIPS.mote;
  }

  function statLine(label, value) {
    return node('p', 'statline', label + ' <b>' + value + '</b>');
  }

  function buildDefeat(wrap) {
    var s = R.state;
    var h = node('h2', null, 'THE CORE FELL');
    h.style.color = '#ff5d6c';
    wrap.appendChild(h);
    wrap.appendChild(statLine('Reached wave', s.wave + ' of 12'));
    wrap.appendChild(statLine('Score', s.score));
    if (R.meta.best > 0) wrap.appendChild(node('p', 'tag', 'BEST ' + R.meta.best));
    wrap.appendChild(node('div', 'tip', defeatTip(s)));
    wrap.appendChild(button('bigbtn', 'TRY AGAIN', function () { R.restartRun(); }));
  }

  function buildVictory(wrap) {
    var s = R.state;
    var h = node('h2', null, 'THE LIGHT HELD');
    h.style.color = '#ffc247';
    wrap.appendChild(h);
    wrap.appendChild(statLine('Waves cleared', s.wavesCleared));
    wrap.appendChild(statLine('Core HP left', s.coreHp + ' of ' + B.CORE_HP));
    wrap.appendChild(statLine('Road lit', s.beam.litRoadCount + ' of ' + s.roadCells));
    wrap.appendChild(statLine('Score', s.score));
    if (R.meta.best > 0) wrap.appendChild(node('p', 'tag', 'BEST ' + R.meta.best));
    wrap.appendChild(button('bigbtn', 'PLAY AGAIN', function () { R.restartRun(); }));
    if (R.continueEndless) {
      wrap.appendChild(button('bigbtn ghost', 'CONTINUE &mdash; ENDLESS', function () { R.continueEndless(); }));
    }
  }

  /* Rebuild only when the phase changes, so overlays do not flicker. */
  ui.syncOverlay = function (s) {
    var want = null;
    if (s.phase === 'title') want = 'title';
    else if (s.phase === 'paused') want = 'pause';
    else if (s.phase === 'lost') want = 'lost';
    else if (s.phase === 'won') want = 'won';

    if (want === overlayKind) return;
    if (!want) {
      closeOverlay();
      return;
    }
    if (want === 'title') openOverlay('title', buildTitle);
    else if (want === 'pause') openOverlay('pause', buildPause);
    else if (want === 'lost') openOverlay('lost', buildDefeat);
    else if (want === 'won') openOverlay('won', buildVictory);
  };

  ui.overlayKind = function () {
    return overlayKind;
  };

  /* ---------- HUD buttons ---------- */

  function bindHudButtons() {
    el.btnPause.addEventListener('click', function () {
      var s = R.state;
      if (s.phase === 'paused') R.resume();
      else R.pause();
    });
    el.btnNext.addEventListener('click', function () {
      var s = R.state;
      if (s.phase === 'building') R.callWaveEarly(s);
    });
    el.btnSpeed.addEventListener('click', function () {
      var s = R.state;
      var opts = B.SPEED_OPTIONS;
      var i = opts.indexOf(s.speed);
      s.speed = opts[(i + 1) % opts.length];
    });
  }

  function syncHudButtons(s) {
    var speedLabel = s.speed + '×';
    if (cache.speed !== speedLabel) {
      cache.speed = speedLabel;
      el.btnSpeed.textContent = speedLabel;
      el.btnSpeed.classList.toggle('on', s.speed !== 1);
    }
    var paused = s.phase === 'paused';
    if (cache.paused !== paused) {
      cache.paused = paused;
      el.btnPause.classList.toggle('playing', paused);
    }
    var showNext = s.phase === 'building';
    if (cache.showNext !== showNext) {
      cache.showNext = showNext;
      el.btnNext.hidden = !showNext;
    }
  }

  /* ---------- lifecycle ---------- */

  ui.init = function () {
    el.overlay = byId('boardOverlay');
    el.statHp = byId('statHp');
    el.statGold = byId('statGold');
    el.statWave = byId('statWave');
    el.statLit = byId('statLit');
    el.hpVal = key(el.statHp.querySelector('.val'), 'hpVal');
    el.goldVal = key(el.statGold.querySelector('.val'), 'goldVal');
    el.waveVal = key(el.statWave.querySelector('.val'), 'waveVal');
    el.waveSub = key(el.statWave.querySelector('.sub'), 'waveSub');
    el.litVal = key(el.statLit.querySelector('.val'), 'litVal');
    el.litSub = key(el.statLit.querySelector('.sub'), 'litSub');
    el.strip = byId('strip');
    el.stripText = key(byId('stripText'), 'strip');
    el.overlayRoot = byId('overlayRoot');
    el.btnPause = byId('btnPause');
    el.btnSpeed = byId('btnSpeed');
    el.btnHelp = byId('btnHelp');
    el.btnMute = byId('btnMute');
    el.btnCore = byId('btnCore');
    el.btnNext = byId('btnNext');
    el.palette = byId('palette');
    /* The core upgrade arrives with the rest of the economy in a later phase. */
    el.btnCore.hidden = true;
    bindHudButtons();

    for (var i = 0; i < FLOATER_POOL; i++) floaters.push(makeFloater());
    ui.el = el;
  };

  ui.frame = function (s, dtReal) {
    realTime += dtReal;
    stepFloaters(dtReal);
    ui.handleEvents(s);
    ui.update(s);
    syncHudButtons(s);
    ui.syncOverlay(s);
  };

  ui.reset = function () {
    ui.clearFloaters();
    cache = {};
    stripNotice = '';
    stripNoticeUntil = 0;
    overlayKind = null;
    if (el.overlayRoot) closeOverlay();
  };
})(typeof window !== 'undefined' ? window : globalThis);
</script>

<script>
/*
   ==================================================================
   10_input.js
   ==================================================================
*/
/*
 * Input. Pointer Events only, one active pointer at a time. A press on the
 * board becomes a tap (place or select) or, once it moves far enough, a drag.
 */
(function (global) {
  'use strict';
  var R = global.R || (global.R = {});

  var input = {};
  R.input = input;

  var DRAG_THRESHOLD = 10;

  var active = null;

  function boardCell(ev) {
    return R.render.cellFromClient(ev.clientX, ev.clientY);
  }

  function boardAcceptsInput(s) {
    return s.phase === 'building' || s.phase === 'wave';
  }

  function onPointerDown(ev) {
    var s = R.state;
    if (!s || active) return;
    if (!boardAcceptsInput(s)) return;
    var cell = boardCell(ev);
    if (!cell) return;

    ev.preventDefault();
    active = {
      id: ev.pointerId,
      startX: ev.clientX,
      startY: ev.clientY,
      cell: cell,
      moved: false,
      piece: R.pieces.at(s, cell.c, cell.r)
    };
  }

  function onPointerMove(ev) {
    if (!active || ev.pointerId !== active.id) return;
    var dx = ev.clientX - active.startX;
    var dy = ev.clientY - active.startY;
    if (!active.moved && (dx * dx + dy * dy) > DRAG_THRESHOLD * DRAG_THRESHOLD) {
      active.moved = true;
    }
  }

  function onPointerUp(ev) {
    if (!active || ev.pointerId !== active.id) return;
    var s = R.state;
    var press = active;
    active = null;
    if (!s || !boardAcceptsInput(s)) return;

    if (press.moved) return;

    var cell = boardCell(ev) || press.cell;
    if (cell.i !== press.cell.i) return;

    if (press.piece) {
      R.pieces.flip(s, cell.c, cell.r);
    } else {
      R.pieces.place(s, s.ui.selectedType, cell.c, cell.r);
    }
  }

  function onPointerCancel(ev) {
    if (active && ev.pointerId === active.id) active = null;
  }

  input.init = function () {
    var board = document.getElementById('board');
    board.addEventListener('pointerdown', onPointerDown);
    global.addEventListener('pointermove', onPointerMove, { passive: true });
    global.addEventListener('pointerup', onPointerUp);
    global.addEventListener('pointercancel', onPointerCancel);

    /* Stop the browser turning taps into zoom, scroll or text selection. */
    document.addEventListener('gesturestart', function (ev) { ev.preventDefault(); });
    document.addEventListener('dblclick', function (ev) { ev.preventDefault(); });
    document.addEventListener('contextmenu', function (ev) { ev.preventDefault(); });
    document.addEventListener('touchmove', function (ev) {
      if (ev.cancelable) ev.preventDefault();
    }, { passive: false });
  };

  input.cancel = function () {
    active = null;
  };
})(typeof window !== 'undefined' ? window : globalThis);
</script>

<script>
/*
   ==================================================================
   11_game.js
   ==================================================================
*/
/*
 * Boot and the main loop. Simulation runs on a fixed timestep so behaviour is
 * identical on any display refresh rate; rendering happens once per frame and
 * only reads state.
 */
(function (global) {
  'use strict';
  var R = global.R || (global.R = {});
  var T = R.TIMING;

  R.state = null;
  R.running = false;

  var accumulator = 0;
  var lastFrame = 0;
  var loopStarted = false;

  /* ---------- fatal errors ---------- */

  R.fatal = function (message) {
    var el = document.getElementById('fatal');
    if (el) {
      el.textContent = message;
      el.hidden = false;
    }
  };

  /* ---------- tab icon (drawn at runtime; no image files) ---------- */

  function installFavicon() {
    var cv = document.createElement('canvas');
    cv.width = 64;
    cv.height = 64;
    var g = cv.getContext('2d');
    g.fillStyle = '#0b0f1e';
    g.fillRect(0, 0, 64, 64);
    g.strokeStyle = '#ffc247';
    g.lineWidth = 7;
    g.lineCap = 'round';
    g.beginPath();
    g.moveTo(8, 54);
    g.lineTo(38, 54);
    g.lineTo(56, 12);
    g.stroke();
    g.strokeStyle = '#cfe3ff';
    g.lineWidth = 6;
    g.beginPath();
    g.moveTo(30, 62);
    g.lineTo(48, 44);
    g.stroke();
    var link = document.createElement('link');
    link.rel = 'icon';
    link.type = 'image/png';
    link.href = cv.toDataURL('image/png');
    document.head.appendChild(link);
  }

  /* ---------- layout ---------- */

  var layoutQueued = false;

  R.layout = function () {
    R.render.applyLayout();
  };

  function queueLayout() {
    if (layoutQueued) return;
    layoutQueued = true;
    global.requestAnimationFrame(function () {
      layoutQueued = false;
      R.layout();
    });
  }

  /* ---------- run lifecycle ---------- */

  R.newRun = function (seed) {
    if (R.state) R.enemies.releaseAll(R.state);
    var s = R.resetState(seed === undefined ? (Date.now() & 0x7fffffff) : seed);
    R.state = s;
    R.beam.recompute(s);
    if (R.ui.reset) R.ui.reset();
    if (R.input.cancel) R.input.cancel();
    accumulator = 0;
    return s;
  };

  /* A fresh run that opens on the title card. */
  R.titleRun = function (seed) {
    var s = R.newRun(seed);
    s.phase = 'title';
    return s;
  };

  /* Leave the title card and start playing. */
  R.startRun = function () {
    var s = R.state;
    if (s.phase !== 'title') return;
    s.phase = 'building';
    s.countdown = R.BALANCE.FIRST_COUNTDOWN;
    R.emit(s, 'runstart', {});
  };

  /* Straight back to the board: the title card is only shown on first load. */
  R.restartRun = function (seed) {
    var s = R.newRun(seed);
    s.phase = 'building';
    s.countdown = R.BALANCE.FIRST_COUNTDOWN;
    R.emit(s, 'runstart', {});
    return s;
  };

  R.endRun = function (s, won) {
    s.score = R.computeScore(s);
    s.phase = won ? 'won' : 'lost';
    R.saveBest(s.score);
    R.emit(s, won ? 'win' : 'lose', { score: s.score, wave: s.wave });
  };

  /* ---------- wave flow ---------- */

  R.applyUnlocks = function (s, upcomingWave) {
    var table = R.BALANCE.UNLOCK_WAVE;
    for (var type in table) {
      if (!s.unlocked[type] && upcomingWave >= table[type]) {
        s.unlocked[type] = true;
        R.emit(s, 'unlock', { type: type });
      }
    }
  };

  R.startWave = function (s) {
    s.wave++;
    s.spawnQueue = R.enemies.buildQueue(s.wave);
    s.spawnCursor = 0;
    s.waveEnemiesTotal = s.spawnQueue.length;
    s.waveTime = 0;
    s.countdown = 0;
    s.phase = 'wave';
    R.emit(s, 'wavestart', { wave: s.wave, count: s.waveEnemiesTotal });
  };

  /* Starting a wave early trades building time for gold (bonus added later). */
  R.callWaveEarly = function (s) {
    if (s.phase !== 'building') return;
    R.startWave(s);
  };

  R.finishWave = function (s) {
    var bonus = R.BALANCE.WAVE_CLEAR_BASE + R.BALANCE.WAVE_CLEAR_PER_WAVE * s.wave;
    s.wavesCleared++;
    s.gold += bonus;
    s.goldEarned += bonus;
    R.emit(s, 'waveclear', { wave: s.wave, bonus: bonus });
    if (!s.endless && s.wave >= R.BALANCE.WAVES.length) {
      R.endRun(s, true);
      return;
    }
    s.phase = 'building';
    s.countdown = R.BALANCE.COUNTDOWN;
    R.applyUnlocks(s, s.wave + 1);
  };

  /* ---------- simulation ---------- */

  /*
   * One fixed step, in the order the systems depend on each other:
   * countdown, spawning, movement, light and damage, deaths and leaks,
   * then the phase transitions those results imply.
   */
  R.simStep = function (s, dt) {
    s.time += dt;

    if (s.phase === 'building') {
      s.countdown -= dt;
      if (s.countdown <= 0) R.startWave(s);
    }

    if (s.phase === 'wave') {
      s.waveTime += dt;
      R.enemies.spawnStep(s, dt);
    }

    R.enemies.moveStep(s, dt);
    R.beam.solve(s, R.enemies.occupancy(s), dt, s.beam);
    R.enemies.resolveStep(s);

    if (s.coreHp <= 0 && s.phase !== 'lost') {
      s.coreHp = 0;
      R.endRun(s, false);
      return;
    }

    if (s.phase === 'wave' && R.enemies.waveComplete(s)) R.finishWave(s);
  };

  /* ---------- main loop ---------- */

  function frame(now) {
    global.requestAnimationFrame(frame);
    var s = R.state;
    if (!s) return;

    var dtReal = (now - lastFrame) / 1000;
    lastFrame = now;
    if (!(dtReal > 0)) dtReal = 0;
    if (dtReal > T.MAX_FRAME_DT) dtReal = T.MAX_FRAME_DT;

    if (R.isSimulating(s)) {
      accumulator += dtReal;
      var steps = 0;
      while (accumulator >= T.FIXED_STEP && steps < T.MAX_STEPS_PER_FRAME) {
        for (var k = 0; k < s.speed; k++) R.simStep(s, T.FIXED_STEP);
        accumulator -= T.FIXED_STEP;
        steps++;
      }
      if (accumulator > T.FIXED_STEP * T.MAX_STEPS_PER_FRAME) accumulator = 0;
    } else {
      accumulator = 0;
    }

    R.ui.frame(s, dtReal);
    R.render.draw(s, dtReal);
    if (R.debug) R.debug.frame(dtReal);
    s.events.length = 0;
  }

  R.isSimulating = function (s) {
    return s.phase === 'building' || s.phase === 'wave';
  };

  /* ---------- pause on tab hide ---------- */

  function onVisibility() {
    var s = R.state;
    if (!s) return;
    if (document.hidden && R.isSimulating(s)) {
      R.pause();
    }
    accumulator = 0;
  }

  R.pause = function () {
    var s = R.state;
    if (!s || !R.isSimulating(s)) return;
    s.pausedFrom = s.phase;
    s.phase = 'paused';
  };

  R.resume = function () {
    var s = R.state;
    if (!s || s.phase !== 'paused') return;
    s.phase = s.pausedFrom || 'building';
    s.pausedFrom = null;
    accumulator = 0;
  };

  /* ---------- boot ---------- */

  R.boot = function () {
    if (!global.THREE) {
      R.fatal('This build needs the Three.js file in vendor/ to run.');
      return;
    }

    R.loadMeta();
    var s = R.titleRun();

    R.ui.init();
    R.render.applyLayout();
    if (!R.render.init(s)) {
      R.fatal('This device cannot run WebGL.');
      return;
    }
    R.render.applyLayout();
    R.input.init();
    if (R.debug) R.debug.install();

    installFavicon();

    /* A page opened in a background tab starts paused rather than silently idle. */
    if (document.hidden) onVisibility();

    global.addEventListener('resize', queueLayout, { passive: true });
    global.addEventListener('orientationchange', queueLayout, { passive: true });
    document.addEventListener('visibilitychange', onVisibility);

    if (!loopStarted) {
      loopStarted = true;
      lastFrame = global.performance ? global.performance.now() : Date.now();
      global.requestAnimationFrame(frame);
    }
    R.running = true;
  };

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', function () { R.boot(); });
  } else {
    R.boot();
  }
})(typeof window !== 'undefined' ? window : globalThis);
</script>

<script>
/*
   ==================================================================
   99_debug.js
   ==================================================================
*/
/*
 * Development tools. This file is excluded from the release build; nothing
 * else in the game references it. It is only activated when the page URL
 * contains debug=1.
 */
(function (global) {
  'use strict';
  var R = global.R || (global.R = {});

  /* debug=1 installs the automation API; debug=2 also shows the panel. */
  function debugLevel() {
    try {
      var m = /(?:^|[?&])debug=(\d)(?:&|$)/.exec(global.location.search.slice(1));
      return m ? Number(m[1]) : 0;
    } catch (err) {
      return 0;
    }
  }

  var level = debugLevel();
  if (!level) return;

  var panel = null;
  var readout = null;
  var frames = 0;
  var fpsAcc = 0;
  var fps = 0;

  function api() {
    return {
      get state() { return R.state; },

      place: function (type, c, r, orient) {
        var p = R.pieces.place(R.state, type, c, r, orient);
        return p ? p.id : null;
      },

      flip: function (c, r) {
        return R.pieces.flip(R.state, c, r);
      },

      setGold: function (n) {
        R.state.gold = n;
        return n;
      },

      setSpeed: function (n) {
        R.state.speed = n;
        return n;
      },

      restart: function (seed) {
        R.newRun(seed);
        return R.state.rngSeed;
      },

      /* Speed 0 stops the frame loop from stepping, so step() owns the clock. */
      freeze: function (on) {
        R.state.speed = on === false ? 1 : 0;
        return R.state.speed;
      },

      step: function (seconds) {
        var s = R.state;
        var dt = R.TIMING.FIXED_STEP;
        var n = Math.round(seconds / dt);
        for (var i = 0; i < n; i++) {
          R.simStep(s, dt);
          s.events.length = 0;
        }
        return s.time;
      },

      /* Advance until a predicate holds or the budget runs out. */
      stepUntil: function (source, maxSeconds) {
        var s = R.state;
        var dt = R.TIMING.FIXED_STEP;
        var done = new Function('s', 'R', 'return (' + source + ');');
        var n = Math.round((maxSeconds || 120) / dt);
        for (var i = 0; i < n; i++) {
          if (done(s, R)) return s.time;
          R.simStep(s, dt);
          s.events.length = 0;
        }
        return s.time;
      },

      forceWin: function () {
        var s = R.state;
        s.wave = R.BALANCE.WAVES.length;
        s.wavesCleared = s.wave;
        R.endRun(s, true);
        return s.phase;
      },

      forceLose: function () {
        var s = R.state;
        s.coreHp = 0;
        R.endRun(s, false);
        return s.phase;
      },

      killAll: function () {
        var s = R.state;
        for (var i = 0; i < s.enemies.length; i++) s.enemies[i].hp = 0;
        R.enemies.resolveStep(s);
        return s.enemies.length;
      },

      spawn: function (type, n) {
        var s = R.state;
        for (var i = 0; i < (n || 1); i++) R.enemies.spawn(s, type);
        return s.enemies.length;
      },

      nextWave: function () {
        if (R.state.phase === 'building') R.startWave(R.state);
        return R.state.wave;
      },

      snapshot: function () {
        var s = R.state;
        var pieces = [];
        var it = s.pieces.values();
        var e = it.next();
        while (!e.done) {
          pieces.push({ type: e.value.type, c: e.value.c, r: e.value.r, orient: e.value.orient, dir: e.value.dir });
          e = it.next();
        }
        pieces.sort(function (a, b) { return (a.r * 8 + a.c) - (b.r * 8 + b.c); });
        return {
          phase: s.phase,
          wave: s.wave,
          wavesCleared: s.wavesCleared,
          endless: s.endless,
          countdown: Math.round(s.countdown * 100) / 100,
          time: Math.round(s.time * 100) / 100,
          gold: s.gold,
          goldEarned: s.goldEarned,
          coreHp: s.coreHp,
          coreLevel: s.coreLevel,
          score: R.computeScore(s),
          lit: s.beam.litRoadCount,
          segments: s.beam.segCount,
          totalPower: Math.round(s.beam.totalPower * 100) / 100,
          pieces: pieces,
          enemies: s.enemies.length,
          unlocked: JSON.parse(JSON.stringify(s.unlocked)),
          leaksBy: JSON.parse(JSON.stringify(s.leaksBy)),
          render: R.render.info()
        };
      }
    };
  }

  function buildPanel() {
    panel = document.createElement('div');
    panel.id = 'debugPanel';
    panel.style.cssText = [
      'position:absolute', 'left:2px', 'bottom:2px', 'z-index:40',
      'font:10px/1.35 monospace', 'color:#9fe', 'background:rgba(0,0,0,0.62)',
      'padding:4px 6px', 'border-radius:4px', 'pointer-events:none',
      'white-space:pre'
    ].join(';');
    readout = document.createElement('div');
    panel.appendChild(readout);
    document.getElementById('app').appendChild(panel);
  }

  function update(dtReal) {
    if (!readout) return;
    frames++;
    fpsAcc += dtReal;
    if (fpsAcc >= 0.5) {
      fps = Math.round(frames / fpsAcc);
      frames = 0;
      fpsAcc = 0;
    }
    var s = R.state;
    var info = R.render.info() || { calls: 0 };
    readout.textContent =
      'fps ' + fps + '  t ' + s.time.toFixed(1) + '  ' + s.phase +
      '\nwave ' + s.wave + '  foes ' + s.enemies.length + '  seg ' + s.beam.segCount +
      '\nlit ' + s.beam.litRoadCount + '  calls ' + info.calls + '  seed ' + s.rngSeed;
  }

  R.debug = {
    install: function () {
      global.__REFRACT = api();
      if (level >= 2) buildPanel();
    },
    frame: update
  };
})(typeof window !== 'undefined' ? window : globalThis);
</script>
</body>
