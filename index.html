<style>
/*
 * Portrait layout, HUD chrome and overlays. The board itself is WebGL; every
 * piece of text on screen is DOM so it stays crisp and readable.
 */

:root {
  --bg: #0b0f1e;
  --panel: #121a30;
  --panel-2: #182240;
  --line: #26325a;
  --ink: #e8eeff;
  --ink-dim: #93a2c8;
  --gold: #ffc247;
  --hp: #ff5d6c;
  --lit: #7ce0a8;
  --accent: #59e8ff;
  --hud-h: 56px;
  --strip-h: 32px;
  --action-h: 56px;
  --palette-h: 96px;
  --pad: 8px;
  --radius: 10px;
}

* { box-sizing: border-box; }

html, body {
  margin: 0;
  padding: 0;
  height: 100%;
  overflow: hidden;
  overscroll-behavior: none;
  background: var(--bg);
  color: var(--ink);
  font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  -webkit-user-select: none;
  user-select: none;
  -webkit-tap-highlight-color: transparent;
  -webkit-text-size-adjust: 100%;
}

body { position: fixed; inset: 0; }

#stage {
  position: absolute;
  inset: 0;
  display: flex;
  align-items: stretch;
  justify-content: center;
  background: #05070f;
}

#app {
  position: relative;
  width: 100%;
  height: 100%;
  display: flex;
  flex-direction: column;
  background: var(--bg);
  touch-action: none;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
  overflow: hidden;
}

#sideNote {
  position: absolute;
  left: 12px;
  bottom: 12px;
  font-size: 12px;
  letter-spacing: 0.08em;
  color: #45507a;
  display: none;
  z-index: 1;
}

body.wide #sideNote { display: block; }

/* ---------- HUD ---------- */

#hud {
  flex: 0 0 auto;
  height: var(--hud-h);
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 0 var(--pad);
  border-bottom: 1px solid var(--line);
  background: linear-gradient(180deg, #131c33 0%, #0d1426 100%);
}

#stats {
  flex: 1 1 auto;
  min-width: 0;
  display: grid;
  grid-template-columns: 1fr 1fr;
  grid-template-rows: 22px 22px;
  align-content: center;
  column-gap: 6px;
}

.stat {
  display: flex;
  align-items: baseline;
  gap: 3px;
  font-size: 15px;
  line-height: 22px;
  white-space: nowrap;
  overflow: hidden;
}

.stat .ico { font-size: 13px; }
.stat .ico.hp { color: var(--hp); }
.stat .ico.gold { color: var(--gold); }
.stat .lbl { font-size: 10px; letter-spacing: 0.1em; color: var(--ink-dim); }
.stat .val { font-weight: 700; font-variant-numeric: tabular-nums; }
.stat .sub { font-size: 11px; color: var(--ink-dim); }
#statLight .val { color: var(--lit); }
#statGold .val { color: var(--gold); }

.stat.bump .val { animation: bump 260ms ease-out; }
.stat.shake { animation: shake 260ms ease-out; }

@keyframes bump {
  0% { transform: scale(1); }
  40% { transform: scale(1.35); }
  100% { transform: scale(1); }
}

@keyframes shake {
  0%, 100% { transform: translateX(0); }
  25% { transform: translateX(-4px); }
  75% { transform: translateX(4px); }
}

#hudButtons {
  flex: 0 0 auto;
  display: flex;
  gap: 4px;
}

.iconbtn {
  width: 46px;
  height: 46px;
  border-radius: var(--radius);
  border: 1px solid var(--line);
  background: var(--panel-2);
  color: var(--ink);
  font: 600 15px/1 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 0;
  touch-action: none;
}

.iconbtn:active, .iconbtn.on { background: #2a3765; border-color: var(--accent); }

.glyph-pause {
  width: 14px;
  height: 14px;
  display: block;
  border-left: 4px solid currentColor;
  border-right: 4px solid currentColor;
}

.iconbtn.playing .glyph-pause {
  border: 0;
  width: 0;
  height: 0;
  border-left: 12px solid currentColor;
  border-top: 7px solid transparent;
  border-bottom: 7px solid transparent;
}

.glyph-sound { font-style: normal; position: relative; font-size: 18px; }

.iconbtn.muted { color: var(--ink-dim); }

.iconbtn.muted .glyph-sound::after {
  content: "";
  position: absolute;
  left: -5px;
  top: 50%;
  width: 20px;
  height: 2px;
  background: var(--hp);
  transform: rotate(-40deg);
}

/* ---------- incoming strip ---------- */

#strip {
  flex: 0 0 auto;
  height: var(--strip-h);
  display: flex;
  align-items: center;
  gap: 6px;
  padding: 0 var(--pad);
  font-size: 12px;
  letter-spacing: 0.06em;
  color: var(--ink-dim);
  border-bottom: 1px solid #1a2340;
  overflow: hidden;
  white-space: nowrap;
}

#strip .em { color: var(--ink); font-weight: 700; }
#strip .warn { color: var(--gold); font-weight: 700; }
#strip.flash { animation: stripflash 900ms ease-out; }

@keyframes stripflash {
  0% { background: #2b3a17; color: #d9ff9a; }
  100% { background: transparent; }
}

/* enemy pips drawn in the incoming strip */
.pip {
  display: inline-block;
  width: 12px;
  height: 12px;
  border-radius: 50%;
  vertical-align: -2px;
  margin-right: 2px;
  border: 1px solid rgba(255, 255, 255, 0.25);
}

.pip.big { width: 17px; height: 17px; vertical-align: -4px; }
.pip.mote { background: #6b2fa8; }
.pip.runner { background: #1f8a86; border-radius: 2px; }
.pip.swarmling { width: 8px; height: 8px; background: #b23a80; vertical-align: 0; }
.pip.brute { background: #4a4270; border-radius: 3px; }
.pip.bruteking { background: #7a5a20; border-radius: 3px; }
.pip.umbra { background: #5a2a9a; }

/* ---------- board ---------- */

#boardWrap {
  flex: 1 1 auto;
  min-height: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  position: relative;
}

#board { position: relative; }

#gl { display: block; width: 100%; height: 100%; }

#boardOverlay {
  position: absolute;
  inset: 0;
  pointer-events: none;
}

/* ---------- action row ---------- */

#actionRow {
  flex: 0 0 auto;
  height: var(--action-h);
  display: flex;
  gap: 8px;
  padding: 6px var(--pad);
  border-top: 1px solid var(--line);
}

.actbtn {
  flex: 1 1 0;
  min-width: 0;
  border-radius: var(--radius);
  border: 1px solid var(--line);
  background: var(--panel-2);
  color: var(--ink);
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 1px;
  padding: 0 6px;
  font-family: inherit;
  touch-action: none;
}

.actbtn .a1 { font-size: 13px; font-weight: 700; letter-spacing: 0.04em; }
.actbtn .a2 { font-size: 11px; color: var(--ink-dim); }
.actbtn.primary { background: #1d3350; border-color: #2f5f86; }
.actbtn.primary .a2 { color: var(--gold); }
.actbtn:active { filter: brightness(1.35); }
.actbtn.dim { opacity: 0.42; }
.actbtn[hidden] { display: none; }

/* ---------- palette ---------- */

#palette {
  flex: 0 0 auto;
  height: var(--palette-h);
  display: flex;
  gap: 6px;
  padding: 6px var(--pad) 8px;
  border-top: 1px solid var(--line);
  background: linear-gradient(180deg, #0d1426 0%, #101830 100%);
}

.pbtn {
  flex: 1 1 0;
  min-width: 0;
  position: relative;
  border-radius: var(--radius);
  border: 1px solid var(--line);
  background: var(--panel);

  display: flex;
  flex-direction: column;

.pbtn .pname { font-size: 10px; letter-spacing: 0.06em; color: var(--ink-dim); }

@keyframes unlockflash {
  0% { background: #f5f0d0; border-color: #fff; }
  100% { background: var(--panel); }
}

.picon { width: 30px; height: 30px; position: relative; flex: 0 0 auto; }

.picon.mirror::before {

  position: absolute;
  left: 2px;
  top: 13px;
  width: 26px;
  height: 5px;

  position: absolute;

  width: 24px;
  height: 3px;
  background: #dcc7ff;
  transform: rotate(-45deg);

  border-radius: 50%;
  background: #ffb03a;

}

.picon.lamp::after {
  content: "";
  position: absolute;
  left: 13px;
  top: 1px;
  width: 4px;
  height: 7px;
  background: #ffd98a;
  border-radius: 2px;
}

.plock {
  position: absolute;
  inset: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 11px;
  font-weight: 700;

}

/* ---------- board overlay widgets ---------- */

.floater {

  font-size: 15px;

/* The walkthrough bar: one line, and a way out of it. */
.tutor {

  left: 50%;

  align-items: center;

  padding: 9px 10px 9px 13px;

  background: rgba(10, 16, 32, 0.96);

  box-shadow: 0 6px 20px rgba(0, 0, 0, 0.45);
}

.tutor .tutortext {

}

  padding: 0 10px;
  border-radius: 8px;
  border: 1px solid var(--line);
  background: transparent;
  color: var(--ink-dim);

  font-size: 10px;
  letter-spacing: 0.08em;
  cursor: pointer;
}

.tutor .tutorskip:active { color: var(--ink); border-color: var(--accent); }

  border-color: var(--gold);

}

}

.hint.raised { bottom: 60px; }

.hint {
  position: absolute;
  left: 50%;
  bottom: 8px;
  transform: translateX(-50%);
  max-width: 92%;
  padding: 8px 12px;
  border-radius: 8px;
  background: rgba(10, 16, 32, 0.92);
  border: 1px solid var(--line);
  font-size: 13px;
  line-height: 1.35;
  text-align: center;
  pointer-events: none;
}

#actionBar {
  position: absolute;
  display: flex;
  gap: 4px;
  transform: translate(-50%, 0);
  pointer-events: auto;
  z-index: 4;
}

#actionBar button {
  min-width: 54px;
  height: 44px;
  border-radius: 8px;
  border: 1px solid var(--accent);
  background: rgba(14, 22, 44, 0.96);
  color: var(--ink);
  font: 700 12px/1 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  letter-spacing: 0.06em;
  touch-action: none;
}

#actionBar button:active { background: #2a3765; }

#undoChip {
  position: absolute;
  left: 50%;
  bottom: 8px;
  transform: translateX(-50%);
  height: 44px;
  padding: 0 20px;
  border-radius: 22px;
  border: 1px solid var(--accent);
  background: rgba(14, 22, 44, 0.96);
  color: var(--ink);
  font: 700 13px/42px system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  letter-spacing: 0.08em;
  pointer-events: auto;
  z-index: 4;
  touch-action: none;
}

#dragGhost {
  position: absolute;
  pointer-events: none;
  transform: translate(-50%, -50%);
  z-index: 5;
}

#vignette {
  position: absolute;
  inset: 0;
  pointer-events: none;
  opacity: 0;
  z-index: 6;
  box-shadow: inset 0 0 70px 14px rgba(255, 60, 84, 0.55);

}

  display: none;

}

.overlay {

  inset: 0;
  background: rgba(5, 8, 18, 0.93);

  flex-direction: column;
  align-items: center;

}

.bigbtn {

  color: var(--ink-dim);
  text-align: center;
}

/*
   ==================================================================
   01_util.js
   ==================================================================
*/
/*
 * Utilities: deterministic random numbers, small math helpers, easing curves,
 * a fixed-capacity object pool and guarded local storage access.
 */
(function (global) {
  'use strict';
  var R = global.R || (global.R = {});

  R.util = {};

  /* mulberry32: small, fast, seedable generator. Returns a function in [0,1). */
  R.util.makeRng = function (seed) {
    var a = seed >>> 0;
    return function () {
      a = (a + 0x6D2B79F5) >>> 0;
      var t = a;
      t = Math.imul(t ^ (t >>> 15), t | 1);
      t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  };

  R.util.clamp = function (v, lo, hi) {
    return v < lo ? lo : (v > hi ? hi : v);
  };

  R.util.lerp = function (a, b, t) {
    return a + (b - a) * t;
  };

  R.util.invLerp = function (a, b, v) {
    return a === b ? 0 : (v - a) / (b - a);
  };

  R.util.easeOutCubic = function (t) {
    var u = 1 - t;
    return 1 - u * u * u;
  };

  R.util.easeInCubic = function (t) {
    return t * t * t;
  };

  R.util.easeOutBack = function (t) {
    var c1 = 1.70158;
    var c3 = c1 + 1;
    var u = t - 1;
    return 1 + c3 * u * u * u + c1 * u * u;
  };

  /* Blend two 0xRRGGBB integers. */
  R.util.mixColor = function (a, b, t) {
    var ar = (a >> 16) & 255, ag = (a >> 8) & 255, ab = a & 255;
    var br = (b >> 16) & 255, bg = (b >> 8) & 255, bb = b & 255;
    var r = Math.round(ar + (br - ar) * t);
    var g = Math.round(ag + (bg - ag) * t);
    var bl = Math.round(ab + (bb - ab) * t);
    return (r << 16) | (g << 8) | bl;
  };

  /*
   * Fixed-capacity pool. create() builds one item up front; the pool never
   * grows past capacity, which keeps mesh counts stable across restarts.
   */
  R.util.Pool = function (capacity, create, reset) {
    this.items = new Array(capacity);
    this.capacity = capacity;
    this.active = 0;
    this.reset = reset || null;
    for (var i = 0; i < capacity; i++) this.items[i] = create(i);
  };

  R.util.Pool.prototype.acquire = function () {
    if (this.active >= this.capacity) return null;
    return this.items[this.active++];
  };

  R.util.Pool.prototype.releaseAll = function () {
    if (this.reset) {
      for (var i = 0; i < this.active; i++) this.reset(this.items[i]);
    }
    this.active = 0;
  };

  R.util.Pool.prototype.forEachActive = function (fn) {
    for (var i = 0; i < this.active; i++) fn(this.items[i], i);
  };

  R.util.storeGet = function (key) {
    try {
      return global.localStorage ? global.localStorage.getItem(key) : null;
    } catch (err) {
      return null;
    }
  };

  R.util.storeSet = function (key, value) {
    try {
      if (global.localStorage) global.localStorage.setItem(key, value);
      return true;
    } catch (err) {
      return false;
    }
  };

  /* "1.5" -> "1.5", "12" -> "12": short numbers for the HUD. */
  R.util.fmt = function (n) {
    return (Math.round(n * 10) / 10).toString();
  };
})(typeof window !== 'undefined' ? window : globalThis);

<script>
/*

   02_audio.js
   ==================================================================
*/
/*
 * Audio. Everything is synthesised with the Web Audio API at run time; there
 * are no sound files. The context is created on the first user gesture, and
 * the whole module fails silently if audio is unavailable or blocked.
 */
(function (global) {
  'use strict';
  var R = global.R || (global.R = {});

  var audio = {};
  R.audio = audio;

  var ctx = null;
  var master = null;
  var noiseBuffer = null;
  var blocked = false;

  var hum = null;
  var humGain = null;

  var voices = [];
  var MAX_VOICES = 8;

  var lastAt = {};
  var rng = null;

  var MASTER_GAIN = 0.5;
  var HUM_MAX = 0.08;
  var HUM_FULL_POWER = 260;

  /* ---------- lifecycle ---------- */

  function makeNoiseBuffer() {
    var len = Math.floor(ctx.sampleRate * 0.5);
    var buf = ctx.createBuffer(1, len, ctx.sampleRate);
    var data = buf.getChannelData(0);
    for (var i = 0; i < len; i++) data[i] = Math.random() * 2 - 1;
    return buf;
  }

  function buildHum() {
    humGain = ctx.createGain();
    humGain.gain.value = 0;
    var filter = ctx.createBiquadFilter();
    filter.type = 'lowpass';
    filter.frequency.value = 320;
    humGain.connect(filter);
    filter.connect(master);

    hum = [];
    [[55, 0], [110, 4], [55.6, -3]].forEach(function (spec) {
      var osc = ctx.createOscillator();
      osc.type = 'sawtooth';
      osc.frequency.value = spec[0];
      osc.detune.value = spec[1];
      var g = ctx.createGain();
      g.gain.value = spec[0] > 100 ? 0.35 : 0.6;
      osc.connect(g);
      g.connect(humGain);
      osc.start();
      hum.push(osc);
    });
  }

  /* Called on every user gesture; creates the context the first time. */
  audio.ensure = function () {
    if (blocked) return false;
    try {
      if (!ctx) {
        var Ctor = global.AudioContext || global.webkitAudioContext;
        if (!Ctor) {
          blocked = true;
          return false;
        }
        ctx = new Ctor();
        master = ctx.createGain();
        master.gain.value = R.meta.muted ? 0 : MASTER_GAIN;
        master.connect(ctx.destination);
        noiseBuffer = makeNoiseBuffer();
        rng = R.util.makeRng(0x9e3779b9);
        buildHum();
      }
      if (ctx.state === 'suspended' && ctx.resume) ctx.resume();
      return true;
    } catch (err) {
      blocked = true;
      ctx = null;
      return false;
    }
  };

  audio.available = function () {
    return !!ctx && !blocked;
  };

  audio.state = function () {
    return ctx ? ctx.state : 'none';
  };

  audio.setMuted = function (muted) {
    R.meta.muted = !!muted;
    R.util.storeSet(R.STORAGE.MUTED, muted ? '1' : '0');
    if (master) {
      try {
        master.gain.setTargetAtTime(muted ? 0 : MASTER_GAIN, ctx.currentTime, 0.02);
      } catch (err) {
        master.gain.value = muted ? 0 : MASTER_GAIN;
      }

    return R.meta.muted;
  };

  audio.toggleMute = function () {
    return audio.setMuted(!R.meta.muted);
  };

  /* ---------- voice management ---------- */

  function reap(now) {
    for (var i = voices.length - 1; i >= 0; i--) {
      if (voices[i].until <= now) voices.splice(i, 1);
    }
  }

  /* Returns a gain node to hang a voice on, or null when the cap is reached. */
  function claim(peak, duration) {
    var now = ctx.currentTime;
    reap(now);
    if (voices.length >= MAX_VOICES) {
      var quietest = 0;
      for (var i = 1; i < voices.length; i++) {
        if (voices[i].peak < voices[quietest].peak) quietest = i;
      }
      if (voices[quietest].peak >= peak) return null;
      try {
        voices[quietest].gain.gain.cancelScheduledValues(now);
        voices[quietest].gain.gain.setTargetAtTime(0, now, 0.01);
      } catch (err) {
        /* the node may already have finished */
      }
      voices.splice(quietest, 1);
    }
    var g = ctx.createGain();
    g.gain.value = 0;
    g.connect(master);
    voices.push({ gain: g, peak: peak, until: now + duration + 0.05 });
    return g;
  }

  audio.voiceCount = function () {
    if (!ctx) return 0;
    reap(ctx.currentTime);
    return voices.length;
  };

  function vary(amount) {

  }

    var f1 = (opts.to === undefined ? opts.from : opts.to) * (opts.steady ? 1 : vary(opts.varyAmount));
    osc.frequency.setValueAtTime(f0, t0);
    if (f1 !== f0) osc.frequency.exponentialRampToValueAtTime(Math.max(20, f1), t0 + dur);
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.exponentialRampToValueAtTime(Math.max(0.0002, peak), t0 + Math.min(0.02, dur * 0.3));
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    osc.connect(g);
    osc.start(t0);
    osc.stop(t0 + dur + 0.02);
  }

  function noise(opts) {
    if (!ctx || !noiseBuffer) return;
    var dur = opts.dur || 0.08;
    var peak = opts.peak === undefined ? 0.2 : opts.peak;

    R.meta.taught = R.util.storeGet(R.STORAGE.TUTORIAL) === '1';

      var def = R.MAP.mouths[n];
      var cells = def.lead.concat(R.MAP.trunk.slice(def.join || 0));
      var path = [];
      for (var i = 0; i < cells.length; i++) {
        var c = cells[i][0];
        var r = cells[i][1];

        kind[r * B.COLS + c] = R.ROAD;

      routes.push({ name: def.name, spawn: def.spawn.slice(), path: path });

    for (n = 0; n < routes.length; n++) {
      var sp = routes[n].spawn;
      kind[sp[1] * B.COLS + sp[0]] = R.SPAWN;

      roadCells: R.roadCellCount(board.kind),

      ui: {

/*
 * Grid maths: cell indexing, stepping in a direction, the mirror reflection
 * table, and the mapping between board cells and world coordinates.
 */

  'use strict';
  var R = global.R || (global.R = {});

    return r * B.COLS + c;
  };

  R.grid.colOf = function (i) {
    return i % B.COLS;
  };

  R.grid.rowOf = function (i) {
    return Math.floor(i / B.COLS);
  };

  R.grid.inBounds = function (c, r) {
    return c >= 0 && c < B.COLS && r >= 0 && r < B.ROWS;
  };

  R.grid.DC = [0, 1, 0, -1];
  R.grid.DR = [-1, 0, 1, 0];

  R.grid.stepC = function (c, dir) {
    return c + R.grid.DC[dir];
  };

  R.grid.stepR = function (r, dir) {
    return r + R.grid.DR[dir];
  };

  R.grid.opposite = function (dir) {
    return (dir + 2) % 4;
  };

   * Reflection off a 45 degree mirror in screen space with row 0 at the top.
   * Orientation 0 is "/" (bottom-left to top-right), orientation 1 is "\".
   */
  R.grid.REFLECT = [
    /* orient 0 "/" : N->E, E->N, S->W, W->S */
    [R.E, R.N, R.W, R.S],
    /* orient 1 "\" : N->W, E->S, S->E, W->N */
    [R.W, R.S, R.E, R.N]

    return R.grid.REFLECT[orient][dir];

  };

  R.grid.rowFromWorldZ = function (z) {

/*
   ==================================================================
   05_beam.js
   ==================================================================
*/
/*
 * The beam solver. A pure trace over the grid: light leaves each source, runs
 * in a straight line until it meets a piece, an enemy or the edge of the board,
 * and loses power to every enemy it passes through. Nothing here touches the
 * DOM or the renderer, so it can be unit tested in isolation.

  'use strict';
  var R = global.R || (global.R = {});
  var B = R.BALANCE;
  var CELLS = B.COLS * B.ROWS;

  R.beam = {};

  /* (cell, direction) pairs already travelled by the current source. */
  var visitStamp = new Int32Array(CELLS * 4);
  var visitGen = 0;

  /* Scratch used to order the enemies in one cell along the beam. */
  var orderScratch = [];

  /* ---------- result objects ---------- */

  function makeSegment() {
    return {
      c0: 0, r0: 0, c1: 0, r1: 0,
      x0: 0, z0: 0, x1: 0, z1: 0,
      dir: 0,
      bendAtStart: false,
      powerStart: 0,
      powerEnd: 0,
      sourceId: 0,
      sourcePower: 0,
      dist0: 0

  }

  R.beam.makeResult = function () {
    var segs = new Array(B.MAX_SEGMENTS);
    for (var i = 0; i < B.MAX_SEGMENTS; i++) segs[i] = makeSegment();

      segments: segs,
      segCount: 0,
      lit: new Float32Array(CELLS),
      litRoadCount: 0,
      litRoadPower: 0,
      /* Power actually landing on enemies, i.e. damage per second. */
      pressure: 0,
      totalPower: 0,
      overflow: false,
      version: 0
    };
  };

  /* ---------- enemy ordering ---------- */

  /*
   * Enemies in one cell are met in the order the light reaches them, which
   * depends on the direction the beam is travelling.
   */
  function orderAlong(list, dir) {
    var dc = R.grid.DC[dir];
    var dr = R.grid.DR[dir];
    orderScratch.length = 0;
    for (var i = 0; i < list.length; i++) {
      var e = list[i];
      var p = e.x * dc + e.z * dr;
      var j = orderScratch.length;
      while (j > 0 && (orderScratch[j - 1].x * dc + orderScratch[j - 1].z * dr) > p) {
        orderScratch[j] = orderScratch[j - 1];
        j--;
      }
      orderScratch[j] = e;
    }
    return orderScratch;

  var out = null;
  var occupancy = null;
  var stepDt = 0;
  var kind = null;
  var pieces = null;

  /* Per-solve values from the run upgrades, read once instead of per cell. */
  var splitFactor = 0;
  var absorbCut = 1;

  var bendPending = false;
  var currentSourcePower = 1;

  var segDistance = 0;

    s.c0 = c0; s.r0 = r0; s.c1 = c1; s.r1 = r1;
    s.dir = dir;
    s.bendAtStart = bendPending;
    bendPending = false;
    s.powerStart = powerStart;
    s.powerEnd = powerEnd;
    s.sourceId = sourceId;
    s.sourcePower = currentSourcePower;
    s.dist0 = segDistance;

    if (depth > B.MAX_DEPTH || power < B.MIN_POWER || out.overflow) return;
    bendPending = !!fromPiece;

    /* Distance from the source, in cells; the renderer sweeps the beam out

    var DC = R.grid.DC;
    var DR = R.grid.DR;

    var r = startR;

    var segZ = R.grid.worldZ(startR);

        return;

        if (piece.type === 'mirror') {
          trace(c, r, R.grid.reflect(dir, piece.orient), power, depth + 1, sourceId, true, travelled);
        } else if (piece.type === 'splitter') {
          trace(c, r, dir, power * splitFactor, depth + 1, sourceId, true, travelled);
          trace(c, r, R.grid.reflect(dir, piece.orient), power * splitFactor, depth + 1, sourceId, true, travelled);
        } else if (piece.type === 'reflector') {
          trace(c, r, R.grid.opposite(dir), power * B.REFLECT_FACTOR, depth + 1, sourceId, true, travelled);
        }
        /* A lamp absorbs whatever reaches it. */
        return;
      }

      if (kind[i] === R.CORE) {
        segDistance = segStartDist;
        emit(segX, segZ, R.grid.worldX(c), R.grid.worldZ(r), dir, segC, segR, c, r, segPower, power, sourceId);

   * Source strengths after run upgrades. Lamp power is derived from the core
   * level but scaled on its own, so an upgrade that trades core strength for
   * lamp strength is not quietly cancelled by the derivation.

      R.upgradeValue(state, 'twin', 'core', 1);
  };

  R.beam.lampOutput = function (state) {
    var base = R.beam.corePower(state.coreLevel) * B.LAMP_FACTOR;
    return base * R.upgradeValue(state, 'focused', 'lamp', 1) *
      R.upgradeValue(state, 'twin', 'lamp', 1);

    return R.upgradeValue(state, 'reach', 'split', B.SPLIT_FACTOR);

  R.beam.absorbOf = function (state, e) {

  R.beam.lampPower = function (level) {

   * Solve every source into `result`. `occ` is an array of per-cell enemy lists
   * or null; with a positive `dt` the enemies accumulate damage.
   */
  R.beam.solve = function (state, occ, dt, result) {

    occupancy = occ || null;
    stepDt = dt || 0;
    kind = state.grid.kind;
    pieces = state.pieces;
    nowTime = state.time;
    splitFactor = R.beam.splitFactor(state);
    absorbCut = 1 - R.upgradeValue(state, 'piercing', 'absorbCut', 0);

    out.segCount = 0;
    out.totalPower = 0;
    out.litRoadPower = 0;
    out.pressure = 0;
    out.overflow = false;
    out.lit.fill(0);

    var corePower = R.beam.coreOutput(state);
    var sourceId = 1;

    visitGen++;
    currentSourcePower = corePower;
    trace(R.MAP.core[0], R.MAP.core[1], R.N, corePower, 0, sourceId, false, 0);

    var lampPower = R.beam.lampOutput(state);
    var it = pieces.values();
    var entry = it.next();
    while (!entry.done) {
      var p = entry.value;
      if (p.type === 'lamp' && p.inactiveUntil <= nowTime) {
        sourceId++;
        visitGen++;
        currentSourcePower = lampPower;
        trace(p.c, p.r, p.dir, lampPower, 0, sourceId, false, 0);
      }
      entry = it.next();
    }

    var litRoad = 0;
    var litRoadPower = 0;
    for (var i = 0; i < CELLS; i++) {
      if (out.lit[i] > 0 && (kind[i] === R.ROAD || kind[i] === R.SPAWN)) {

      }

    out.litRoadCount = litRoad;
    out.litRoadPower = litRoadPower;
    out.version++;

    occupancy = null;
    pieces = null;
    kind = null;
    return result;
  };

  /*
   * Refresh the live beam without applying damage. This runs only after an
   * edit, so the route version it bumps is what the renderer watches to know
   * the beam should sweep out again.
   */
  R.beam.recompute = function (state) {
    state.routeVersion++;
    R.beam.solve(state, R.enemies ? R.enemies.occupancy(state) : null, 0, state.beam);
    return state.beam;
  };

  /* ---------- placement helpers ---------- */

  var scratchResult = null;

  function scratch() {
    if (!scratchResult) scratchResult = R.beam.makeResult();
    return scratchResult;
  }

  /*
   * How good a layout is, ignoring enemies. The main term is the power falling
   * on road cells. The tiny second term is how far the light reaches overall,
   * which only decides ties: a piece that sends the beam across the board is a
   * better guess than one that sends it straight off the edge, and that is what
   * makes a setup mirror in a chain orient itself the way the player intends.
   */
  R.beam.coverageScore = function (state) {
    var res = R.beam.solve(state, null, 0, scratch());
    var k = state.grid.kind;
    var road = 0;
    var reach = 0;
    for (var i = 0; i < CELLS; i++) {
      if (res.lit[i] <= 0) continue;
      reach++;
      if (k[i] === R.ROAD || k[i] === R.SPAWN) road += res.lit[i];
    }
    return road + reach * 1e-3;
  };

  R.beam.ORIENT_COUNT = { mirror: 2, splitter: 2, reflector: 1, lamp: 4 };

  /*
   * Pick the orientation that puts the most light on the road. Ties keep the
   * lowest orientation, so the choice is deterministic.
   */
  R.beam.bestOrientation = function (state, type, c, r) {
    var n = R.beam.ORIENT_COUNT[type] || 1;
    if (n === 1) return 0;
    var i = R.grid.idx(c, r);
    var existing = state.pieces.get(i);
    var probe = {
      id: -1,
      type: type,
      c: c,
      r: r,
      orient: 0,
      dir: R.N,
      cost: 0,
      placedAt: -1,
      inactiveUntil: -1

    state.pieces.set(i, probe);
    var best = 0;
    var bestScore = -1;
    for (var o = 0; o < n; o++) {
      if (type === 'lamp') probe.dir = o;
      else probe.orient = o;
      var score = R.beam.coverageScore(state);
      if (score > bestScore + 1e-9) {
        bestScore = score;
        best = o;
      }
    }
    if (existing) state.pieces.set(i, existing);
    else state.pieces.delete(i);
    return best;
  };

  var previewScratch = null;

  /* Preview result for a hypothetical piece; used by the drag ghost. */
  R.beam.preview = function (state, type, c, r, orient, removeIndex) {
    if (!previewScratch) previewScratch = R.beam.makeResult();
    var i = R.grid.idx(c, r);
    var existing = state.pieces.get(i);
    var moved = null;
    if (removeIndex !== undefined && removeIndex !== null && removeIndex !== i) {
      moved = state.pieces.get(removeIndex);
      if (moved) state.pieces.delete(removeIndex);
    }
    var probe = {
      id: -1,
      type: type,
      c: c,
      r: r,
      orient: type === 'lamp' ? 0 : orient,
      dir: type === 'lamp' ? orient : R.N,
      cost: 0,
      placedAt: -1,
      inactiveUntil: -1
    };
    state.pieces.set(i, probe);
    var res = R.beam.solve(state, null, 0, previewScratch);
    if (existing) state.pieces.set(i, existing);
    else state.pieces.delete(i);
    if (moved) state.pieces.set(removeIndex, moved);
    return res;
  };

<script>
/*
   ==================================================================
   06_enemies.js
   ==================================================================
*/
/*
 * Enemies and waves. Enemies walk the fixed path, absorb light, die or reach
 * the core. Waves are read from the balance table and generated past the last
 * scripted beat.
 */
(function (global) {
  'use strict';
  var R = global.R || (global.R = {});
  var B = R.BALANCE;
  var CELLS = B.COLS * B.ROWS;

  var en = {};
  R.enemies = en;

  /* Reused enemy records, so a long run allocates nothing per wave. */
  var pool = [];

  function acquire() {
    return pool.length ? pool.pop() : {
      id: 0, type: '', hp: 0, maxHp: 0, t: 0, speed: 0, absorb: 0, shield: 0,
      gold: 0, leak: 0, radius: 0, boss: false, face: 0,
      shield0: 0, exposeAt: 0, phase: 1, route: 0,
      damage: 0, hitAt: -1, shieldedAt: -1, exposedAt: -1, crossfireAt: -1,
      dirMask: 0, peakHit: 0, glowUntil: -1, glowPower: 0,
      x: 0, z: 0, cell: -1, spawnAt: 0
    };
  }

  en.releaseAll = function (s) {
    if (!s || !s.enemies) return;
    for (var i = 0; i < s.enemies.length; i++) pool.push(s.enemies[i]);
    s.enemies.length = 0;
  };

  /* ---------- wave data ---------- */

  en.hpMult = function (wave) {
    return 1 + B.HP_MULT_PER_WAVE * (wave - 1);
  };

  en.speedMult = function (wave) {
    var last = B.WAVES.length;
    if (wave <= last) return 1;
    return Math.min(B.ENDLESS.SPEED_CAP, 1 + B.ENDLESS.SPEED_PER_WAVE * (wave - last));
  };

  /*
   * Endless waves rotate through four shapes and add a king every fifth wave.
   *
   * Every group is then split across both gates. The shapes, the counts and
   * the spacing are exactly as they were; what changes is that half of each
   * group now walks in through the west gate, which the generator used to
   * ignore entirely. A network that covers only one road no longer holds.
   */
  en.endlessGroups = function (wave) {
    var count = B.ENDLESS.BASE_COUNT + wave;
    var pattern = (wave - B.WAVES.length - 1) % 4;
    var groups = [];
    if (pattern === 0) {
      groups.push(['mote', count, 0.6]);
      groups.push(['runner', Math.ceil(count / 3), 0.5]);
    } else if (pattern === 1) {
      groups.push(['runner', count, 0.45]);
      groups.push(['mote', Math.ceil(count / 3), 0.7]);
    } else if (pattern === 2) {
      groups.push(['swarmling', 8, 0.25]);
      groups.push(['swarmling', 8, 0.25]);
      groups.push(['swarmling', 8, 0.25]);
      groups.push(['mote', Math.ceil(count / 2), 0.6]);
    } else {
      groups.push(['bulwark', Math.max(2, Math.floor(count / 4)), 1.2]);
      groups.push(['mote', count, 0.6]);
    }
    if (wave % B.ENDLESS.KING_EVERY === 0) groups.unshift(['bruteking', 1, 0]);
    return splitAcrossGates(groups, wave);
  };

  /*
   * Halve each group between the two gates, keeping its type and spacing. A
   * group of one - the Brute King - cannot be halved, so it changes gate from
   * one appearance to the next instead.
   */
  function splitAcrossGates(groups, wave) {
    var gates = Math.min(2, R.MAP.mouths.length);
    if (gates < 2) return groups;
    var out = [];
    var singles = 0;
    for (var i = 0; i < groups.length; i++) {
      var type = groups[i][0];
      var n = groups[i][1];
      var gap = groups[i][2];
      if (n <= 1) {
        out.push([type, n, gap, (wave + singles) % gates]);
        singles++;
        continue;
      }
      var first = Math.ceil(n / 2);
      out.push([type, first, gap, 0]);
      out.push([type, n - first, gap, 1]);
    }
    return out;
  }

  en.groupsFor = function (wave) {
    if (wave <= B.WAVES.length) return B.WAVES[wave - 1];
    return en.endlessGroups(wave);
  };

  /* Flattened spawn schedule: one entry per enemy, in spawn order. */
  en.buildQueue = function (wave) {
    var groups = en.groupsFor(wave);
    var queue = [];
    var t = 0;
    for (var g = 0; g < groups.length; g++) {
      var type = groups[g][0];
      var count = groups[g][1];
      var gap = groups[g][2];
      var route = groups[g][3] || 0;
      for (var i = 0; i < count; i++) {
        queue.push({ type: type, at: t, route: route });
        if (i < count - 1) t += gap;
      }
      t += B.GROUP_GAP;
    }
    /*
     * Groups are written one after another, but two roads run at once, so a
     * queue that is already ordered by time reads correctly on both.
     */
    queue.sort(function (a, b) { return a.at - b.at; });
    return queue;
  };

  /* Which roads a wave uses, lowest first. */
  en.routesFor = function (wave) {
    var groups = en.groupsFor(wave);
    var seen = [];
    for (var g = 0; g < groups.length; g++) {
      var route = groups[g][3] || 0;
      if (seen.indexOf(route) < 0) seen.push(route);
    }
    seen.sort();
    return seen;
  };

  /* Composition summary for the incoming strip, in spawn order. */
  en.composition = function (wave) {
    var groups = en.groupsFor(wave);
    var out = [];
    for (var g = 0; g < groups.length; g++) {
      var last = out[out.length - 1];
      if (last && last.type === groups[g][0]) last.count += groups[g][1];
      else out.push({ type: groups[g][0], count: groups[g][1] });
    }
    return out;
  };

  /*
   * One short line naming what is coming and why it matters. It describes the
   * formation, never the player's layout, so the preview cannot be accused of
   * reacting to what has been built.
   */
  /*
   * Names an entrance the next encounter uses that has not been used before,
   * or null. The strip shows this during planning, so a road never opens
   * without the player having been told about it first.
   */
  en.newMouthNote = function (s, wave) {
    var uses = en.routesFor(wave);
    for (var i = 0; i < uses.length; i++) {
      if (uses[i] >= s.routesOpen) {
        var road = s.routes[uses[i]];
        return 'the ' + road.name + ' gate opens';
      }
    }
    return null;
  };

  en.threatNote = function (wave) {
    var comp = en.composition(wave);
    var has = {};
    for (var i = 0; i < comp.length; i++) has[comp[i].type] = comp[i].count;
    if (has.umbra) return 'Umbra, shielded, with escorts';
    if (has.bruteking) return 'a Brute King leads';
    if (has.bulwark && has.swarmling) return 'a shielded leader, then a swarm';
    if (has.bulwark && comp[0].type === 'bulwark') return 'armoured leaders, others behind';
    if (has.bulwark) return 'armoured bodies in the line';
    if (has.swarmling) return 'a swarm that drains the beam';
    if (has.runner) return 'runners cross the light fast';
    return 'a slow opening group';
  };

  /* ---------- spawning ---------- */

  en.spawn = function (s, type, route) {
    var def = B.ENEMY[type];
    var e = acquire();
    e.id = s.nextEnemyId++;
    e.type = type;
    e.route = route || 0;
    if (e.route >= s.routes.length) e.route = 0;
    e.maxHp = def.boss ? def.hp : Math.round(def.hp * en.hpMult(s.wave));
    e.hp = e.maxHp;
    e.t = -1;
    e.speed = def.speed * en.speedMult(s.wave);
    e.absorb = def.absorb;
    e.shield = def.shield || 0;
    e.shield0 = e.shield;
    e.exposeAt = def.exposeAt || 0;
    e.phase = 1;
    e.gold = def.gold;
    e.leak = def.leak;
    e.radius = def.radius;
    e.boss = !!def.boss;
    e.damage = 0;
    e.hitAt = -1;
    e.shieldedAt = -1;
    e.exposedAt = -1;
    e.dirMask = 0;
    e.peakHit = 0;
    e.glowUntil = -1;
    e.glowPower = 0;
    e.crossfireAt = -1;
    e.face = R.S;
    e.cell = -1;
    e.spawnAt = s.time;
    positionOf(s, e);
    s.enemies.push(e);
    R.emit(s, 'spawn', { enemy: type, id: e.id, route: e.route });
    return e;
  };

  /* ---------- movement ---------- */

  /*
   * Enemies walk from a virtual cell one row above the portal. Below t = -0.5
   * they are still off the board and cannot be hit.
   */
  function pathPoint(s, route, index, out) {
    var road = s.routes[route];
    if (index < 0) {
      out.x = R.grid.worldX(road.spawn[0]);
      out.z = R.grid.worldZ(road.spawn[1]) - 1;
    } else {
      var p = road.path[Math.min(index, road.path.length - 1)];
      out.x = R.grid.worldX(p.c);
      out.z = R.grid.worldZ(p.r);
    }
    return out;
  }

  /* The last index on a road, which is the core. */
  en.endOf = function (s, route) {
    return s.routes[route].path.length - 1;
  };

  var pa = { x: 0, z: 0 };
  var pb = { x: 0, z: 0 };

  function positionOf(s, e) {
    var road = s.routes[e.route];
    var k = Math.floor(e.t);
    var frac = e.t - k;
    pathPoint(s, e.route, k, pa);
    pathPoint(s, e.route, k + 1, pb);
    e.x = pa.x + (pb.x - pa.x) * frac;
    e.z = pa.z + (pb.z - pa.z) * frac;
    var idx = Math.round(e.t);
    if (idx < 0) e.cell = -1;
    else e.cell = road.path[Math.min(idx, road.path.length - 1)].i;
    e.face = facing(pa, pb, e.face);
  }

  /*
   * Which way an enemy is looking, which is simply the way it is walking. The
   * road is axis aligned, so this is one of the four direction codes. A step
   * that covers no ground keeps the previous facing.
   */
  function facing(from, to, previous) {
    var dx = to.x - from.x;
    var dz = to.z - from.z;
    if (Math.abs(dx) > Math.abs(dz)) return dx > 0 ? R.E : R.W;
    if (Math.abs(dz) > 0) return dz > 0 ? R.S : R.N;
    return previous;
  }

  /*
   * How much of an incoming beam actually lands, given the direction the light
   * is travelling. Light meeting the face this enemy walks towards is cut by
   * its shield; light arriving at a flank or from behind lands in full.
   */
  en.exposure = function (e, beamDir) {
    if (!e.shield) return 1;
    return beamDir === R.grid.opposite(e.face) ? 1 - e.shield : 1;
  };

  en.positionOf = positionOf;

  /* ---------- occupancy ---------- */

  var occ = new Array(CELLS);

  en.occupancy = function (s) {
    for (var i = 0; i < CELLS; i++) occ[i] = null;
    var list = s.enemies;
    for (var k = 0; k < list.length; k++) {
      var e = list[k];
      if (e.cell < 0) continue;
      if (!occ[e.cell]) occ[e.cell] = [];
      occ[e.cell].push(e);
    }
    return occ;
  };

  /* ---------- per-step work ---------- */

  en.spawnStep = function (s, dt) {
    if (s.phase !== 'wave') return;
    while (s.spawnCursor < s.spawnQueue.length && s.spawnQueue[s.spawnCursor].at <= s.waveTime) {
      en.spawn(s, s.spawnQueue[s.spawnCursor].type, s.spawnQueue[s.spawnCursor].route);
      s.spawnCursor++;
    }
  };

  en.moveStep = function (s, dt) {
    var list = s.enemies;
    for (var i = 0; i < list.length; i++) {
      var e = list[i];
      var last = en.endOf(s, e.route);
      e.t += e.speed * dt;
      positionOf(s, e);
      /*
       * A boss that advances behind a shield drops it partway down the road.
       * The change is announced so the renderer and audio can telegraph it,
       * and it happens on distance travelled rather than on damage taken, so
       * the player can see it coming and prepare for it.
       */
      if (e.phase === 1 && e.exposeAt > 0 && e.t >= last * e.exposeAt) {
        e.phase = 2;
        e.shield = 0;
        R.emit(s, 'bossphase', { enemy: e.type, id: e.id, phase: 2, x: e.x, z: e.z });
      }
    }
  };

  /* How many different directions delivered light to a body this step. */
  function directionsHit(mask) {
    var n = 0;
    for (var d = 0; d < 4; d++) if (mask & (1 << d)) n++;
    return n;
  }

  /*
   * Damage collected by the solver becomes deaths; survivors may then leak.
   * The run upgrades that change damage rather than light are applied here, on
   * the total for the step, so each is counted once however many beams landed.
   */
  en.resolveStep = function (s, dt) {
    var list = s.enemies;
    var step = dt || 0;
    var crossfire = R.upgradeValue(s, 'crossfire', 'bonus', 0);
    var glowSeconds = R.upgradeValue(s, 'afterglow', 'seconds', 0);
    var glowShare = R.upgradeValue(s, 'afterglow', 'share', 0);

    for (var i = list.length - 1; i >= 0; i--) {
      var e = list[i];

      if (crossfire > 0 && e.damage > 0 && directionsHit(e.dirMask) >= 2) {
        e.damage *= (1 + crossfire);
        e.crossfireAt = s.time;
      }

      /*
       * Afterglow is a single refreshable burn, never a stack: a new hit
       * replaces the tail rather than adding another one, and the tail itself
       * never counts as a hit, so it cannot feed itself.
       */
      if (glowSeconds > 0) {
        if (e.peakHit > 0) {
          e.glowUntil = s.time + glowSeconds;
          e.glowPower = e.peakHit * glowShare;
        } else if (e.glowUntil > s.time && e.glowPower > 0) {
          e.damage += e.glowPower * step;
        }
      }

      e.dirMask = 0;
      e.peakHit = 0;

      if (e.damage > 0) {
        e.hp -= e.damage;
        e.damage = 0;
      }
      if (e.hp <= 0) {
        list.splice(i, 1);
        s.gold += e.gold;
        s.goldEarned += e.gold;
        R.emit(s, 'kill', { enemy: e.type, gold: e.gold, x: e.x, z: e.z, boss: e.boss, id: e.id });
        pool.push(e);
        continue;
      }
      if (e.t >= en.endOf(s, e.route)) {
        list.splice(i, 1);
        s.coreHp -= e.leak;
        s.leaksBy[e.type] = (s.leaksBy[e.type] || 0) + 1;
        R.emit(s, 'leak', { enemy: e.type, leak: e.leak, x: e.x, z: e.z, id: e.id });
        /*
         * A boss that arrives ends the run outright. Surviving the hit is not
         * a win: the session is only won by destroying it on the road.
         */
        if (e.boss) {
          s.bossBreached = e.type;
          R.emit(s, 'breach', { enemy: e.type, x: e.x, z: e.z, id: e.id });
        }
        pool.push(e);
      }
    }
  };

  en.aliveCount = function (s) {
    return s.enemies.length;
  };

  en.remaining = function (s) {
    return s.enemies.length + (s.spawnQueue.length - s.spawnCursor);
  };

  en.waveComplete = function (s) {
    return s.spawnCursor >= s.spawnQueue.length && s.enemies.length === 0;
  };
})(typeof window !== 'undefined' ? window : globalThis);
</script>

<script>
/*
   ==================================================================
   07_pieces.js
   ==================================================================
*/
/*
 * Pieces: buying, placing, flipping and the gold rules around them. All of it
 * is plain state manipulation; feedback is pushed onto state.events for the
 * renderer, the HUD and the audio system to pick up.
 */
(function (global) {
  'use strict';
  var R = global.R || (global.R = {});
  var B = R.BALANCE;

  R.pieces = {};

  /*
   * Planning is the forgiving phase: pieces can be moved, turned and sold back
   * at the price actually paid, so experimenting with a layout costs nothing.
   * Once a wave is running, edits carry a re-form delay and sales take the
   * sell rate.
   */
  R.pieces.isPlanning = function (s) {
    return s.phase === 'building' || s.phase === 'title';
  };

  R.pieces.cost = function (s, type) {
    if (type === 'lamp') return B.PIECE_COST.lamp + B.LAMP_COST_STEP * s.lampsPlaced;
    return B.PIECE_COST[type] || 0;
  };

  R.pieces.isUnlocked = function (s, type) {
    return !!s.unlocked[type];
  };

  /*
   * Why a placement would be refused, or null when it is allowed.
   * 'locked' | 'gold' | 'occupied' | 'terrain'
   */
  R.pieces.placementProblem = function (s, type, c, r) {
    if (!R.pieces.isUnlocked(s, type)) return 'locked';
    if (!R.grid.inBounds(c, r)) return 'terrain';
    var i = R.grid.idx(c, r);
    if (s.grid.kind[i] !== R.EMPTY) return 'terrain';
    if (s.pieces.has(i)) return 'occupied';
    if (s.gold < R.pieces.cost(s, type)) return 'gold';
    return null;
  };

  R.pieces.at = function (s, c, r) {
    if (!R.grid.inBounds(c, r)) return null;
    return s.pieces.get(R.grid.idx(c, r)) || null;
  };

  R.pieces.byId = function (s, id) {
    var it = s.pieces.values();
    var e = it.next();
    while (!e.done) {
      if (e.value.id === id) return e.value;
      e = it.next();
    }
    return null;
  };

  /*
   * Place a piece and pay for it. `orient` may be omitted, in which case the
   * orientation that puts the most light on the road is chosen.
   */
  R.pieces.place = function (s, type, c, r, orient) {
    var problem = R.pieces.placementProblem(s, type, c, r);
    if (problem) {
      R.emit(s, 'denied', { reason: problem, c: c, r: r, piece: type, cost: R.pieces.cost(s, type) });
      return null;
    }

    var cost = R.pieces.cost(s, type);
    var chosen = orient;
    if (chosen === undefined || chosen === null) chosen = R.beam.bestOrientation(s, type, c, r);

    var piece = {
      id: s.nextPieceId++,
      type: type,
      c: c,
      r: r,
      i: R.grid.idx(c, r),
      orient: type === 'lamp' ? 0 : (chosen % 2),
      dir: type === 'lamp' ? (chosen % 4) : R.N,
      cost: cost,
      placedAt: s.time,
      inactiveUntil: -1
    };

    s.gold -= cost;
    s.pieces.set(piece.i, piece);
    if (type === 'lamp') s.lampsPlaced++;
    s.ui.undo = { pieceId: piece.id, until: s.time + B.UNDO_WINDOW, refund: cost };

    /* The opening has been answered; stop pointing. */
    s.ui.suggest = null;
    R.beam.recompute(s);
    R.emit(s, 'place', { id: piece.id, piece: type, c: c, r: r, cost: cost });
    if (R.tutorialSaw) R.tutorialSaw(s, 'place', { id: piece.id });
    return piece;
  };

  /* Mirrors and splitters toggle diagonal; lamps turn a quarter clockwise. */
  R.pieces.flip = function (s, c, r) {
    var p = R.pieces.at(s, c, r);
    if (!p) return false;
    if (p.type === 'reflector') {
      R.emit(s, 'denied', { reason: 'noflip', c: c, r: r });
      return false;
    }
    if (p.type === 'lamp') p.dir = (p.dir + 1) % 4;
    else p.orient = p.orient ? 0 : 1;
    R.beam.recompute(s);
    R.emit(s, 'flip', { id: p.id, piece: p.type, c: c, r: r, toOrient: p.orient });
    if (R.tutorialSaw) R.tutorialSaw(s, 'flip', { id: p.id });
    return true;
  };

  /* ---------- selection ---------- */

  R.pieces.selected = function (s) {
    if (s.ui.selectedPieceId === null) return null;
    return R.pieces.byId(s, s.ui.selectedPieceId);
  };

  R.pieces.select = function (s, piece) {
    s.ui.selectedPieceId = piece ? piece.id : null;
    s.ui.moveMode = false;
    R.emit(s, 'select', { id: s.ui.selectedPieceId });
    if (piece && R.tutorialSaw) R.tutorialSaw(s, 'select', { id: piece.id });
  };

  R.pieces.deselect = function (s) {
    if (s.ui.selectedPieceId === null && !s.ui.moveMode) return;
    s.ui.selectedPieceId = null;
    s.ui.moveMode = false;
    R.emit(s, 'select', { id: null });
  };

  /* ---------- undo ---------- */

  R.pieces.undoLive = function (s) {
    var u = s.ui.undo;
    if (!u) return null;
    if (s.time > u.until) return null;
    return R.pieces.byId(s, u.pieceId) ? u : null;
  };

  R.pieces.undo = function (s) {
    var u = R.pieces.undoLive(s);
    if (!u) return false;
    var p = R.pieces.byId(s, u.pieceId);
    var record = snapshotOf(p);
    removePiece(s, p, u.refund);
    R.emit(s, 'undo', { refund: u.refund, c: p.c, r: p.r, piece: record.type, record: record });
    return true;
  };

  /* A plain copy so the renderer can play the piece out after it is gone. */
  function snapshotOf(p) {
    return { type: p.type, c: p.c, r: p.r, orient: p.orient, dir: p.dir };
  }

  /* ---------- selling ---------- */

  function removePiece(s, p, refund) {
    s.gold += refund;
    s.pieces.delete(p.i);
    if (p.type === 'lamp' && s.lampsPlaced > 0) s.lampsPlaced--;
    if (s.ui.selectedPieceId === p.id) {
      s.ui.selectedPieceId = null;
      s.ui.moveMode = false;
    }
    if (s.ui.undo && s.ui.undo.pieceId === p.id) s.ui.undo = null;
    R.beam.recompute(s);
  }

  /*
   * The refund is the price this piece was actually paid for while planning or
   * inside the undo window, and the sell rate once a wave is running. It is
   * never more than was paid, so a rising lamp price cannot be arbitraged.
   */
  R.pieces.refundFor = function (s, p) {
    if (R.pieces.isPlanning(s)) return p.cost;
    var u = s.ui.undo;
    if (u && u.pieceId === p.id && s.time <= u.until) return p.cost;
    return Math.floor(p.cost * B.SELL_RATE);
  };

  R.pieces.sell = function (s, c, r) {
    var p = R.pieces.at(s, c, r);
    if (!p) return false;
    var refund = R.pieces.refundFor(s, p);
    var record = snapshotOf(p);
    removePiece(s, p, refund);
    R.emit(s, 'sell', { refund: refund, c: c, r: r, piece: record.type, record: record });
    return true;
  };

  /* ---------- moving ---------- */

  R.pieces.move = function (s, fromC, fromR, toC, toR) {
    var p = R.pieces.at(s, fromC, fromR);
    if (!p) return false;
    if (fromC === toC && fromR === toR) {
      s.ui.moveMode = false;
      return true;
    }
    if (!R.grid.isBuildable(s, toC, toR)) {
      R.emit(s, 'denied', { reason: 'terrain', c: toC, r: toR, piece: p.type });
      return false;
    }
    s.pieces.delete(p.i);
    p.c = toC;
    p.r = toR;
    p.i = R.grid.idx(toC, toR);
    /*
     * A piece moved mid-combat is transparent to light while it re-forms.
     * Rearranging during planning is free.
     */
    p.inactiveUntil = R.pieces.isPlanning(s) ? -1 : s.time + B.MOVE_REFORM;
    s.pieces.set(p.i, p);
    s.ui.moveMode = false;
    R.beam.recompute(s);
    R.emit(s, 'move', { id: p.id, piece: p.type, c: toC, r: toR });
    return true;
  };

  /* ---------- the core ---------- */

  R.pieces.coreMaxLevel = function () {
    return B.CORE_POWER.length;
  };

  R.pieces.coreUpgradeCost = function (s) {
    if (s.coreLevel >= B.CORE_POWER.length) return null;
    return B.CORE_UPGRADE_COST[s.coreLevel - 1];
  };

  R.pieces.upgradeCore = function (s) {
    var cost = R.pieces.coreUpgradeCost(s);
    if (cost === null) return false;
    if (s.gold < cost) {
      R.emit(s, 'denied', { reason: 'gold', cost: cost, core: true });
      return false;
    }
    s.gold -= cost;
    s.coreLevel++;
    R.beam.recompute(s);
    R.emit(s, 'upgrade', { level: s.coreLevel, cost: cost });
    return true;
  };

})(typeof window !== 'undefined' ? window : globalThis);
</script>

<script>
/*
   ==================================================================
   08_render.js
   ==================================================================
*/
/*
 * Rendering: one WebGL scene with an orthographic camera tilted towards the
 * player, the static board, and pooled meshes for everything that changes.
 * The renderer reads state and never writes to it.
 */
(function (global) {
  'use strict';
  var R = global.R || (global.R = {});
  var B = R.BALANCE;
  var V = R.VIEW;
  var C = R.COLORS;

  var rd = {};
  R.render = rd;

  rd.ready = false;
  rd.hitStop = 0;
  rd.cell = 40;
  rd.boardW = 0;
  rd.boardH = 0;

  var THREE = null;
  var scene = null;
  var camera = null;
  var renderer = null;
  var dummy = null;
  var raycaster = null;
  var pointerNdc = null;
  var boardPlane = null;
  var hitPoint = null;

  var cosTilt = Math.cos(V.TILT_DEG * Math.PI / 180);

  /* ---------- procedural textures ---------- */

  function makeCanvas(size) {
    var cv = document.createElement('canvas');
    cv.width = size;
    cv.height = size;
    return cv;
  }

  function glowTexture() {
    var s = 128;
    var cv = makeCanvas(s);
    var g = cv.getContext('2d');
    var grad = g.createRadialGradient(s / 2, s / 2, 0, s / 2, s / 2, s / 2);
    grad.addColorStop(0, 'rgba(255,255,255,1)');
    grad.addColorStop(0.45, 'rgba(255,255,255,0.42)');
    grad.addColorStop(1, 'rgba(255,255,255,0)');
    g.fillStyle = grad;
    g.fillRect(0, 0, s, s);
    var t = new THREE.CanvasTexture(cv);
    return t;
  }

  /* A soft-edged bar used for beam segments; the gradient runs across width. */
  function beamTexture() {
    var s = 64;
    var cv = makeCanvas(s);
    var g = cv.getContext('2d');
    var grad = g.createLinearGradient(0, 0, s, 0);
    grad.addColorStop(0, 'rgba(255,255,255,0)');
    grad.addColorStop(0.5, 'rgba(255,255,255,1)');
    grad.addColorStop(1, 'rgba(255,255,255,0)');
    g.fillStyle = grad;
    g.fillRect(0, 0, s, s);
    return new THREE.CanvasTexture(cv);
  }

  /* Arrow pointing towards -y in texture space (drawn up the plane). */
  function chevronTexture() {
    var s = 64;
    var cv = makeCanvas(s);
    var g = cv.getContext('2d');
    g.strokeStyle = 'rgba(255,255,255,0.95)';
    g.lineWidth = 7;
    g.lineCap = 'round';
    g.lineJoin = 'round';
    g.beginPath();
    g.moveTo(14, 40);
    g.lineTo(32, 22);
    g.lineTo(50, 40);
    g.stroke();
    return new THREE.CanvasTexture(cv);
  }

  /* Soft-edged square so adjacent lit road cells merge into one band. */
  function tileGlowTexture() {
    var s = 64;
    var cv = makeCanvas(s);
    var g = cv.getContext('2d');
    var img = g.createImageData(s, s);
    for (var y = 0; y < s; y++) {
      for (var x = 0; x < s; x++) {
        var fx = Math.abs((x + 0.5) / s - 0.5) * 2;
        var fy = Math.abs((y + 0.5) / s - 0.5) * 2;
        var f = Math.max(fx, fy);
        var a = f < 0.76 ? 1 : Math.max(0, 1 - (f - 0.76) / 0.24);
        var o = (y * s + x) * 4;
        img.data[o] = 255;
        img.data[o + 1] = 255;
        img.data[o + 2] = 255;
        img.data[o + 3] = Math.round(a * a * 255);
      }
    }
    g.putImageData(img, 0, 0);
    return new THREE.CanvasTexture(cv);
  }

  function ringTexture() {
    var s = 128;
    var cv = makeCanvas(s);
    var g = cv.getContext('2d');
    g.strokeStyle = 'rgba(255,255,255,0.9)';
    g.lineWidth = 6;
    g.beginPath();
    g.arc(s / 2, s / 2, s / 2 - 10, 0, Math.PI * 2);
    g.stroke();
    g.lineWidth = 3;
    for (var i = 0; i < 8; i++) {
      var a = i * Math.PI / 4;
      g.beginPath();
      g.moveTo(s / 2 + Math.cos(a) * (s / 2 - 22), s / 2 + Math.sin(a) * (s / 2 - 22));
      g.lineTo(s / 2 + Math.cos(a) * (s / 2 - 34), s / 2 + Math.sin(a) * (s / 2 - 34));
      g.stroke();
    }
    return new THREE.CanvasTexture(cv);
  }

  rd.tex = {};

  /* ---------- scene construction ---------- */

  function buildLights() {
    var hemi = new THREE.HemisphereLight(0x8fa8e0, 0x0a0d18, 1.05);
    scene.add(hemi);
    var dir = new THREE.DirectionalLight(0xffffff, 0.7);
    dir.position.set(2.5, 8, 4);
    scene.add(dir);
  }

  var tileMeshes = {};

  function buildBoard(state) {
    var kind = state.grid.kind;
    var i, c, r;

    var emptyIdx = [];
    var roadIdx = [];
    for (i = 0; i < kind.length; i++) {
      if (kind[i] === R.EMPTY) emptyIdx.push(i);
      else if (kind[i] === R.ROAD || kind[i] === R.SPAWN) roadIdx.push(i);
    }

    /* Buildable tiles sit slightly proud of the board. */
    var emptyGeo = new THREE.BoxGeometry(0.9, 0.18, 0.9);
    var emptyMat = new THREE.MeshLambertMaterial({ color: C.tile });
    var empties = new THREE.InstancedMesh(emptyGeo, emptyMat, emptyIdx.length);
    empties.instanceMatrix.setUsage(THREE.StaticDrawUsage);
    for (i = 0; i < emptyIdx.length; i++) {
      c = R.grid.colOf(emptyIdx[i]);
      r = R.grid.rowOf(emptyIdx[i]);
      dummy.position.set(R.grid.worldX(c), -0.09, R.grid.worldZ(r));
      dummy.rotation.set(0, 0, 0);
      dummy.scale.set(1, 1, 1);
      dummy.updateMatrix();
      empties.setMatrixAt(i, dummy.matrix);
    }
    empties.instanceMatrix.needsUpdate = true;
    scene.add(empties);
    tileMeshes.empty = empties;
    tileMeshes.emptyIdx = emptyIdx;

    /* Road tiles form a continuous sunken ribbon. */
    var roadGeo = new THREE.BoxGeometry(1.0, 0.14, 1.0);
    var roadMat = new THREE.MeshLambertMaterial({ color: C.road });
    var roads = new THREE.InstancedMesh(roadGeo, roadMat, roadIdx.length);
    for (i = 0; i < roadIdx.length; i++) {
      c = R.grid.colOf(roadIdx[i]);
      r = R.grid.rowOf(roadIdx[i]);
      dummy.position.set(R.grid.worldX(c), -0.10, R.grid.worldZ(r));
      dummy.rotation.set(0, 0, 0);
      dummy.scale.set(1, 1, 1);
      dummy.updateMatrix();
      roads.setMatrixAt(i, dummy.matrix);
    }
    roads.instanceMatrix.needsUpdate = true;
    scene.add(roads);
    tileMeshes.road = roads;

    /* Direction chevrons on every road, pointing the way the enemies walk. */
    var steps = [];
    for (var rt = 0; rt < state.routes.length; rt++) {
      var rp = state.routes[rt].path;
      for (var si = 0; si < rp.length - 1; si++) steps.push([rp[si], rp[si + 1]]);
    }
    var chevGeo = new THREE.PlaneGeometry(0.62, 0.62);
    var chevMat = new THREE.MeshBasicMaterial({
      map: rd.tex.chevron,
      transparent: true,
      opacity: 0.36,
      color: C.chevron,
      depthWrite: false,
      blending: THREE.AdditiveBlending
    });
    var chevrons = new THREE.InstancedMesh(chevGeo, chevMat, steps.length);
    for (i = 0; i < steps.length; i++) {
      var a = steps[i][0];
      var b2 = steps[i][1];
      var ang = Math.atan2(b2.c - a.c, -(b2.r - a.r));
      dummy.position.set(R.grid.worldX(a.c), 0.012, R.grid.worldZ(a.r));
      dummy.rotation.set(-Math.PI / 2, 0, -ang);
      dummy.scale.set(1, 1, 1);
      dummy.updateMatrix();
      chevrons.setMatrixAt(i, dummy.matrix);
    }
    chevrons.instanceMatrix.needsUpdate = true;
    scene.add(chevrons);
    tileMeshes.chevrons = chevrons;

    /*
     * One portal per road. A road the player has not been shown yet is drawn
     * faintly rather than hidden, so the second entrance is somewhere on the
     * board before anything ever walks out of it.
     */
    rd.portalRings = [];
    for (var pi = 0; pi < state.routes.length; pi++) {
      var sp = state.routes[pi].spawn;
      var portal = new THREE.Group();
      portal.position.set(R.grid.worldX(sp[0]), 0.015, R.grid.worldZ(sp[1]));
      var disc = new THREE.Mesh(
        new THREE.CircleGeometry(0.42, 24),
        new THREE.MeshBasicMaterial({ color: 0x140a22 })
      );
      disc.rotation.x = -Math.PI / 2;
      portal.add(disc);
      var ring = new THREE.Mesh(
        new THREE.PlaneGeometry(0.94, 0.94),
        new THREE.MeshBasicMaterial({
          map: rd.tex.ring,
          color: 0x9b4dff,
          transparent: true,
          depthWrite: false,
          blending: THREE.AdditiveBlending
        })
      );
      ring.rotation.x = -Math.PI / 2;
      ring.position.y = 0.01;
      portal.add(ring);
      scene.add(portal);
      rd.portalRings.push(ring);
    }
    rd.portalRing = rd.portalRings[0];

    /* The Lumen Core: pedestal, crystal and a glow disc on the floor. */
    var core = new THREE.Group();
    core.position.set(R.grid.worldX(R.MAP.core[0]), 0, R.grid.worldZ(R.MAP.core[1]));
    var ped = new THREE.Mesh(
      new THREE.CylinderGeometry(0.34, 0.42, 0.22, 6),
      new THREE.MeshLambertMaterial({ color: 0x2b3766 })
    );
    ped.position.y = 0.11;
    core.add(ped);
    var crystal = new THREE.Mesh(
      new THREE.OctahedronGeometry(0.3, 0),
      new THREE.MeshLambertMaterial({ color: C.core, emissive: C.coreRim, emissiveIntensity: 0.9 })
    );
    crystal.position.y = 0.52;
    core.add(crystal);
    var haze = new THREE.Mesh(
      new THREE.PlaneGeometry(1.9, 1.9),
      new THREE.MeshBasicMaterial({
        map: rd.tex.glow,
        color: C.coreRim,
        transparent: true,
        opacity: 0.5,
        depthWrite: false,
        blending: THREE.AdditiveBlending
      })
    );
    haze.rotation.x = -Math.PI / 2;
    haze.position.y = 0.02;
    core.add(haze);
    scene.add(core);
    rd.coreGroup = core;
    rd.coreCrystal = crystal;
    rd.coreHaze = haze;
  }

  /* ---------- init ---------- */

  rd.init = function (state) {
    THREE = global.THREE;
    if (!THREE) return false;

    var canvas = document.getElementById('gl');
    try {
      renderer = new THREE.WebGLRenderer({ canvas: canvas, antialias: true, alpha: false });
    } catch (err) {
      return false;
    }
    if (!renderer || !renderer.getContext()) return false;

    renderer.setPixelRatio(Math.min(global.devicePixelRatio || 1, 2));
    renderer.setClearColor(C.background, 1);

    scene = new THREE.Scene();
    dummy = new THREE.Object3D();
    raycaster = new THREE.Raycaster();
    pointerNdc = new THREE.Vector2();
    hitPoint = new THREE.Vector3();
    boardPlane = new THREE.Plane(new THREE.Vector3(0, 1, 0), 0);

    camera = new THREE.OrthographicCamera(-1, 1, 1, -1, 0.1, 200);
    var t = V.TILT_DEG * Math.PI / 180;
    camera.position.set(0, V.CAMERA_DISTANCE * Math.cos(t), V.CAMERA_DISTANCE * Math.sin(t));
    camera.lookAt(0, 0, 0);

    rd.tex.glow = glowTexture();
    rd.tex.beam = beamTexture();
    rd.tex.chevron = chevronTexture();
    rd.tex.ring = ringTexture();
    rd.tex.tileGlow = tileGlowTexture();
    rd.tex.frame = frameTexture();
    rd.tex.shard = shardTexture();

    buildLights();
    buildBoard(state);
    rd.buildDynamic();

    rd.scene = scene;
    rd.camera = camera;
    rd.renderer = renderer;
    rd.THREE = THREE;
    rd.ready = true;
    return true;
  };

  /* ---------- layout ---------- */

  rd.applyLayout = function () {
    var app = document.getElementById('app');
    var wrap = document.getElementById('boardWrap');
    var board = document.getElementById('board');
    var vw = global.innerWidth;
    var vh = global.innerHeight;

    var colW = Math.min(vw, Math.round(vh * R.LAYOUT.COLUMN_ASPECT));
    app.style.width = colW + 'px';
    document.body.classList.toggle('wide', vw > vh);

    var availW = wrap.clientWidth;
    var availH = wrap.clientHeight;
    var cellsW = B.COLS + 2 * V.MARGIN_X;
    var cellsH = B.ROWS + V.MARGIN_TOP + V.MARGIN_BOTTOM;
    var cell = Math.min(availW / cellsW, availH / cellsH);
    if (!(cell > 0)) cell = R.LAYOUT.MIN_CELL;

    var w = Math.max(64, Math.round(cellsW * cell));
    var h = Math.max(64, Math.round(cellsH * cell));
    board.style.width = w + 'px';
    board.style.height = h + 'px';

    rd.cell = cell;
    rd.boardW = w;
    rd.boardH = h;

    if (!rd.ready) return;

    camera.left = -(B.COLS / 2 + V.MARGIN_X);
    camera.right = B.COLS / 2 + V.MARGIN_X;
    camera.top = (B.ROWS / 2 + V.MARGIN_TOP) * cosTilt;
    camera.bottom = -(B.ROWS / 2 + V.MARGIN_BOTTOM) * cosTilt;
    camera.updateProjectionMatrix();
    renderer.setSize(w, h, false);
  };

  /* ---------- coordinate helpers ---------- */

  /* Board-overlay pixel position of a world point. */
  var projScratch = null;
  rd.project = function (x, y, z, out) {
    if (!rd.ready) return null;
    if (!projScratch) projScratch = new THREE.Vector3();
    projScratch.set(x, y, z).project(camera);
    var o = out || {};
    o.x = (projScratch.x * 0.5 + 0.5) * rd.boardW;
    o.y = (-projScratch.y * 0.5 + 0.5) * rd.boardH;
    return o;
  };

  rd.projectCell = function (c, r, y, out) {
    return rd.project(R.grid.worldX(c), y || 0, R.grid.worldZ(r), out);
  };

  /* Convert a client-space pointer position to a board cell, or null. */
  rd.cellFromClient = function (clientX, clientY) {
    if (!rd.ready) return null;
    var board = document.getElementById('board');
    var rect = board.getBoundingClientRect();
    if (rect.width <= 0 || rect.height <= 0) return null;
    pointerNdc.x = ((clientX - rect.left) / rect.width) * 2 - 1;
    pointerNdc.y = -((clientY - rect.top) / rect.height) * 2 + 1;
    raycaster.setFromCamera(pointerNdc, camera);
    if (!raycaster.ray.intersectPlane(boardPlane, hitPoint)) return null;
    var c = R.grid.colFromWorldX(hitPoint.x);
    var r = R.grid.rowFromWorldZ(hitPoint.z);
    if (!R.grid.inBounds(c, r)) return null;
    return { c: c, r: r, i: R.grid.idx(c, r) };
  };


  /* ---------- dynamic layer: lit tiles, beams and pieces ---------- */

  var CELLS = B.COLS * B.ROWS;
  var MAX_PIECES = 48;
  var LIT_Y = 0.035;
  var BEAM_Y = 0.16;
  var PIECE_Y = 0.0;

  var dyn = {};
  var scratchColor = null;
  var hiddenMatrix = null;

  /* Rotation that lays a plane flat and points its length along a direction. */
  function dirAngle(dir) {
    return -Math.atan2(R.grid.DC[dir], -R.grid.DR[dir]);
  }

  function additiveMaterial(map, color) {
    return new THREE.MeshBasicMaterial({
      map: map || null,
      color: color,
      transparent: true,
      depthWrite: false,
      blending: THREE.AdditiveBlending
    });
  }

  function makeInstanced(geo, mat, count, order) {
    var mesh = new THREE.InstancedMesh(geo, mat, count);
    mesh.frustumCulled = false;
    mesh.renderOrder = order || 0;
    /* Allocate the colour attribute up front, then draw nothing until filled. */
    for (var i = 0; i < count; i++) {
      mesh.setMatrixAt(i, hiddenMatrix);
      mesh.setColorAt(i, scratchColor.setHex(0xffffff));
    }
    mesh.count = 0;
    mesh.instanceMatrix.needsUpdate = true;
    if (mesh.instanceColor) mesh.instanceColor.needsUpdate = true;
    scene.add(mesh);
    return mesh;
  }

  /* A writer that fills instances in order and hides the leftovers. */
  function Filler(mesh) {
    this.mesh = mesh;
    this.n = 0;
  }

  Filler.prototype.push = function (x, y, z, rotZ, sx, sy, colorHex) {
    var mesh = this.mesh;
    if (this.n >= mesh.instanceMatrix.count) return;
    dummy.position.set(x, y, z);
    dummy.rotation.set(-Math.PI / 2, 0, rotZ);
    dummy.scale.set(sx, sy, 1);
    dummy.updateMatrix();
    mesh.setMatrixAt(this.n, dummy.matrix);
    mesh.setColorAt(this.n, scratchColor.setHex(colorHex));
    this.n++;
  };

  Filler.prototype.pushObject = function (obj, colorHex) {
    var mesh = this.mesh;
    if (this.n >= mesh.instanceMatrix.count) return;
    obj.updateMatrix();
    mesh.setMatrixAt(this.n, obj.matrix);
    mesh.setColorAt(this.n, scratchColor.setHex(colorHex));
    this.n++;
  };

  /*
   * Only the instances actually written are drawn. Lowering `count` rather than
   * hiding the leftovers keeps unused instances out of the vertex shader.
   */
  Filler.prototype.finish = function () {
    var mesh = this.mesh;
    mesh.count = this.n;
    mesh.instanceMatrix.needsUpdate = true;
    if (mesh.instanceColor) mesh.instanceColor.needsUpdate = true;
    this.n = 0;
  };

  rd.buildDynamic = function () {
    scratchColor = new THREE.Color();
    hiddenMatrix = new THREE.Matrix4().makeScale(0, 0, 0);

    var quad = new THREE.PlaneGeometry(1, 1);

    dyn.litGlow = makeInstanced(quad, additiveMaterial(rd.tex.tileGlow, 0xffffff), CELLS, 1);
    /* One tile marker, used to point at a suggested first placement. */
    dyn.suggest = makeInstanced(quad, additiveMaterial(rd.tex.tileGlow, 0xffffff), 1, 1);
    dyn.beamGlow = makeInstanced(quad, additiveMaterial(rd.tex.beam, 0xffffff), B.MAX_SEGMENTS, 2);
    dyn.beamCore = makeInstanced(quad, additiveMaterial(rd.tex.beam, 0xffffff), B.MAX_SEGMENTS, 3);
    dyn.bounce = makeInstanced(quad, additiveMaterial(rd.tex.glow, 0xffffff), 32, 4);
    dyn.previewBeam = makeInstanced(quad, additiveMaterial(rd.tex.beam, 0xffffff), 64, 1);

    /* Mirror: a thin bright slab standing on the tile at 45 degrees. */
    dyn.mirrorBody = makeInstanced(
      new THREE.BoxGeometry(0.92, 0.26, 0.09),
      new THREE.MeshLambertMaterial({ color: C.mirror, emissive: 0x24486b, emissiveIntensity: 0.6 }),
      MAX_PIECES
    );
    dyn.mirrorEdge = makeInstanced(
      new THREE.BoxGeometry(0.94, 0.05, 0.13),
      additiveMaterial(null, C.mirrorEdge),
      MAX_PIECES,
      2
    );

    /* Splitter: a translucent violet cube with a bright internal diagonal. */
    dyn.splitterBody = makeInstanced(
      new THREE.BoxGeometry(0.72, 0.42, 0.72),
      new THREE.MeshLambertMaterial({
        color: C.splitter, emissive: 0x3b1d6b, emissiveIntensity: 0.8,
        transparent: true, opacity: 0.62
      }),
      MAX_PIECES
    );
    dyn.splitterPlane = makeInstanced(
      new THREE.BoxGeometry(0.98, 0.30, 0.05),
      additiveMaterial(null, 0xdcc7ff),
      MAX_PIECES,
      2
    );

    /* Reflector: a golden cup that throws the light straight back. */
    dyn.reflectorCup = makeInstanced(
      new THREE.CylinderGeometry(0.38, 0.20, 0.34, 14, 1, true),
      new THREE.MeshLambertMaterial({
        color: C.reflector, emissive: 0x6b4a12, emissiveIntensity: 0.7, side: THREE.DoubleSide
      }),
      MAX_PIECES
    );
    dyn.reflectorDisc = makeInstanced(
      new THREE.CircleGeometry(0.19, 14),
      additiveMaterial(null, 0xffe6a8),
      MAX_PIECES,
      2
    );

    /* Lamp: a lantern with a notch showing which way it points. */
    dyn.lampBody = makeInstanced(
      new THREE.CylinderGeometry(0.22, 0.27, 0.40, 6),
      new THREE.MeshLambertMaterial({ color: C.lamp, emissive: 0xa85f10, emissiveIntensity: 1.0 }),
      MAX_PIECES
    );
    dyn.lampNotch = makeInstanced(
      new THREE.BoxGeometry(0.14, 0.14, 0.30),
      additiveMaterial(null, 0xffe9b0),
      MAX_PIECES,
      2
    );

    dyn.pieceObj = new THREE.Object3D();
    buildEnemies();
    buildHighlights();
    buildParticles();
    dyn.pulse = makeInstanced(new THREE.PlaneGeometry(1, 1),
      additiveMaterial(rd.tex.glow, 0xffffff), 6, 9);
  };

  /*
   * Colour tracks the fraction of the source power that is left, so light
   * that has been through an enemy is visibly amber and then red. Width tracks
   * absolute power, so upgrading the core thickens every beam.
   */
  function beamColor(fraction) {
    if (fraction >= 0.86) return C.beamHot;
    if (fraction >= 0.45) return R.util.mixColor(C.beamMid, C.beamHot, (fraction - 0.45) / 0.41);
    return R.util.mixColor(C.beamLow, C.beamMid, R.util.clamp(fraction / 0.45, 0, 1));
  }

  function beamWidth(power) {
    return 0.09 + 0.27 * R.util.clamp(power / 35, 0, 1);
  }

  /*
   * Only road cells glow. That is the number the player is pushing (LIT n/25),
   * and it keeps light spilling over buildable tiles from washing the board out.
   */
  function drawLitTiles(state) {
    var f = new Filler(dyn.litGlow);
    var lit = state.beam.lit;
    var kinds = state.grid.kind;
    var srcPower = R.beam.corePower(state.coreLevel);
    for (var i = 0; i < CELLS; i++) {
      var p = lit[i];
      if (p <= 0) continue;
      if (kinds[i] !== R.ROAD && kinds[i] !== R.SPAWN) continue;
      var c = i % B.COLS;
      var r = (i - c) / B.COLS;
      var strength = R.util.clamp(p / srcPower, 0.06, 1);
      var hue = R.util.mixColor(C.beamLow, C.litGlow, R.util.clamp(strength * 1.5, 0, 1));
      var col = R.util.mixColor(0x000000, hue, 0.10 + 0.38 * strength);
      f.push(R.grid.worldX(c), LIT_Y, R.grid.worldZ(r), 0, 1.06, 1.06, col);
    }
    f.finish();
  }

  var SWEEP_SPEED = 60;
  var sweepLength = 999;
  var lastRouteVersion = -1;

  /* A re-routed beam travels out from the source instead of appearing at once. */
  function advanceSweep(state, dtReal) {
    if (state.routeVersion !== lastRouteVersion) {
      lastRouteVersion = state.routeVersion;
      sweepLength = 0;
    }
    if (sweepLength < 999) sweepLength += SWEEP_SPEED * dtReal;
    if (sweepLength > 200) sweepLength = 999;
  }

  rd.sweepLength = function () {
    return sweepLength;
  };

  rd.previewCount = function () {
    return dyn.previewBeam ? dyn.previewBeam.__previewCount || 0 : 0;
  };

  rd.resetSweep = function () {
    sweepLength = 999;
    lastRouteVersion = -1;
  };

  function drawBeams(state) {
    var glow = new Filler(dyn.beamGlow);
    var core = new Filler(dyn.beamCore);
    var bounce = new Filler(dyn.bounce);
    var segs = state.beam.segments;
    var n = state.beam.segCount;

    for (var i = 0; i < n; i++) {
      var s = segs[i];
      var len = Math.abs(s.x1 - s.x0) + Math.abs(s.z1 - s.z0);
      if (len <= 0.001) continue;

      /* Trim the far end of the segment while the sweep is still travelling. */
      var visible = len;
      if (sweepLength < 999) {
        var avail = sweepLength - s.dist0;
        if (avail <= 0) continue;
        if (avail < len) visible = avail;
      }
      var fx = s.x1 === s.x0 ? 0 : (s.x1 - s.x0) / len;
      var fz = s.z1 === s.z0 ? 0 : (s.z1 - s.z0) / len;
      var ex = s.x0 + fx * visible;
      var ez = s.z0 + fz * visible;
      var mx = (s.x0 + ex) / 2;
      var mz = (s.z0 + ez) / 2;

      var rot = dirAngle(s.dir);
      var power = s.powerStart;
      var frac = s.sourcePower > 0 ? R.util.clamp(power / s.sourcePower, 0, 1) : 0;
      var col = beamColor(frac);
      var w = beamWidth(power);
      var lift = feel.gutter * (1 + feel.flare);
      if (feel.flare > 0) col = R.util.mixColor(col, 0xffffff, Math.min(1, feel.flare));
      glow.push(mx, BEAM_Y, mz, rot, w * 1.7 * (1 + feel.flare * 0.5), visible + 0.04,
        R.util.mixColor(0x000000, col, (0.09 + 0.21 * frac) * lift));
      core.push(mx, BEAM_Y + 0.005, mz, rot, w * (0.34 + 0.2 * frac) * (1 + feel.flare * 0.4), visible + 0.04,
        R.util.mixColor(0x000000, col, (0.34 + 0.56 * frac) * lift));
      if (s.bendAtStart) {
        bounce.push(s.x0, BEAM_Y + 0.01, s.z0, 0, 0.55, 0.55, R.util.mixColor(0x000000, col, 0.2 + 0.3 * frac));
      }
    }
    glow.finish();
    core.finish();
    bounce.finish();
  }

  /* ---------- ghost beam while dragging ---------- */

  var previewKey = '';
  var previewResult = null;

  /*
   * A pulsing marker over the tile the opening suggests. It is only ever set
   * for a player who has not placed anything yet, and it goes out the moment
   * they do, so it points once and then leaves them alone.
   */
  function drawSuggestion(state) {
    var f = new Filler(dyn.suggest);
    var cell = state.ui.suggest;
    if (cell) {
      var pulse = 0.45 + 0.35 * Math.sin(state.time * 4.5);
      f.push(R.grid.worldX(cell.c), LIT_Y + 0.02, R.grid.worldZ(cell.r), 0, 1.02, 1.02,
        R.util.mixColor(0x000000, C.valid, pulse));
    }
    f.finish();
  }

  function drawPreview(state) {
    var d = state.ui.drag;
    var f = new Filler(dyn.previewBeam);
    if (!d || !d.dragging || !d.cell || !d.valid) {
      previewKey = '';
      dyn.previewBeam.__previewCount = 0;
      f.finish();
      return;
    }

    var orient = 0;
    var removeIndex = null;
    if (d.kind === 'piece') {
      var p = R.pieces.byId(state, d.pieceId);
      if (p) {
        orient = p.type === 'lamp' ? p.dir : p.orient;
        removeIndex = R.grid.idx(d.fromC, d.fromR);
      }
    } else {
      orient = R.beam.bestOrientation(state, d.type, d.cell.c, d.cell.r);
    }

    var key = d.type + '|' + d.cell.i + '|' + orient + '|' + state.coreLevel + '|' + state.pieces.size;
    if (key !== previewKey) {
      previewKey = key;
      previewResult = R.beam.preview(state, d.type, d.cell.c, d.cell.r, orient, removeIndex);
    }
    if (!previewResult) {
      dyn.previewBeam.__previewCount = 0;
      f.finish();
      return;
    }
    for (var i = 0; i < previewResult.segCount; i++) {
      var s = previewResult.segments[i];
      var len = Math.abs(s.x1 - s.x0) + Math.abs(s.z1 - s.z0);
      if (len <= 0.001) continue;
      f.push((s.x0 + s.x1) / 2, BEAM_Y + 0.02, (s.z0 + s.z1) / 2, dirAngle(s.dir),
        0.30, len, 0x1d5f77);
    }
    dyn.previewBeam.__previewCount = f.n;
    f.finish();
  }

  var POP_TIME = 0.22;

  function pieceScale(state, p) {
    var age = state.time - p.placedAt;
    var s = 1;
    if (age >= 0 && age < POP_TIME) {
      var t = age / POP_TIME;
      s = 0.2 + 1.0 * R.util.easeOutBack(t);
    }
    if (p.inactiveUntil > state.time) s *= 0.72;
    return s;
  }

  function drawPieces(state) {
    var fills = {
      mirrorBody: new Filler(dyn.mirrorBody),
      mirrorEdge: new Filler(dyn.mirrorEdge),
      splitterBody: new Filler(dyn.splitterBody),
      splitterPlane: new Filler(dyn.splitterPlane),
      reflectorCup: new Filler(dyn.reflectorCup),
      reflectorDisc: new Filler(dyn.reflectorDisc),
      lampBody: new Filler(dyn.lampBody),
      lampNotch: new Filler(dyn.lampNotch)
    };
    var o = dyn.pieceObj;
    var it = state.pieces.values();
    var entry = it.next();
    while (!entry.done) {
      var p = entry.value;
      var x = R.grid.worldX(p.c);
      var z = R.grid.worldZ(p.r);
      var sc = pieceScale(state, p);
      var dragging = state.ui.drag && state.ui.drag.pieceId === p.id;
      var dim = (p.inactiveUntil > state.time || dragging) ? 0.45 : 1;
      var diag = p.orient === 0 ? Math.PI / 4 : -Math.PI / 4;
      var flip = flipTimes[p.id];
      if (flip) {
        var ft = (realClock - flip.at) / 0.12;
        if (ft >= 1) delete flipTimes[p.id];
        else diag += (1 - R.util.easeOutCubic(ft)) * flip.dir * Math.PI / 2;
      }

      if (p.type === 'mirror') {
        o.position.set(x, PIECE_Y + 0.13 * sc, z);
        o.rotation.set(0, diag, 0);
        o.scale.set(sc, sc, sc);
        fills.mirrorBody.pushObject(o, R.util.mixColor(0x101820, 0xffffff, dim));
        o.position.y = PIECE_Y + 0.26 * sc;
        fills.mirrorEdge.pushObject(o, R.util.mixColor(0x000000, C.mirrorEdge, dim));
      } else if (p.type === 'splitter') {
        o.position.set(x, PIECE_Y + 0.21 * sc, z);
        o.rotation.set(0, 0, 0);
        o.scale.set(sc, sc, sc);
